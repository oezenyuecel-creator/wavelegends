// ---------- 🌈 Manta-Flug ----------
// Du reitest einen Mantarochen durch klares Tropenwasser und fliegst durch bunte Ringe – unter Wasser und hoch in der Luft.
// HALTEN = abtauchen, LOSLASSEN = hochschießen. Je tiefer du tauchst, desto höher springt der Manta aus dem Wasser.
// Ringe in Folge erhöhen den Multiplikator, 6 am Stück = Regenbogen-Kette. Kein Game Over: verpasste Ringe brechen nur die Kette.
// Die Ringe legt ein „Geist" mit derselben Physik vorweg – jeder Ring liegt auf einer echten, fliegbaren Bahn.
const MANTA_TIME=40, MANTA_FLOOR=300, MANTA_G=700, MANTA_G_HOLD=1400, MANTA_LEAP=0.82;
const MANTA_RING=62, MANTA_PERFECT=16, MANTA_HINT=2.4;
const RING_COLS=['#ff4a5a','#ff9a2b','#ffd83a','#3ddc84','#3aa0ff','#a05cff'];
function mantaZoom(){ return clamp(W/400, 0.8, 1); }
function mantaSpeed(t){ return 270+Math.min(t,32)*2.5; }
// Gemeinsame Physik für Spieler und Geist. y: Wasseroberfläche = 0, unter Wasser positiv, in der Luft negativ.
// Unter Wasser ruhig steuerbar wie in der Lagune; beim Auftauchen springt der Manta so hoch, wie er vorher tief war
// (Sprunghöhe = 0,82 × Tauchtiefe) – das ist die eine Regel, die man lernen muss.
function mantaStep(s,hold,dt){
  const air=s.y<0;
  if(air) s.vy+=(hold?MANTA_G_HOLD:MANTA_G)*dt;
  else { s.vy+=(hold?1000:-800)*dt; s.vy*=1-1.8*dt; s.vy=clamp(s.vy,-300,300); s.dive=Math.max(s.dive||0, s.y); }
  s.y+=s.vy*dt;
  if(air && s.y>=0){ s.vy*=0.5; s.dive=s.y; s.splash=true; }                          // Eintauchen bremst
  else if(!air && s.y<0){
    if((s.dive||0)>=35){ s.vy=-Math.sqrt(2*MANTA_G*MANTA_LEAP*s.dive); s.leap=true; }   // Sprung aus dem Wasser
    else { s.y=0; s.vy=Math.max(s.vy,0); }                                             // nur aufgetaucht: an der Oberfläche treiben
    s.dive=0; }
  if(s.y>MANTA_FLOOR){ s.y=MANTA_FLOOR; if(s.vy>0) s.vy=0; }
  s.t+=dt; s.x+=mantaSpeed(s.t)*dt;
}
function initManta(){
  const b=bonus;
  Object.assign(b,{ p:{x:0,y:40,vy:0,t:0}, g:{x:0,y:40,vy:0,t:0, plan:[], lastRingT:-1, lastVy:0, ringIdx:0, sinceRing:[]},
    rings:[], combo:0, mult:1, chainCols:[], chains:0, bestChain:0, ringsHit:0, ringsAll:0, perfects:0, ending:0, bubbleT:0, trail:[], wasAir:false });
}
// Geist: zufällige, aber fliegbare Manöver; Ringe an den Hoch- und Tiefpunkten seiner Bahn
function mantaGhostPlan(g){
  if(g.t<2.5) { g.plan.push({hold:false, dur:0.6}, {hold:true, dur:0.35}, {hold:false, dur:0.5}); return; }
  if(Math.random()<0.55){ g.plan.push({hold:true, dur:rand(0.4,0.95)}, {hold:false, dur:3, until:'back'}); }   // tief tauchen, dann Sprung aus dem Wasser
  else g.plan.push({hold:true, dur:rand(0.3,0.55)}, {hold:false, dur:rand(0.4,0.7)});                         // Welle unter Wasser
}
function mantaGhostStep(dt){
  const b=bonus, g=b.g;
  if(!g.plan.length) mantaGhostPlan(g);
  const seg=g.plan[0];
  g.splash=false; mantaStep(g, seg.hold, dt); seg.dur-=dt;
  if(seg.until==='back' && g.backSeen && g.y>70) seg.dur=0;
  if(g.splash) g.backSeen=true;
  if(seg.dur<=0){ g.plan.shift(); g.backSeen=false; }
  const turned = (g.lastVy<0 && g.vy>=0) || (g.lastVy>0 && g.vy<=0);  // Hoch- oder Tiefpunkt
  g.lastVy=g.vy;
  const since=g.t-g.lastRingT, okY = g.y<-50 || (g.y>45 && g.y<MANTA_FLOOR-35);
  if(g.t>1.6 && g.t<MANTA_TIME-0.3 && okY && ((turned && since>=1.0) || since>=1.8)){
    b.rings.push({x:g.x, y:g.y, col:RING_COLS[g.ringIdx%6], passed:false, hit:false, fx:0}); g.ringIdx++; g.lastRingT=g.t;
    // zwei Perlen auf halbem Weg zwischen den Ringen – als Belohnung und sanfter Hinweis auf die Bahn
    const mid=g.sinceRing[Math.floor(g.sinceRing.length*0.4)], mid2=g.sinceRing[Math.floor(g.sinceRing.length*0.6)];
    for(const m of [mid,mid2]) if(m && Math.abs(m.y)>18) b.ents.push({type:'pearl', x:m.x, y:m.y, r:9});
    g.sinceRing=[];
  } else if(Math.round(g.t*60)%6===0) g.sinceRing.push({x:g.x, y:g.y});
}
function mantaFloat(txt,col){ const p=bonus.p; bonus.floats.push({x:p.x, y:p.y-50, txt, col, life:1.1}); }
function updateManta(dt){
  const b=bonus, p=b.p, Z=mantaZoom(), VW=W/Z;
  while(b.g.x < p.x+VW*2.2 && b.g.t < MANTA_TIME+1) mantaGhostStep(1/60);
  const ox=p.x; p.splash=false; p.leap=false;
  mantaStep(p, b.ending>0 ? false : b.holding, dt); b.t=p.t;
  // Zielhilfe: kurz vor einem Ring zieht er den Manta sanft zur Mitte – nur wenn man schon in der Nähe ist (max. ~35 px)
  const nr=b.rings.find(r=>!r.passed && r.x>=p.x);
  if(nr && b.ending<=0){ const dx=nr.x-p.x, dy=nr.y-p.y;
    if(dx<130 && Math.abs(dy)<110){ let ny=p.y+clamp(dy*4,-150,150)*(1-dx/130)*dt;
      if((p.y>=0)!==(ny>=0)) ny = p.y>=0 ? 0 : -0.5;                    // die Hilfe schiebt nie über die Wasseroberfläche
      p.y=ny; } }
  if(p.leap){ Audio.sfx.jump(); for(let i=0;i<10;i++) b.parts.push({x:p.x+rand(-16,16), y:0, vx:rand(-80,80), vy:-rand(120,320), life:0.7, drop:true}); }
  if(p.splash){ Audio.sfx.splash(); for(let i=0;i<12;i++) b.parts.push({x:p.x+rand(-18,18), y:0, vx:rand(-90,90), vy:-rand(150,360), life:0.7, drop:true}); }
  // Ringe
  for(const r of b.rings){ if(r.passed || p.x<r.x) continue;
    r.passed=true; b.ringsAll++;
    const yy=ox<r.x ? lerp(p.y-p.vy*dt, p.y, (r.x-ox)/Math.max(1,p.x-ox)) : p.y, dy=Math.abs(yy-r.y);
    if(dy<=MANTA_RING){
      r.hit=true; r.fx=1; b.ringsHit++; b.combo++; b.chainCols.push(r.col); b.bestChain=Math.max(b.bestChain,b.combo);
      b.mult=Math.min(4, 1+Math.floor(b.combo/4));
      const perfect=dy<=MANTA_PERFECT, gain=6+2*b.mult+(perfect?2:0); b.pearls+=gain; if(perfect) b.perfects++;
      mantaFloat((perfect?'PERFEKT! ':'')+'+'+gain, perfect?'#7dffb0':r.col); Audio.sfx.collect(b.combo);
      if(b.chainCols.length===6){ b.chainCols=[]; b.chains++;                 // Regenbogen-Kette
        if(b.chains===1){ b.tokens=1; bonusMsg('🌈 Regenbogen-Kette!',1.6); }
        else if(b.gems<1){ b.gems=1; bonusMsg('🌈 Noch eine Kette! 💎 +1',1.6); }
        else { b.pearls+=20; bonusMsg('🌈 Kette! +20 ◐',1.4); }
        Audio.sfx.chest(); }
    } else { r.fx=-1; if(b.combo>=3) mantaFloat('Kette gerissen','#e6f6ff'); b.combo=0; b.mult=1; b.chainCols=[]; }
  }
  for(const r of b.rings) if(r.fx>0) r.fx=Math.max(0,r.fx-dt*1.6);
  b.rings=b.rings.filter(r=>r.x>p.x-VW*0.5);
  // Perlen
  for(const e of b.ents){ if(e.got) continue; const dx=e.x-p.x, dy=e.y-p.y, rr=e.r+22; if(dx*dx+dy*dy>rr*rr) continue; e.got=true; b.pearls+=2; Audio.sfx.collect(b.pearls/2); }
  b.ents=b.ents.filter(e=>!e.got && e.x>p.x-VW*0.5);
  // Blasen, Spritzer, Spur
  if(p.y>10){ b.bubbleT-=dt; if(b.bubbleT<=0){ b.bubbleT=0.12; b.parts.push({x:p.x-24, y:p.y-4, vx:-20, vy:-60-rand(40), life:1.1, r:rand(1.5,3.5)}); } }
  for(const q of b.parts){ q.x+=q.vx*dt; if(q.drop) q.vy+=900*dt; q.y+=q.vy*dt; q.life-=dt; if(!q.drop && q.y<0) q.life=0; }
  b.parts=b.parts.filter(q=>q.life>0);
  b.trail.push({x:p.x, y:p.y}); if(b.trail.length>18) b.trail.shift();
  if(b.ending>0){ b.ending-=dt; if(b.ending<=0) endBonus(); }
  else if(b.t>=MANTA_TIME){ b.ending=1.6; bonusMsg(b.chains?'🌈 Super geflogen!':'🌊 Geschafft!',1.6); }
}

  ctx.fillStyle='#e8d29a'; ctx.beginPath(); ctx.moveTo(0,VH); for(let s=0;s<=VW+10;s+=10) ctx.lineTo(s, fy+Math.sin((s+camX)/90)*8); ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
  const cols=['#ff6b8a','#ffb03a','#c86bff','#ff8a5a','#3ddc84'];
  for(let k=Math.floor(camX/60)-1;k<(camX+VW)/60+1;k++){ const cx=X(k*60+hash01(k)*30), base=fy+Math.sin((k*60+camX*0)/90)*8+4, hh=20+hash01(k+3)*40, col=cols[Math.floor(hash01(k+11)*5)];
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=5; ctx.lineCap='round';
    if(hash01(k+5)<0.5){ ctx.beginPath(); for(let j=-1;j<=1;j++){ ctx.moveTo(cx,base); ctx.quadraticCurveTo(cx+j*10,base-hh*0.6,cx+j*15,base-hh); } ctx.stroke(); }
    else { ctx.beginPath(); ctx.ellipse(cx,base,hh*0.4,hh*0.6,0,Math.PI,0); ctx.fill(); } }
  // hintere Ringhälften, Perlen
  for(const r of b.rings){ const rx=X(r.x); if(rx>-40 && rx<VW+40) drawMantaRing(rx,Y(r.y),r,-1); }
  for(const e of b.ents){ const ex=X(e.x), ey=Y(e.y); if(ex<-20||ex>VW+20) continue;
    const gg=ctx.createRadialGradient(ex-2,ey-2,1,ex,ey,9); gg.addColorStop(0,'#ffffff'); gg.addColorStop(1,'#ffd9f0'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(ex,ey,7.5,0,TAU); ctx.fill(); }
  // Spieler: Spur, Manta mit Surfer
  drawTrailDots(save.trail, b.trail.map(q=>({x:X(q.x)-20, y:Y(q.y)})), {foam:'#e8fdff'});
  const air=p.y<0, rot=clamp(p.vy/900,-0.6,0.6), px=X(p.x), py=Y(p.y);
  ctx.save(); ctx.translate(px,py); ctx.rotate(rot);
  drawManta(0,4,1,t,0,air);
  ctx.translate(-2,-6); ctx.scale(0.72,0.72);
  drawCharacter(BOARDS[save.board]||BOARDS.wood, SURFERS[save.surfer]||SURFERS.kai, {c:b.holding?1:0.5, t:0, g:0, u:air&&p.vy<0?0.6:0}, t);
  ctx.restore();
  // vordere Ringhälften über dem Manta
  for(const r of b.rings){ const rx=X(r.x); if(rx>-40 && rx<VW+40) drawMantaRing(rx,Y(r.y),r,1); }
  // Wasseroberfläche
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2.5; ctx.beginPath();
  for(let s=0;s<=VW;s+=10){ const yy=sy+Math.sin((s+camX)/45+t/280)*2.5; s?ctx.lineTo(s,yy):ctx.moveTo(s,yy); } ctx.stroke();
  ctx.save(); for(const q of b.parts){ ctx.globalAlpha=clamp(q.life,0,1);
    if(q.drop){ ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(X(q.x),Y(q.y),2.6,0,TAU); ctx.fill(); }
    else { ctx.strokeStyle='rgba(230,250,255,.8)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(X(q.x),Y(q.y),q.r,0,TAU); ctx.stroke(); } } ctx.restore();
  // kommende Ringe am rechten Rand ankündigen: Farbe + Höhe
  let shown=0;
  for(const r of b.rings){ if(r.passed) continue; const rx=X(r.x), tta=(r.x-p.x)/mantaSpeed(b.t);
    if(rx<VW-6 || tta>MANTA_HINT || shown>=2) continue; shown++;
    const k=1-tta/MANTA_HINT, yy=clamp(Y(r.y),40,VH-40);
    ctx.save(); ctx.globalAlpha=0.55+0.45*k; ctx.fillStyle=rgba(r.col,0.45); ctx.beginPath(); ctx.arc(VW-24,yy,20,0,TAU); ctx.fill();
    ctx.strokeStyle=r.col; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(VW-24,yy,7,14,0,0,TAU); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(VW-24,yy,20,-Math.PI/2,-Math.PI/2+TAU*k); ctx.stroke(); ctx.restore(); }
  drawBonusFloats(X, Y);
  ctx.restore();
}

function drawWorldPreview(key,x,y,w,h){
  const P=palOf(key), t=perfNow(), A=ctx.globalAlpha;
  ctx.save(); roundRect(x,y,w,h,14); ctx.clip();
  const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,P.sky[0]); g.addColorStop(1,P.sky[1]); ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  for(let i=0;i<28;i++){ ctx.globalAlpha=A*(0.35+0.65*Math.abs(Math.sin(t/600+i*1.7))); ctx.fillStyle='#fff'; ctx.fillRect(x+((i*73)%w), y+((i*41)%(h*0.55)), 1.6, 1.6); }
  ctx.globalAlpha=A;
  if(key==='aurora'){
    ctx.globalCompositeOperation='screen';
    for(let b=0;b<2;b++){ const yy=y+h*(0.16+b*0.16); ctx.beginPath();
      for(let xx=0;xx<=w;xx+=8) ctx.lineTo(x+xx, yy+Math.sin(xx/34+t/900+b)*8);
      for(let xx=w;xx>=0;xx-=8) ctx.lineTo(x+xx, yy+22+Math.sin(xx/34+t/900+b)*8);
      ctx.closePath(); ctx.fillStyle=b?'rgba(122,92,255,.38)':'rgba(122,255,192,.42)'; ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
  } else {
    const mx=x+w*0.74, my=y+h*0.28, mg=ctx.createRadialGradient(mx,my,2,mx,my,h*0.38);
    mg.addColorStop(0,rgba(P.sunGlow,0.6)); mg.addColorStop(1,rgba(P.sunGlow,0)); ctx.fillStyle=mg; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=P.sun; ctx.beginPath(); ctx.arc(mx,my,h*0.09,0,TAU); ctx.fill();
  }
  const wy=y+h*0.68, wl=xx=>wy+Math.sin(xx/22+t/500)*4;
  ctx.beginPath(); ctx.moveTo(x,y+h); for(let xx=0;xx<=w;xx+=6) ctx.lineTo(x+xx, wl(xx)); ctx.lineTo(x+w,y+h); ctx.closePath();
  ctx.fillStyle=P.water[1]; ctx.fill();
  ctx.strokeStyle=rgba(P.foam,0.85); ctx.lineWidth=2; ctx.beginPath(); for(let xx=0;xx<=w;xx+=6){ xx?ctx.lineTo(x+xx,wl(xx)):ctx.moveTo(x,wl(0)); } ctx.stroke();
  if(key==='biolum'){ for(let i=0;i<18;i++){ ctx.globalAlpha=A*(0.3+0.6*Math.abs(Math.sin(t/350+i))); ctx.fillStyle=P.foam; ctx.beginPath(); ctx.arc(x+((i*53)%w), wy+9+((i*13)%Math.max(4,y+h-wy-12)), 1.8,0,TAU); ctx.fill(); } }
  ctx.restore();
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5; roundRect(x,y,w,h,14); ctx.stroke(); ctx.restore();
}

    p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.c; ctx.fillRect(-4,-2.5,8,5); ctx.restore(); }
  if(unlockMsg.t>0){ unlockMsg.t-=dt;
    ctx.save(); ctx.globalAlpha=clamp(unlockMsg.t/0.4,0,1); ctx.font='700 13px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw2=ctx.measureText(unlockMsg.text).width+32; roundRect((W-tw2)/2, H-64, tw2, 34, 17); ctx.fillStyle='rgba(20,35,58,.95)'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(unlockMsg.text, W/2, H-47); ctx.restore(); }
}
function unlockClick(x,y){ const id=hitButton(x,y); if(!id) return; Audio.sfx.button();
  if(id==='buy') unlockConfirm=true;
  else if(id==='cancel') unlockConfirm=false;
  else if(id==='confirm'){ unlockConfirm=false; grantFullVersion(); burstConfetti(); Audio.sfx.chest(); Audio.sfx.chime(); unlockMsg={t:3,text:'Danke! 🎉 Die Nacht-Welten sind frei.'}; }
  else if(id==='later') state=unlockFrom;
  else if(id==='go') startGame();
  else if(id==='restore') unlockMsg={t:2.6,text:'Wiederherstellen kommt mit der App-Store-Version.'};
  else if(id==='reset'){ revokeFullVersion(); unlockMsg={t:2.2,text:'Zurückgesetzt – wieder Gratis-Version.'}; }
}

//////////////////// Rekord teilen ////////////////////
// Bild wird beim Auswertungs-Screen vorbereitet: navigator.share braucht eine frische Nutzer-Geste,
// ein asynchrones toBlob() im Klick-Handler würde sie auf iOS verbrauchen.
let shareFile=null, shareCanvas=null, pendingShare=false;
const SHARE_URL='https://oezenyuecel-creator.github.io/wavelegends/';
function prepareShareImage(){
  shareFile=null;
  const c=document.createElement('canvas'); c.width=1080; c.height=1350; const g=c.getContext('2d');
  const P=pal(player.dist), rp=runReport, dist=Math.floor(player.dist).toLocaleString('de-DE');
  const sg=g.createLinearGradient(0,0,0,1350); sg.addColorStop(0,P.sky[0]); sg.addColorStop(1,P.sky[1]); g.fillStyle=sg; g.fillRect(0,0,1080,1350);
  const gl=g.createRadialGradient(790,330,20,790,330,440); gl.addColorStop(0,rgba(P.sunGlow,0.6)); gl.addColorStop(1,rgba(P.sunGlow,0)); g.fillStyle=gl; g.fillRect(0,0,1080,1350);
  g.fillStyle=P.sun; g.beginPath(); g.arc(790,330,95,0,TAU); g.fill();
  if(P.starA>0.3){ for(let i=0;i<90;i++){ g.globalAlpha=P.starA*(0.4+0.6*Math.random()); g.fillStyle='#fff'; g.beginPath(); g.arc(Math.random()*1080, Math.random()*700, Math.random()*2.6+0.6,0,TAU); g.fill(); } g.globalAlpha=1; }
  const wave=x=>990+Math.sin(x/170)*60+Math.sin(x/61)*18;
  g.beginPath(); g.moveTo(0,1350); for(let x=0;x<=1080;x+=10) g.lineTo(x,wave(x)); g.lineTo(1080,1350); g.closePath();
  const wg=g.createLinearGradient(0,900,0,1350); wg.addColorStop(0,P.water[0]); wg.addColorStop(0.5,P.water[1]); wg.addColorStop(1,P.water[2]); g.fillStyle=wg; g.fill();
  g.strokeStyle=rgba(P.foam,0.9); g.lineWidth=8; g.beginPath(); for(let x=0;x<=1080;x+=10){ x?g.lineTo(x,wave(x)):g.moveTo(0,wave(0)); } g.stroke();
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.font='150px system-ui'; g.fillText('🏄', 330, wave(330)+24);
  g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=18; g.fillStyle='#fff';

    g.font='700 44px system-ui'; g.fillStyle='rgba(255,255,255,.95)'; g.fillText(st.join('   ·   '), 540, 575); }
  g.font='800 54px system-ui'; g.fillStyle='#fff'; g.fillText('Schaffst du das?', 540, 1210);
  g.font='600 34px system-ui'; g.fillStyle='rgba(255,255,255,.88)'; g.fillText(SHARE_URL.replace('https://','').replace(/\/$/,''), 540, 1270);

function doShare(){
  const text='Ich bin '+Math.floor(player.dist).toLocaleString('de-DE')+' m bei Wave Legends gesurft 🌊 Schaffst du das?';
  try{
    if(shareFile && navigator.canShare && navigator.canShare({files:[shareFile]})){ navigator.share({files:[shareFile], text:text+' '+SHARE_URL}).catch(()=>{}); return; }
    if(navigator.share){ navigator.share({title:'Wave Legends', text, url:SHARE_URL}).catch(()=>{}); return; }
  }catch(e){}
  if(shareCanvas){ const a=document.createElement('a'); a.download='wave-legends-rekord.jpg'; a.href=shareCanvas.toDataURL('image/jpeg',0.92); document.body.appendChild(a); a.click(); a.remove(); }

//////////////////// Eingefrorene Szene (Pause / Auswertung) ////////////////////
// cam.shake wird nur im Spiel-Update abgebaut und einige Effekte würfeln pro Frame neu –
// deshalb einmal ruhig rendern und als Standbild wiederverwenden.
let frozenSnap=null;
function drawFrozenScene(withHud){
  if(!frozenSnap || frozenSnap.width!==cv.width || frozenSnap.height!==cv.height || frozenSnap.hud!==withHud){
    cam.shake=0; drawScene(withHud);
    frozenSnap=document.createElement('canvas'); frozenSnap.width=cv.width; frozenSnap.height=cv.height; frozenSnap.hud=withHud;
    frozenSnap.getContext('2d').drawImage(cv,0,0);
  }
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(frozenSnap,0,0); ctx.restore();
}

  drawFrozenScene(true);
  ctx.save(); ctx.fillStyle='rgba(4,18,31,.6)'; ctx.fillRect(0,0,W,H);

//////////////////// Screen: Game Over ////////////////////
function wrapText(txt, cx, y, maxW, lh){
  const lines=[]; let line='';
  for(const w of txt.split(' ')){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,cx,y+i*lh)); return y+(lines.length-1)*lh;
}
function drawOver(){
  drawFrozenScene(false); // ohne HUD/Banner
  const rp=runReport;
  ctx.save(); ctx.fillStyle='rgba(4,18,31,.8)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const cw=Math.min(W-32,420), cx=W/2, x0=cx-cw/2;
  let y=Math.max(44,H*0.07);
  const overTitle = player.newBest? '🏁 NEUER REKORD!' : (player.deathBy==='shark'? '🦈 GEFRESSEN!' : '🌊 EINGEHOLT!');
  ctx.font='900 28px system-ui'; ctx.fillStyle='#fff'; ctx.fillText(overTitle, cx, y);
  y+=48; ctx.font='800 44px system-ui'; ctx.fillStyle=player.newBest?'#ffe36b':'#7fe8ff'; ctx.fillText(Math.floor(player.dist)+' m', cx, y);
  if(rp && rp.xp){ // Surfer-Rang: Fortschritt dieses Laufs
    const li=levelInfo(save.xp), xbw=Math.min(220,cw*0.7);
    y+=26; ctx.font='700 13px system-ui'; ctx.fillStyle='#ffe36b'; ctx.fillText('Lv '+li.level+' · '+rankTitle(li.level)+'   +'+fmtNum(rp.xp.xp)+' XP', cx, y);
    y+=8; roundRect(cx-xbw/2,y,xbw,6,3); ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fill();
    roundRect(cx-xbw/2,y,Math.max(6,xbw*li.into/li.need),6,3); ctx.fillStyle='#ffe36b'; ctx.fill(); y+=6;
    if(rp.xp.after>rp.xp.before){ y+=20; ctx.font='800 14px system-ui'; ctx.fillStyle='#39e88a';
      y=wrapText('⬆ LEVEL '+rp.xp.after+'!  +'+rp.xp.pearls+' ◐'+(rp.xp.trails.length?' · Neuer Trail: '+rp.xp.trails.map(k=>TRAILS[k].name).join(', '):''), cx, y, cw, 18); }
  }
  if(rp && (rp.gems||(rp.xp&&rp.xp.gems))){ y+=20; ctx.font='700 13px system-ui'; ctx.fillStyle='#d6c4ff';
    ctx.fillText('💎 +'+((rp.gems||0)+((rp.xp&&rp.xp.gems)||0))+' Kristalle', cx, y); }
  if(runStats.achNew.length){ y+=20; ctx.font='600 12px system-ui'; ctx.fillStyle='#d6c4ff'; y=wrapText('🏆 Neu: '+runStats.achNew.join(', '), cx, y, cw, 16); }
  if(rp && rp.ticket){ y+=20; ctx.font='700 13px system-ui'; ctx.fillStyle='#7dfbe8'; ctx.fillText('🎟 +1 Bonus-Ticket (Kraken besiegt)', cx, y); }
  if(rp && rp.cause){ y+=26; ctx.font='500 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.82)'; y=wrapText(rp.cause, cx, y, cw, 17); }
  if(rp){
    // Dieser Run vs. Rekord – 🏆 markiert neue Bestwerte
    y+=16;
    const rows=[['Distanz','dist',v=>v+' m'],['Perlen','pearls',v=>'◐ '+v],['Flips','flips',v=>''+v],['Beste Combo','combo',v=>'x'+(+v).toFixed(1)],['Serie ohne Wipeout','streak',v=>v+' m']];
    const rh=23, cRun=x0+cw*0.70, cRec=x0+cw-14, boxH=rows.length*rh+30;
    roundRect(x0,y,cw,boxH,12); ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fill();
    ctx.font='700 10px system-ui'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.textAlign='right';
    ctx.fillText('DIESER RUN', cRun, y+17); ctx.fillText('REKORD', cRec, y+17);
    rows.forEach(([lab,key,f],i)=>{ const ry=y+38+i*rh;
      ctx.textAlign='left'; ctx.font='500 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.78)'; ctx.fillText(lab, x0+14, ry);
      ctx.textAlign='right'; ctx.font='700 14px system-ui';
      ctx.fillStyle=rp.isNew[key]?'#ffe36b':'#fff'; ctx.fillText((rp.isNew[key]?'🏆 ':'')+f(rp.vals[key]), cRun, ry);
      ctx.font='500 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillText(f(Math.max(rp.vals[key], rp.prev[key]||0)), cRec, ry);
    });
    y+=boxH;
    // Trend der letzten Runs
    const h=rp.history;
    if(h.length>=2){
      y+=22; ctx.textAlign='left'; ctx.font='700 12px system-ui'; ctx.fillStyle='rgba(255,255,255,.78)'; ctx.fillText('Deine letzten Runs', x0, y);
      if(h.length>=6){ const avg=a=>a.reduce((s,v)=>s+v,0)/a.length, a=avg(h.slice(-3)), b=avg(h.slice(-6,-3)), pct=Math.round((a-b)/Math.max(1,b)*100);
        ctx.textAlign='right'; ctx.fillStyle=pct>=0?'#39e88a':'#ffb03a'; ctx.fillText((pct>=0?'▲ +':'▼ ')+pct+'% (Ø letzte 3)', x0+cw, y); }
      y+=8; const ch=H<760?32:44, n=h.length, gap=6, bw=(cw-(n-1)*gap)/n, mx=Math.max(...h,1);
      h.forEach((d,i)=>{ const bh=Math.max(3,ch*d/mx); roundRect(x0+i*(bw+gap), y+ch-bh, bw, bh, 3); ctx.fillStyle=i===n-1?'#7fe8ff':'rgba(255,255,255,.26)'; ctx.fill(); });
      y+=ch;
    }
    if(rp.tip){ y+=24; ctx.textAlign='center'; ctx.font='600 13px system-ui'; ctx.fillStyle='#ffe36b'; y=wrapText('💡 '+rp.tip, cx, y, cw, 17); }
  }
  ctx.restore();
  uiButtons=[]; const bw=Math.min(280,W*0.76), bx=(W-bw)/2, by=Math.min(Math.max(y+22, H-140), H-116);
  // Hoch-Moment: nach dem Kraken oder am Ende der Gratis-Strecke auf die Vollversion hinweisen
  const ctaY=by-58;
  if(!save.fullVersion && (runStats.boss>0 || runStats.gatesSeen>0) && ctaY>y+12)
    btn('unlock_cta',bx,ctaY,bw,46,'🌙 Nacht-Welten freischalten',{c1:'#7a5cff',c2:'#4a2fc0',fs:15});
  btn('retry',bx,by,bw,52,'↻  Nochmal',{c1:'#2fd0ff',c2:'#1b7fd6',fs:20});
  const sw=(bw-12)/3;
  btn('shop2',bx,by+62,sw,44,'🛍 Shop',{c1:'#ffb84d',c2:'#e07a2b',fs:14});
  btn('share',bx+sw+6,by+62,sw,44,'📤 Teilen',{c1:'#39d98a',c2:'#1b8a5a',fs:14});
  btn('menu',bx+2*(sw+6),by+62,sw,44,'⌂ Menü',{c1:'#7a8aa0',c2:'#4a5a70',fs:14});
  drawButtons();
}
function overClick(x,y){ const id=hitButton(x,y); if(!id) return; Audio.sfx.button();
  if(id==='retry') startGame(); else if(id==='menu') state='menu'; else if(id==='shop2'){ state='shop'; shopTab='boards'; }
  else if(id==='share') pendingShare=true; // ausgelöst beim Loslassen (dort zählt die Geste für navigator.share)
  else if(id==='unlock_cta') openUnlock('over'); }

//////////////////// Scene compositor ////////////////////
function drawScene(withHud=true){
  const P=pal(player.dist);
  applyShake();
  ctx.save(); ctx.translate(shakeX,shakeY);
  if(viewZoom>1.004){ const zx=sx(player.x), zy=player.y-cam.y; ctx.translate(zx,zy); ctx.scale(viewZoom,viewZoom); ctx.translate(-zx,-zy); }
  drawBackground(P,player.dist);
  drawWhale(P);   // vor dem Wasser: der Teil unter der Oberfläche wird verdeckt
  drawWater(P);
  drawBestMarker();
  drawChaser(P);
  drawEntities(P);
  drawDolphin(P);
  // particles behind/over water
  for(const p of parts){ ctx.save(); ctx.globalAlpha=clamp(p.life/p.max,0,1); if(p.glow) ctx.globalCompositeOperation='screen';
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx(p.x),p.y-cam.y,p.r,0,TAU); ctx.fill(); ctx.restore(); }
  drawPlayer(P);
  if(player.vx>760){ const a=clamp((player.vx-760)/600,0,1); // Speed-Linien
    ctx.save(); ctx.strokeStyle=rgba('#ffffff',0.22*a); ctx.lineWidth=1.5;
    for(let i=0;i<Math.round(6+10*a);i++){ const yy=rand(0,H), xx=rand(0,W), len=40+120*a; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-len,yy); ctx.stroke(); }
    ctx.restore(); }
  drawWeather(P);
  ctx.restore();
  if(!withHud) return; // Auswertungs-Bildschirm: nur die eingefrorene Szene als Hintergrund
  drawHazardWarnings();
  drawHUD(P);
  drawTutorial();
}

//////////////////// Chords per biome ////////////////////
const CHORDS=[
  [130.81,196.00,261.63], // C-ish tropic
  [110.00,164.81,220.00], // A minor sunset
  [98.00,146.83,196.00],  // G storm
  [82.41,123.47,164.81],  // E night
  [87.31,130.81,174.61],  // F aurora
];
let lastChordIdx=-1;

//////////////////// Main loop ////////////////////
let last=performance.now();
let _now=0; function perfNow(){ return _now; }
let tScale=1, viewZoom=1; // Zeitlupe + Kamera-Zoom (große Airs, Near-Miss)
function frame(t){
  _now=t;
  let dt=(t-last)/1000; last=t; if(dt>0.05) dt=0.05; if(dt<=0) dt=0.0001; // clamp gaps; nie 0 (Division in Physik)
  titleWaveT += dt*1.4;
  const sTarget=(state==='play' && player.slowT>0)?0.45:1;
  tScale=lerp(tScale,sTarget,0.16);
  viewZoom=lerp(viewZoom,(state==='play'&&tScale<0.85)?1.16:1,0.10);
  if(player.slowT>0) player.slowT-=dt;
  if(state==='play'){ frozenSnap=null; updatePlay(dt*tScale); drawScene(); }
  else if(state==='menu') drawMenu();
  else if(state==='missions') drawMissions();
  else if(state==='achievements') drawAchievements();
  else if(state==='shop') drawShop();
  else if(state==='pause') drawPause();
  else if(state==='over') drawOver();
  else if(state==='unlock') drawUnlock();
  else if(state==='bonus'){ updateBonus(dt); drawBonus(); }
  else if(state==='bonusMenu') drawBonusMenu();
  else if(state==='bonusEnd') drawBonusEnd();
  requestAnimationFrame(frame);
}
// init chord on first resume
requestAnimationFrame(frame);

// hide hint after a while
setTimeout(()=>{ const h=document.getElementById('hint'); if(state!=='play') h.style.opacity='0.35'; }, 6000);
