function wrapText(txt, cx, y, maxW, lh){
  const lines=[]; let line='';
  for(const w of txt.split(' ')){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,cx,y+i*lh)); return y+(lines.length-1)*lh;
}
function drawOver(){
  drawFrozenScene(false); // ohne HUD/Banner
  const rp=runReport;
  ctx.save(); ctx.fillStyle='rgba(4,18,31,.8)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const cw=Math.min(W-32,420), cx=W/2, x0=cx-cw/2;
  let y=Math.max(44,H*0.07);
  const overTitle = player.newBest? '🏁 NEUER REKORD!' : (player.deathBy==='shark'? '🦈 GEFRESSEN!' : '🌊 EINGEHOLT!');
  ctx.font='900 28px system-ui'; ctx.fillStyle='#fff'; ctx.fillText(overTitle, cx, y);
  y+=48; ctx.font='800 44px system-ui'; ctx.fillStyle=player.newBest?'#ffe36b':'#7fe8ff'; ctx.fillText(Math.floor(player.dist)+' m', cx, y);
  if(rp && rp.cause){ y+=26; ctx.font='500 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.82)'; y=wrapText(rp.cause, cx, y, cw, 17); }
  if(rp){
    // Dieser Run vs. Rekord – 🏆 markiert neue Bestwerte
    y+=16;
    const rows=[['Distanz','dist',v=>v+' m'],['Perlen','pearls',v=>'◐ '+v],['Flips','flips',v=>''+v],['Beste Combo','combo',v=>'x'+(+v).toFixed(1)],['Serie ohne Wipeout','streak',v=>v+' m']];
    const rh=23, cRun=x0+cw*0.70, cRec=x0+cw-14, boxH=rows.length*rh+30;
    roundRect(x0,y,cw,boxH,12); ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fill();
    ctx.font='700 10px system-ui'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.textAlign='right';
    ctx.fillText('DIESER RUN', cRun, y+17); ctx.fillText('REKORD', cRec, y+17);
    rows.forEach(([lab,key,f],i)=>{ const ry=y+38+i*rh;
      ctx.textAlign='left'; ctx.font='500 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.78)'; ctx.fillText(lab, x0+14, ry);
      ctx.textAlign='right'; ctx.font='700 14px system-ui';
      ctx.fillStyle=rp.isNew[key]?'#ffe36b':'#fff'; ctx.fillText((rp.isNew[key]?'🏆 ':'')+f(rp.vals[key]), cRun, ry);
      ctx.font='500 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillText(f(Math.max(rp.vals[key], rp.prev[key]||0)), cRec, ry);
    });
    y+=boxH;
    // Trend der letzten Runs
    const h=rp.history;
    if(h.length>=2){
      y+=22; ctx.textAlign='left'; ctx.font='700 12px system-ui'; ctx.fillStyle='rgba(255,255,255,.78)'; ctx.fillText('Deine letzten Runs', x0, y);
      if(h.length>=6){ const avg=a=>a.reduce((s,v)=>s+v,0)/a.length, a=avg(h.slice(-3)), b=avg(h.slice(-6,-3)), pct=Math.round((a-b)/Math.max(1,b)*100);
        ctx.textAlign='right'; ctx.fillStyle=pct>=0?'#39e88a':'#ffb03a'; ctx.fillText((pct>=0?'▲ +':'▼ ')+pct+'% (Ø letzte 3)', x0+cw, y); }
      y+=8; const ch=50, n=h.length, gap=6, bw=(cw-(n-1)*gap)/n, mx=Math.max(...h,1);
      h.forEach((d,i)=>{ const bh=Math.max(3,ch*d/mx); roundRect(x0+i*(bw+gap), y+ch-bh, bw, bh, 3); ctx.fillStyle=i===n-1?'#7fe8ff':'rgba(255,255,255,.26)'; ctx.fill(); });
      y+=ch;
    }
    if(rp.tip){ y+=24; ctx.textAlign='center'; ctx.font='600 13px system-ui'; ctx.fillStyle='#ffe36b'; y=wrapText('💡 '+rp.tip, cx, y, cw, 17); }
  }
  ctx.restore();
  uiButtons=[]; const bw=Math.min(280,W*0.76), bx=(W-bw)/2, by=Math.min(Math.max(y+22, H-140), H-116);
  // Hoch-Moment: nach dem Kraken oder am Ende der Gratis-Strecke auf die Vollversion hinweisen
  const ctaY=by-58;
  if(!save.fullVersion && (runStats.boss>0 || runStats.gatesSeen>0) && ctaY>y+12)
    btn('unlock_cta',bx,ctaY,bw,46,'🌙 Nacht-Welten freischalten',{c1:'#7a5cff',c2:'#4a2fc0',fs:15});
  btn('retry',bx,by,bw,52,'↻  Nochmal',{c1:'#2fd0ff',c2:'#1b7fd6',fs:20});
  const sw=(bw-12)/3;
  btn('shop2',bx,by+62,sw,44,'🛍 Shop',{c1:'#ffb84d',c2:'#e07a2b',fs:14});
  btn('share',bx+sw+6,by+62,sw,44,'📤 Teilen',{c1:'#39d98a',c2:'#1b8a5a',fs:14});
  btn('menu',bx+2*(sw+6),by+62,sw,44,'⌂ Menü',{c1:'#7a8aa0',c2:'#4a5a70',fs:14});
  drawButtons();
}
function overClick(x,y){ const id=hitButton(x,y); if(!id) return; Audio.sfx.button();
  if(id==='retry') startGame(); else if(id==='menu') state='menu'; else if(id==='shop2'){ state='shop'; shopTab='boards'; }
  else if(id==='share') pendingShare=true; // ausgelöst beim Loslassen (dort zählt die Geste für navigator.share)
  else if(id==='unlock_cta') openUnlock('over'); }

//////////////////// Scene compositor ////////////////////
function drawScene(withHud=true){
  const P=pal(player.dist);
  applyShake();
  ctx.save(); ctx.translate(shakeX,shakeY);
  if(viewZoom>1.004){ const zx=sx(player.x), zy=player.y-cam.y; ctx.translate(zx,zy); ctx.scale(viewZoom,viewZoom); ctx.translate(-zx,-zy); }
  drawBackground(P,player.dist);
  drawWhale(P);   // vor dem Wasser: der Teil unter der Oberfläche wird verdeckt
  drawWater(P);
  drawBestMarker();
  drawChaser(P);
  drawEntities(P);
  drawDolphin(P);
  // particles behind/over water
  for(const p of parts){ ctx.save(); ctx.globalAlpha=clamp(p.life/p.max,0,1); if(p.glow) ctx.globalCompositeOperation='screen';
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx(p.x),p.y-cam.y,p.r,0,TAU); ctx.fill(); ctx.restore(); }
  drawPlayer(P);
  if(player.vx>760){ const a=clamp((player.vx-760)/600,0,1); // Speed-Linien
    ctx.save(); ctx.strokeStyle=rgba('#ffffff',0.22*a); ctx.lineWidth=1.5;
    for(let i=0;i<Math.round(6+10*a);i++){ const yy=rand(0,H), xx=rand(0,W), len=40+120*a; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-len,yy); ctx.stroke(); }
    ctx.restore(); }
  drawWeather(P);
  ctx.restore();
  if(!withHud) return; // Auswertungs-Bildschirm: nur die eingefrorene Szene als Hintergrund
  drawHazardWarnings();
  drawHUD(P);
}

//////////////////// Chords per biome ////////////////////
const CHORDS=[
  [130.81,196.00,261.63], // C-ish tropic
  [110.00,164.81,220.00], // A minor sunset
  [98.00,146.83,196.00],  // G storm
  [82.41,123.47,164.81],  // E night
  [87.31,130.81,174.61],  // F aurora
];
let lastChordIdx=-1;

//////////////////// Main loop ////////////////////
let last=performance.now();
let _now=0; function perfNow(){ return _now; }
let tScale=1, viewZoom=1; // Zeitlupe + Kamera-Zoom (große Airs, Near-Miss)
function frame(t){
  _now=t;
  let dt=(t-last)/1000; last=t; if(dt>0.05) dt=0.05; if(dt<=0) dt=0.0001; // clamp gaps; nie 0 (Division in Physik)
  titleWaveT += dt*1.4;
  const sTarget=(state==='play' && player.slowT>0)?0.45:1;
  tScale=lerp(tScale,sTarget,0.16);
  viewZoom=lerp(viewZoom,(state==='play'&&tScale<0.85)?1.16:1,0.10);
  if(player.slowT>0) player.slowT-=dt;
  if(state==='play'){ frozenSnap=null; updatePlay(dt*tScale); drawScene(); }
  else if(state==='menu') drawMenu();
  else if(state==='missions') drawMissions();
  else if(state==='shop') drawShop();
  else if(state==='pause') drawPause();
  else if(state==='over') drawOver();
  else if(state==='unlock') drawUnlock();
  requestAnimationFrame(frame);
}
// init chord on first resume
requestAnimationFrame(frame);

// hide hint after a while
setTimeout(()=>{ const h=document.getElementById('hint'); if(state!=='play') h.style.opacity='0.35'; }, 6000);
</script>
