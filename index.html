let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const smooth=(t)=>t*t*(3-2*t);
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(c1,c2,t){const a=hexToRgb(c1),b=hexToRgb(c2);return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;}
function mixHex(c1,c2,t){const a=hexToRgb(c1),b=hexToRgb(c2);const to=v=>('0'+Math.round(v).toString(16)).slice(-2);return '#'+to(lerp(a[0],b[0],t))+to(lerp(a[1],b[1],t))+to(lerp(a[2],b[2],t));}
function rgba(hex,a){const c=hexToRgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}

//////////////////// Missionen & Daily Challenge ////////////////////
const MISSION_POOL=[

  {id:'d1200', txt:'Erreiche 1200 m in einem Run',     stat:'dist',    scope:'run',   n:1200, rew:70},

const DAILY_POOL=[
  {id:'dy_d1500', txt:'1500 m in einem Run',     stat:'dist',  scope:'run', n:1500, rew:200},
  {id:'dy_p150',  txt:'150 Perlen in einem Run', stat:'pearls',scope:'run', n:150,  rew:200},
  {id:'dy_t10',   txt:'10 Tricks in einem Run',  stat:'tricks',scope:'run', n:10,   rew:200},

];
let runStats={}, missionTick=0;
function resetRunStats(){ runStats={tricks:0,flips:0,grabs:0,nearMiss:0,powerups:0,boss:0,maxMult:1,lastWipeDist:0,noWipeBest:0,dolphin:0,chest:0,whale:0,shards:0,wipeLog:[],gatesSeen:0,releaseJumps:0,missionsDone:0,achNew:[]}; }
resetRunStats();
function missionDef(id){ return MISSION_POOL.find(m=>m.id===id)||DAILY_POOL.find(m=>m.id===id); }
function ensureMissions(){
  if(!Array.isArray(save.missions)) save.missions=[];
  const allowed=m=>m && (!m.full || save.fullVersion); // Sternsplitter gibt's nur in den Nacht-Welten
  save.missions=save.missions.filter(s=>allowed(missionDef(s.id)));
  while(save.missions.length<3){
    const active=save.missions.map(s=>s.id);
    const cand=MISSION_POOL.filter(m=>allowed(m) && !active.includes(m.id));
    if(!cand.length) break;
    save.missions.push({id:pick(cand).id, prog:0, done:false});
  }
}
function ensureDaily(){
  const today=new Date().toISOString().slice(0,10);
  if(!save.daily || save.daily.date!==today){ save.daily={date:today, id:pick(DAILY_POOL).id, prog:0, done:false}; }
}
ensureMissions(); ensureDaily(); persist();
function runStatValue(stat){
  switch(stat){
    case 'dist': return player.dist;
    case 'pearls': return player.pearls;
    case 'mult': return runStats.maxMult;
    case 'noWipe': return runStats.noWipeBest;
    default: return runStats[stat]||0;
  }
}
function missionValue(slot){ const d=missionDef(slot.id); return (d.scope==='total'? slot.prog:0) + runStatValue(d.stat); }
function grantMission(d){
  if(state==='play') player.pearls+=d.rew; else save.pearls+=d.rew;
  runStats.missionsDone++;
  banner('🎯 MISSION ERFÜLLT!', d.txt+'  ·  +'+d.rew+' ◐');
  Audio.sfx.power();
}
function checkMissions(){
  for(const s of save.missions){ if(s.done) continue; const d=missionDef(s.id);
    if(d && missionValue(s)>=d.n){ s.done=true; grantMission(d); } }
  const dy=save.daily;
  if(dy && !dy.done){ const d=missionDef(dy.id);
    if(d && missionValue(dy)>=d.n){ dy.done=true; grantMission(d); } }
}
function finalizeMissions(){
  checkMissions();
  for(const s of save.missions){ const d=missionDef(s.id);
    if(d && !s.done && d.scope==='total') s.prog += Math.floor(runStatValue(d.stat)); }
  save.missions=save.missions.filter(s=>!s.done); // erledigte Slots freimachen
  ensureMissions();
}
// Run-Analyse: macht sichtbar, ob man besser wird (Rekorde pro Disziplin, Trend) und warum man gescheitert ist
let runReport=null;
function buildRunReport(){
  const rec = save.records || (save.records={dist:save.best||0,pearls:0,flips:0,combo:1,streak:0});
  const vals={ dist:Math.floor(player.dist), pearls:player.pearls, flips:runStats.flips, combo:+runStats.maxMult.toFixed(1), streak:Math.floor(runStats.noWipeBest) };
  const prev={...rec}, isNew={};
  for(const k in vals){ isNew[k] = save.runs>1 && vals[k]>0 && vals[k]>(prev[k]||0); if(vals[k]>(rec[k]||0)) rec[k]=vals[k]; }
  save.history=(save.history||[]).concat(vals.dist).slice(-10);
  let cause='', tip='';
  if(player.deathBy==='shark'){
    cause='Ein Hai hat dich erwischt.';
    tip='Rotes 🦈-Signal am rechten Rand = gleich tippen und drüberspringen.';
  } else if(player.deathBy==='wave'){
    const recent=runStats.wipeLog.filter(w=>sea.clock-w.t<14), counts={};
    recent.forEach(w=>counts[w.c]=(counts[w.c]||0)+1);
    const list=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    cause = recent.length>1
      ? 'Die Welle hat dich nach '+recent.length+' Wipeouts kurz nacheinander eingeholt: '+list.map(([c,n])=>n+'× '+c).join(', ')+'.'
      : recent.length===1
      ? 'Die Welle hat dich nach einem Wipeout ('+list[0][0]+') eingeholt – danach warst du zu langsam.'
      : 'Die Welle hat dich eingeholt – du warst zu langsam.';
    const top=list.length?list[0][0]:null;
    tip = top==='schiefe Landung' ? 'Flip-Tipp: loslassen, sobald der Ring um den Surfer GRÜN ist.'
        : top==='Kraken-Tentakel' ? 'Kraken-Tipp: Jede Tentakel kündigt ein rotes ⚠ an – dann springen. Dazwischen ist Zeit zum Landen.'
        : top ? 'Ein ⚠ am rechten Rand kündigt jedes Hindernis 1 Sekunde vorher an – dann springen.'
        : 'Gedrückt halten = Speed. Je schneller du surfst, desto weiter fällt die Welle zurück.';
  }
  runReport={vals, prev, isNew, cause, tip, history:save.history.slice()};
}
function bankRun(){
  buildRunReport();
  finalizeMissions();
  checkAchievements(true); // letzte Prüfung mit den Werten dieses Laufs – danach wandern sie in die Lebenszeit-Statistik
  const st=save.stats, add=(k,v)=>st[k]=(st[k]||0)+v;
  add('dist',Math.floor(player.dist)); add('flips',runStats.flips); add('grabs',runStats.grabs); add('boss',runStats.boss);
  add('pearls',player.pearls); add('nearMiss',runStats.nearMiss); add('chest',runStats.chest);
  add('friends',runStats.dolphin+runStats.whale); add('shards',runStats.shards);
  runReport.xp = grantXp(runXp());
  runReport.gems = player.crystals; save.crystals += player.crystals;
  if(runStats.boss>0 && (save.tickets||0)<MAX_TICKETS){ save.tickets=(save.tickets||0)+1; runReport.ticket=true; } // Kraken besiegt -> Bonus-Ticket
  save.pearls += player.pearls;
  if(Math.floor(player.dist)>save.best){ save.best=Math.floor(player.dist); player.newBest=true; } else player.newBest=false;
  persist();
}

};
function unlockTrail(k){ if(save.ownedTrails.includes(k)) return false; save.ownedTrails.push(k); return true; }

// --- Surfer-Rang ---
const RANKS=[[1,'Anfänger'],[3,'Wasserratte'],[6,'Wellenreiter'],[10,'Brandungs-Profi'],[15,'Barrel-Jäger'],[20,'Sturmreiter'],[25,'Nachtsurfer'],[30,'Kraken-Bezwinger'],[40,'Meister der Meere'],[50,'Wave Legend']];
const RANK_TRAILS={10:'stars',25:'biolum',40:'gold'};
function xpNeed(l){ return 400+l*200; }
function levelInfo(xp){ let l=1; while(xp>=xpNeed(l)){ xp-=xpNeed(l); l++; } return {level:l, into:xp, need:xpNeed(l)}; }
function rankTitle(l){ let t=RANKS[0][1]; for(const [lv,n] of RANKS) if(l>=lv) t=n; return t; }
function runXp(){
  return Math.floor(player.dist/10) + runStats.tricks*5 + runStats.flips*10 + runStats.boss*100 + runStats.nearMiss*15
       + (runStats.chest+runStats.dolphin+runStats.whale+runStats.shards)*20 + runStats.missionsDone*50;
}
function grantXp(xp){
  const before=levelInfo(save.xp).level; save.xp+=xp; const after=levelInfo(save.xp).level;
  let pearls=0; const trails=[];
  let gems=0;
  for(let l=before+1;l<=after;l++){ pearls+=100+l*20; if(l%5===0) gems+=3; if(RANK_TRAILS[l] && unlockTrail(RANK_TRAILS[l])) trails.push(RANK_TRAILS[l]); }
  save.pearls+=pearls; save.crystals+=gems;
  return {xp, before, after, pearls, gems, trails};
}

//////////////////// Audio (procedural, no assets) ////////////////////
const Audio = (()=>{
  let actx=null, master=null, waveGain=null, padGain=null, started=false;
  function ensure(){
    if(actx) return;
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    master = actx.createGain(); master.gain.value = save.soundOn?0.9:0.0; master.connect(actx.destination);
    // wave/ocean bed: looped brown noise through lowpass with slow LFO
    const len = actx.sampleRate*2; const buf = actx.createBuffer(1,len,actx.sampleRate); const d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const wn=Math.random()*2-1; last=(last+0.02*wn)/1.02; d[i]=last*3.2; }
    const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    waveGain = actx.createGain(); waveGain.gain.value=0.0;
    src.connect(lp); lp.connect(waveGain); waveGain.connect(master);
    // slow swell LFO on wave gain
    const lfo=actx.createOscillator(); lfo.frequency.value=0.12; const lg=actx.createGain(); lg.gain.value=0.06;
    lfo.connect(lg); lg.connect(waveGain.gain); lfo.start();
    src.start();
    // ambient pad
    padGain = actx.createGain(); padGain.gain.value=0.0; padGain.connect(master);
    started=true;
  }
  function resume(){ ensure(); if(actx && actx.state==='suspended') actx.resume(); }
  let padVoices=[];
  function setPad(freqs){
    if(!actx) return;
    padVoices.forEach(v=>{try{v.o.stop();}catch(e){}});
    padVoices=[];
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(); o.type = i===0?'sine':'triangle'; o.frequency.value=f;
      const g=actx.createGain(); g.gain.value= i===0?0.5:0.25;
      const f2=actx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=900;
      o.connect(f2); f2.connect(g); g.connect(padGain); o.start();
      // gentle detune shimmer
      o.detune.value = (Math.random()*8-4);
      padVoices.push({o,g});
    });
  }
  function tone(freq,dur,type='sine',vol=0.3,bendTo=null){
    if(!actx||!save.soundOn) return;
    const o=actx.createOscillator(); o.type=type; o.frequency.value=freq;
    const g=actx.createGain();
    const now=actx.currentTime;
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol,now+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008,now+dur);
    if(bendTo) o.frequency.exponentialRampToValueAtTime(bendTo,now+dur);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+dur+0.02);
  }
  function noise(dur,vol=0.3,lpf=1200){
    if(!actx||!save.soundOn) return;
    const n=Math.floor(actx.sampleRate*dur); const b=actx.createBuffer(1,n,actx.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=actx.createBufferSource(); s.buffer=b; const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=lpf;
    const g=actx.createGain(); g.gain.value=vol; s.connect(lp); lp.connect(g); g.connect(master); s.start();
  }
  return {
    resume,
    setActive(on){ if(!actx) return; waveGain.gain.setTargetAtTime(on?0.6:0.06, actx.currentTime,0.6); padGain.gain.setTargetAtTime(on?0.10:0.05, actx.currentTime,0.8); },
    setChord(freqs){ setPad(freqs); },
    setMuted(m){ if(master&&actx) master.gain.setTargetAtTime(m?0:0.9, actx.currentTime,0.1); },
    sfx:{
      jump(){ tone(300,0.18,'sine',0.25,620); },
      land(good){ good?tone(180,0.12,'sine',0.28,360):noise(0.18,0.35,700); },
      collect(n){ tone(660+ (n%6)*70,0.10,'triangle',0.22,990); },
      trick(){ tone(500,0.14,'square',0.16,880); },
      crash(){ noise(0.35,0.5,500); tone(120,0.3,'sawtooth',0.25,60); },
      boost(){ tone(220,0.3,'sawtooth',0.25,880); noise(0.25,0.2,2000); },
      power(){ tone(520,0.16,'triangle',0.25,1040); tone(780,0.2,'sine',0.18,1180); },
      button(){ tone(440,0.06,'sine',0.15); },
      dolphin(){ tone(1400,0.07,'sine',0.12,2100); setTimeout(()=>tone(1700,0.08,'sine',0.11,2500),90); },
      whale(){ tone(90,1.4,'sine',0.28,60); tone(140,1.1,'triangle',0.12,95); },
      splash(){ noise(0.6,0.45,900); },
      chest(){ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.2,f*1.5),i*70)); },
      chime(){ [880,1175,1480].forEach((f,i)=>setTimeout(()=>tone(f,0.5,'sine',0.12),i*90)); },
      // Bonus-Level
      snap(){ noise(0.14,0.45,1800); tone(190,0.14,'square',0.18,80); },
      roar(){ tone(72,0.9,'sawtooth',0.2,46); noise(0.8,0.22,380); },
      thunder(){ noise(1.3,0.42,260); },
    }
  };
})();

// als Vorgeschmack, danach wieder Tropenbucht. Vollversion: alle 5 Welten.
// Darf sich nur zwischen Runs ändern – das Gelände hängt über wsAt() am Biom.
const TEASER_START = BIOMES[3].dist, TEASER_LEN = 900; // ≈6 s Nacht bei Vollgas, ≈8 s bei normalem Tempo
const BIOMES_FREE = [...BIOMES.slice(0,3), BIOMES[3]];
const FREE_CYCLE = TEASER_START + TEASER_LEN, FULL_CYCLE = 4320;
function biomeAt(dist){
  const list = save.fullVersion ? BIOMES : BIOMES_FREE;
  const cycle = save.fullVersion ? FULL_CYCLE : FREE_CYCLE;
  const d = dist % cycle;
  let idx=0;
  for(let i=0;i<list.length;i++){ if(d>=list[i].dist) idx=i; }
  const cur = list[idx];
  const nxt = list[(idx+1)%list.length];
  const nextDist = (idx+1<list.length)? list[idx+1].dist : cycle;
  const span = nextDist - cur.dist;
  const transStart = nextDist - 220;
  let t=0;
  if(d>transStart) t = smooth(clamp((d-transStart)/220,0,1));
  return {cur, nxt, t, idx};
}
function pal(dist){ const {cur,nxt,t}=biomeAt(dist); return palMix(cur,nxt,t); }
function palOf(key){ const b=BIOMES.find(x=>x.key===key); return palMix(b,b,0); }
function palMix(cur,nxt,t){
  const L=(i,k)=> mixHex(cur[k][i], nxt[k][i], t);
  return {
    name: t>0.5? nxt.name : cur.name,
    sky:[L(0,'sky'),L(1,'sky')],
    water:[L(0,'water'),L(1,'water'),L(2,'water')],
    sun: mixHex(cur.sun,nxt.sun,t), sunGlow: mixHex(cur.sunGlow,nxt.sunGlow,t),
    foam: mixHex(cur.foam,nxt.foam,t), accent: mixHex(cur.accent,nxt.accent,t),
    islands: t<0.5?cur.islands:nxt.islands, gulls:t<0.5?cur.gulls:nxt.gulls,
    rain: t<0.5?cur.rain:nxt.rain, stars:(cur.stars||nxt.stars), aurora:(cur.aurora||nxt.aurora),
    biolum:(cur.biolum||nxt.biolum),
    waveScale: lerp(cur.waveScale,nxt.waveScale,t),
    difficulty: lerp(cur.difficulty,nxt.difficulty,t),
    starA: (cur.stars?1-t:0)+(nxt.stars?t:0),
    auroraA:(cur.aurora?1-t:0)+(nxt.aurora?t:0),
    biolumA:(cur.biolum?1-t:0)+(nxt.biolum?t:0),
    rainA:(cur.rain?1-t:0)+(nxt.rain?t:0),
  };
}

//////////////////// Ocean surface ////////////////////
// world x in pixels; player advances rightward. terrain = f(x) only (deterministic ride).
let seed = { p1:rand(TAU), p2:rand(TAU), p3:rand(TAU) };
const PXPM = 6.2; // pixels per "meter" for distance readout
function wsAt(x){ const b=biomeAt(x/PXPM); return lerp(b.cur.waveScale,b.nxt.waveScale,b.t); }
function surfaceY(x){
  const s = wsAt(x);
  return (
    128*s*Math.sin(x/520 + seed.p1) +
    52 *s*Math.sin(x/188 + seed.p2) +
    20 *s*Math.sin(x/71  + seed.p3)
  );
}
function surfaceSlope(x){
  const s = wsAt(x);
  return (
    128*s/520*Math.cos(x/520 + seed.p1) +
    52 *s/188*Math.cos(x/188 + seed.p2) +
    20 *s/71 *Math.cos(x/71  + seed.p3)
  );
}

const parts=[];
function spawnPart(x,y,vx,vy,life,r,color,grav=true,glow=false){
  parts.push({x,y,vx,vy,life,max:life,r,color,grav,glow});
}
function spray(x,y,dir,amount,color){
  for(let i=0;i<amount;i++){
    const a=rand(-0.9,0.2)+ (dir<0?Math.PI:0);
    const sp=rand(60,260);
    spawnPart(x,y,Math.cos(a)*sp*dir, -Math.abs(Math.sin(a))*sp-rand(40,160), rand(0.3,0.7), rand(1.5,4), color,true);
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;}
    if(p.grav) p.vy+=1400*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
}

//////////////////// World entities ////////////////////
let ents=[]; // {type,x,y,...}
let lastSpawnX=0;
const ENT = {PEARL:'pearl',COIN:'coin',ROCK:'rock',JELLY:'jelly',FIN:'fin',BUOY:'buoy',MAGNET:'magnet',SHIELD:'shield',TURBO:'turbo',STAR:'star',TENT:'tent',CHEST:'chest',SHARD:'shard',GEM:'gem'};
const HAZARDS=new Set([ENT.ROCK,ENT.JELLY,ENT.FIN,ENT.BUOY]);

// Faire Hindernis-Abstände: entweder so nah, dass EIN Sprung beide nimmt (≤0,35 s), oder genug Zeit zum
// Landen und Neu-Abspringen (≥1,3 s; Haie ≥1,6 s, nie in Gruppen). Vorher lagen 43% aller Paare dazwischen.
let lastHzX=-1e9, lastHzShark=false;
function hazardSlotOk(hx, shark){
  if(tut.active) return false;                // Surf-Schule: Hindernisse kommen nur gezielt aus dem Tutorial
  if(hx < 2600) return false;                 // Aufwärmphase: die ersten ~3 s ohne Hindernisse
  const v=Math.max(player.vx*1.2, 800);       // vorsichtig schätzen: bis du ankommst, bist du evtl. schneller
  const gap=(hx-lastHzX)/v;
  if(shark || lastHzShark) return gap>=1.6;
  return gap>=1.3 || gap<=0.35;
}
function resetWorld(){
  ents.length=0; parts.length=0; floaters.length=0;
  lastSpawnX = 700; lastHzX=-1e9; lastHzShark=false;
  bossState.active=false; bossState.next=2200; bossState.hits=0; bossState.banner=0;
  bannerQueue.length=0; bannerData.t=0;
  resetSea();
}
function spawnAhead(px){
  const P = pal(px/PXPM);
  const diff = P.difficulty + player.dist/2600*0.5;
  while(lastSpawnX < px + W + 500){
    const x = lastSpawnX;
    const sy = surfaceY(x);
    const r = Math.random();
    // collectibles: arcs of pearls near crests / floating
    if(r<0.42){
      const n=randi(4,7); const spread=rand(26,42);
      const lowTrail = Math.random()<0.6;               // meist knapp über dem Wasser -> beim Reiten sammelbar
      const base = lowTrail? rand(16,34) : rand(70,150); // sonst hoher Air-Bogen für Tricks
      const arcH = lowTrail? rand(0,20) : rand(60,130);
      for(let i=0;i<n;i++){ const t=i/(n-1); const arc=Math.sin(t*Math.PI)*arcH;
        const px=x+i*spread; ents.push({type:ENT.PEARL,x:px,y:surfaceY(px)-base-arc,r:9,got:false}); }
    } else if(r<0.52){
      // seltener Kristall hoch in der Luft (nur mit gutem Sprung erreichbar, Magnet zieht ihn nicht)
      if(x>1800 && Math.random()<0.18) ents.push({type:ENT.GEM,x,y:sy-rand(110,150),r:13,ph:rand(TAU)});
      else ents.push({type:ENT.COIN,x,y:sy-rand(30,90),r:11,got:false,spin:0});
    } else if(r< 0.52 + clamp(0.13*diff, 0.13, 0.30)){
      // Hindernis-Band: skaliert mit Schwierigkeit, verdrängt aber NIE Bojen/Power-Ups
      const hr=Math.random(), shark = hr>=0.76 && hr<0.84, hx = shark ? x+300 : x;
      if(hazardSlotOk(hx, shark)){
        lastHzX=hx; lastHzShark=shark;
        if(hr<0.42){ ents.push({type:ENT.ROCK,x,y:sy,r:26}); }
        else if(hr<0.76){ const e={type:ENT.JELLY,x,y:sy-rand(22,52),r:24,ph:rand(TAU),baseY:0}; e.baseY=e.y; ents.push(e); }
        else if(shark){ ents.push({type:ENT.FIN,x:hx,y:surfaceY(hx),r:22,chase:rand(0.2,0.5)}); } // Haie selten — dafür TÖDLICH
        else { ents.push({type:ENT.BUOY,x,y:sy,r:18,ph:rand(TAU)}); }
      }
    } else if(r< 0.52 + clamp(0.13*diff, 0.13, 0.30) + 0.05){
      // festes Power-Up-Band (5%) — bleibt auch im Spätspiel erhalten
      const kinds=[ENT.MAGNET,ENT.SHIELD,ENT.TURBO,ENT.STAR];
      const w=[0.32,0.32,0.24,0.12]; let rr=Math.random(),k=ENT.MAGNET,acc=0;
      for(let i=0;i<kinds.length;i++){acc+=w[i]; if(rr<acc){k=kinds[i];break;}}
      ents.push({type:k,x,y:sy-rand(90,150),r:15,ph:rand(TAU)});
    }
    lastSpawnX += rand(160,360);
  }
}

    // schedule three tentacle walls ahead
    let bx = player.x + W*0.9;
    for(let i=0;i<4;i++){
      bossState.tents.push({x:bx, y0:surfaceY(bx), h:rand(50,80), ph:rand(TAU), alive:true, r:26});
      bx += Math.max(player.vx,800)*rand(1.3,1.5); // Zeit zum Landen und Neu-Abspringen
    }
    // keine normalen Hindernisse zwischen/um die Tentakel
    const t0=bossState.tents[0].x, t1=bossState.tents[bossState.tents.length-1].x;
    for(let i=ents.length-1;i>=0;i--){ if(HAZARDS.has(ents[i].type) && ents[i].x>t0-900 && ents[i].x<t1+900) ents.splice(i,1); }
    lastHzX=t1; lastHzShark=true;
    banner('⚠ KRAKEN ⚠','Spring über die Tentakel!',true);
    Audio.sfx.boost();
  }
  if(bossState.active){
    let allPassed=true;
    for(const t of bossState.tents){ if(t.x > player.x-80) allPassed=false; }
    if(allPassed){
      bossState.active=false;
      bossState.next = player.dist + rand(1600,2200);
      player.pearls += 60; save.pearls+=60; player.crystals+=1;
      runStats.boss++; checkMissions();
      banner('KRAKEN BESIEGT','+60 Perlen · +1 💎');
      Audio.sfx.power();
    }
  }
}

let uiButtons=[];
function btn(id,x,y,w,h,label,opt={}){ uiButtons.push({id,x,y,w,h,label,...opt}); }
function drawButtons(){
  for(const b of uiButtons){
    ctx.save();

    const c1=b.c1||'#2fd0ff', c2=b.c2||'#1b7fd6';
    grad.addColorStop(0,c1); grad.addColorStop(1,c2);
    roundRect(b.x,b.y,b.w,b.h,b.h/2);
    ctx.fillStyle= b.disabled? 'rgba(90,110,130,.5)' : grad; ctx.fill();
    if(!b.disabled){ ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.stroke(); }
    ctx.fillStyle= b.disabled? 'rgba(255,255,255,.45)':'#fff';
    ctx.font=`600 ${b.fs||18}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+1);
    ctx.restore();
  }
}
function hitButton(x,y){ for(const b of uiButtons){ if(!b.disabled && x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) return b.id; } return null; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

//////////////////// State machine ////////////////////
let state='menu';
let hud={hintFade:false};
function startGame(){

  state='play'; save.runs++; persist();

//////////////////// Physics / update ////////////////////
const G=2100;
function updatePlay(dt){
  const P=pal(player.dist);
  // audio chord per biome idx
  const bi=biomeAt(player.dist).idx;
  if(bi!==lastChordIdx){ lastChordIdx=bi; Audio.setChord(CHORDS[bi]); }

  const B=player.B;
  const globalSpeed = 1 + player.dist/6000*0.6; // gentle speed ramp
  const maxV = (1180 + player.dist/12) * B.accel;
  const minV = 360*globalSpeed;

  // turbo
  if(player.turbo>0){ player.turbo-=dt; }
  if(player.star>0){ player.star-=dt; }
  if(player.magnet>0){ player.magnet-=dt; }
  if(player.invPop>0) player.invPop-=dt;
  if(player.grabT>0) player.grabT-=dt;
  if(player.celebrateT>0) player.celebrateT-=dt;

  // ----- movement -----
  if(player.wipe>0){
    player.wipe-=dt;
    player.vx=lerp(player.vx, minV*0.85, dt*3);
    player.angle=lerp(player.angle, surfaceAngle(player.x), dt*8);
    player.y=surfaceY(player.x);
    player.x+=player.vx*dt;
  } else if(!player.air){
    // ----- grounded -----
    if(player.prevHold && !player.holding){
      // LOSLASSEN = abspringen: Sprung-Impuls, skaliert mit Speed (Pumpen lohnt sich)
      const slope=surfaceSlope(player.x);
      const pop = 380 + player.vx*0.40;
      player.air=true;
      // garantierter Aufwärts-Impuls: Downhill-Tangente darf den Sprung NICHT wegfressen,
      // eine Uphill-Flanke gibt zusätzlich Extra-Höhe
      player.vy = Math.min(0, slope*player.vx) - pop*B.air;
      player.rotAccum=0; player.airTime=0; player.airStartMult=player.mult; player.bigAirFx=false; player.airGrabs=0; player.grabT=0; player.rotNet=0; player.flipsShown=0; player.spinArmed=!player.holding; player.spinHoldT=0;
      player.angle=Math.atan(slope);
      runStats.releaseJumps++;
      Audio.sfx.jump();
      spray(sx(player.x)+cam.x, player.y, 1, 8, P.foam);
    } else {
      const slope=surfaceSlope(player.x);
      const ang=Math.atan(slope);
      // slope accel: downhill (slope>0) speeds up
      let acc = 2600*Math.sin(ang);
      if(player.holding){ if(slope>0) acc*=1.9; else acc*=0.35; } else { if(slope>0) acc*=0.9; }
      player.vx += acc*dt;
      player.vx -= player.vx*0.18*dt; // drag
      if(player.turbo>0) player.vx += 1400*dt;
      player.vx=clamp(player.vx, minV, maxV*(player.turbo>0?1.35:1));
      // advance & follow surface, detect launch
      const nx=player.x+player.vx*dt;
      const prevY=player.y;
      const ny=surfaceY(nx);
      const vyFollow=(ny-prevY)/dt;
      const vyFree=player.vy+G*dt;
      if(vyFollow > vyFree + 30){
        // natürlicher Absprung, wenn die Welle unter dir wegkippt
        player.air=true;
        player.vy=surfaceSlope(player.x)*player.vx;
        if(player.holding){ player.vy -= 220*B.air; } // durchgepumpt = etwas mehr Air
        player.rotAccum=0; player.airTime=0; player.airStartMult=player.mult; player.bigAirFx=false; player.airGrabs=0; player.grabT=0; player.rotNet=0; player.flipsShown=0; player.spinArmed=!player.holding; player.spinHoldT=0;
        player.angle=Math.atan(surfaceSlope(player.x));
        player.x=nx;
        Audio.sfx.jump();
      } else {
        player.x=nx; player.y=ny; player.vy=vyFollow;
        player.angle=lerp(player.angle, Math.atan(slope), dt*12);
        // ride spray
        if(player.vx>600 && Math.random()<0.4){ spray(sx(player.x)+cam.x, player.y, 1, 1, P.foam); }
      }
    }
    player.spin=0;
  } else {
    // airborne
    player.vy+=G*dt;
    player.x+=player.vx*dt;
    player.y+=player.vy*dt;
    player.airTime+=dt;
    // großer Air -> kurze Zeitlupe + Zoom (einmal pro Flug)
    if(!player.bigAirFx && (player.rotAccum>TAU*1.6 || player.airTime>0.9)){ player.bigAirFx=true; player.slowT=Math.max(player.slowT,0.5); }
    // Flip: Halten = konstante Drehung (ein Flip ≈ 0,55 s, passt in einen normalen Sprung),
    // Loslassen = Drehung stoppt sofort; Lande-Assistent zieht das Board auf die Wellen-Neigung,
    // wenn du nah dran bist. (Vorher: Beschleunigung + Schwung -> Flip kaum möglich, Überdrehen beim Loslassen.)
    // Nur ein NEUER Druck in der Luft dreht: wer beim Pumpen über einen Kamm katapultiert wird und
    // noch hält, soll nicht ungewollt flippen. Kurze Haltezeit trennt Tippen (Grab) von Halten (Flip).
    const SPIN = 13*B.turn;
    if(!player.holding){ player.spinArmed=true; player.spinHoldT=0; }
    else if(player.spinArmed) player.spinHoldT+=dt;
    if(player.holding && player.spinArmed && player.spinHoldT>0.12){ player.angVel = lerp(player.angVel, -SPIN, 1-Math.exp(-dt*16)); }
    else {
      player.angVel = lerp(player.angVel, 0, 1-Math.exp(-dt*14));
      const la = surfaceAngle(player.x + player.vx*0.12);
      const d = Math.atan2(Math.sin(la-player.angle), Math.cos(la-player.angle));
      if(Math.abs(d) < 1.0) player.angle += d*(1-Math.exp(-dt*7));
    }
    player.angle += player.angVel*dt;
    player.rotNet += player.angVel*dt;
    player.rotAccum = Math.abs(player.rotNet);
    const flipsDone = Math.floor((player.rotAccum+0.4)/TAU);
    if(flipsDone > player.flipsShown){ player.flipsShown=flipsDone;
      floatText(sx(player.x), worldToScreenY(player.y)-58, flipsDone===1?'↻ FLIP':'↻ x'+flipsDone, '#ffe36b', 16); Audio.sfx.collect(5); }
    // land?
    const gy=surfaceY(player.x);
    if(player.y>=gy && player.vy>0){
      land(gy,P);
    }
  }

  // clamp above surface visually (never sink weirdly)
  if(!player.air && player.wipe<=0){ /* on surface */ }

  // ----- distance / score -----
  player.dist = player.x/PXPM; // meters
  if(!player._passedBest && save.best>=80 && player.dist>save.best){ player._passedBest=true; banner('🏁 NEUER REKORD!','Weiter als je zuvor – weiter so!'); Audio.sfx.power(); }
  // Gratis: beim Einfahren in den Nacht-Vorgeschmack kurz ansagen, was das ist
  if(!save.fullVersion && player.dist>=TEASER_START){ const lap=Math.floor((player.dist-TEASER_START)/FREE_CYCLE)+1;
    if(lap>runStats.gatesSeen){ runStats.gatesSeen=lap; banner('🌙 VORGESCHMACK','Die Nacht-Welten · in der Vollversion'); Audio.sfx.chime(); } }
  player.score = Math.floor(player.dist) + player.pearls*5;

  // combo timer decay
  if(player.comboTimer>0){ player.comboTimer-=dt; if(player.comboTimer<=0){ player.combo=0; player.mult=1; } }

  // ----- Missions-Tracking -----
  runStats.maxMult=Math.max(runStats.maxMult, player.mult);
  runStats.noWipeBest=Math.max(runStats.noWipeBest, player.dist-runStats.lastWipeDist);
  if((missionTick++ & 31)===0){ checkMissions(); checkAchievements(true); }

  // ----- camera -----
  cam.x = player.x - W*camAnchor();
  const targetCamY = player.y - H*0.52;
  cam.y = lerp(cam.y, targetCamY, dt*4);
  if(cam.shake>0) cam.shake-=dt*60;

  // ----- Monsterwelle (Fail-State) -----
  // Der Abstand ist ein deterministischer "Lebensbalken" statt Physik: eine Tempo-Simulation machte die
  // Strafe vom Gelände abhängig (gleicher Fehler kostete mal 750, mal 870 px) und eine reine
  // Distanz-Rampe war ein Timer. Jetzt: sauber surfen schiebt sie zurück (je schneller, desto mehr),
  // jeder Wipeout lässt sie um einen festen Betrag heranrollen, zu langsames Surfen zieht sie heran.
  // => 1 Fehler spürbar, 2 kurz nacheinander gefährlich, 3 in Folge = gefressen.
  const floorV = 400 + Math.min(player.dist*0.05, 250);
  const wipePenalty = 450 + Math.min(player.dist*0.02, 100);
  const regen = 40 + player.vx*0.04 - Math.min(player.dist*0.005, 20);
  player.sinceWipe = player.wipe>0 ? 0 : player.sinceWipe+dt;
  let gapRate;
  if(player.wipe>0) gapRate = -wipePenalty/0.75;               // Strafe über die Wipeout-Dauer verteilt (sichtbares Heranrollen)
  // Langsam-Strafe nicht in der Erholungsphase nach einem Wipeout — sonst zählt jeder Fehler doppelt
  else if(player.vx < floorV && player.star<=0 && player.sinceWipe>3) gapRate = -(floorV-player.vx)*0.6;
  else gapRate = regen + (player.turbo>0 ? 220 : 0);
  player.waveGap = Math.min(WAVE_CAP, player.waveGap + gapRate*dt);
  player.chaserX = player.x - player.waveGap;
  const gap = player.waveGap;
  if(gap < 46){ player.deathBy='wave'; Audio.sfx.crash(); cam.shake=20; spray(sx(player.x)+cam.x, player.y, -1, 30, '#ffffff'); gameOver(); }
  else if(gap < 620 && !player._warned && !tut.active){ player._warned=true; banner('⚠ MONSTERWELLE','Bau Speed auf – lass dich nicht einholen!',true); }
  else if(gap > 760) player._warned=false;

  // ----- world spawns -----
  spawnAhead(player.x);
  maybeBoss();
  updateEntities(dt,P);
  updateBoss(dt);
  updateSea(dt,P);
  updateTutorial(dt);

  // cull behind
  for(let i=ents.length-1;i>=0;i--){ if(ents[i].x < player.x - W*0.6) ents.splice(i,1); }

  // trail
  player.trail.push({x:player.x,y:player.y}); if(player.trail.length>(save.trail==='foam'?14:22)) player.trail.shift(); // besondere Trails etwas länger

  updateParts(dt);
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.life-=dt; f.y-=40*dt; if(f.life<=0) floaters.splice(i,1); }
  if(bannerData.t>0) bannerData.t-=dt;
  else if(bannerQueue.length) bannerData={t:2.4, ...bannerQueue.shift()};
  player.prevHold=player.holding; // fürs Erkennen des Loslassens (= Sprung)
}
function surfaceAngle(x){ return Math.atan(surfaceSlope(x)); }

function land(gy,P){
  const sang=surfaceAngle(player.x);
  // normalize board angle relative to slope
  let diff=Math.atan2(Math.sin(player.angle-sang),Math.cos(player.angle-sang));
  // saubere Landung heißt: Netto-Drehung ≈ ganze Umdrehungen -> runden statt abrunden
  const flips=Math.round(player.rotAccum/TAU);
  let tol=0.70 + (save.surfer==='storm'?0.15:0); // storm = vergebender
  tol -= clamp(player.dist/5000*0.10,0,0.12);
  if(Math.abs(diff)<tol || player.airTime<0.12){
    // clean landing
    player.air=false; player.y=gy; player.angle=sang; player.vy=0; player.angVel=0;
    player.vx*=1.05 + 0.06*Math.min(flips,3); // Tricks geben Speed
    // trick reward
    if(player.airTime>0.25){
      const grabs=player.airGrabs;
      let pts=Math.floor(player.airTime*80)+flips*120+grabs*60;
      player.combo++; player.comboTimer=3.0;
      player.mult=1+player.combo*0.5;
      let label = flips>=2? (flips*360)+'° SPIN' : flips===1? 'BACKFLIP' : 'AIR';
      if(grabs>0) label += ' + GRAB';
      if(player.airTime>1.1) label='SUPER '+label;
      player.celebrateT=0.5;
      buzz(18);
      runStats.tricks++; runStats.flips+=flips; runStats.grabs+=grabs; checkMissions();
      const gain=Math.floor(pts*player.mult);
      player.score+=gain; player.pearls+=Math.floor(flips*2);
      floatText(sx(player.x),worldToScreenY(player.y)-40, label+'  +'+gain, P.accent,20);
      if(player.combo>1) floatText(sx(player.x),worldToScreenY(player.y)-64, 'x'+player.mult.toFixed(1)+' COMBO', '#ffe36b',16);
      spray(sx(player.x)+cam.x, player.y, 1, 16, P.foam);
      Audio.sfx.trick(); Audio.sfx.land(true);
      cam.shake=Math.min(6,cam.shake+3);
    } else {
      Audio.sfx.land(true);
      spray(sx(player.x)+cam.x, player.y, 1, 6, P.foam);
    }
  } else {
    // wipeout
    if(player.star>0){ // invincible star ignores
      player.air=false; player.y=gy; player.angle=sang; player.vy=0;
    } else if(player.shield){
      player.shield=false; player.air=false; player.y=gy; player.angle=sang; player.vy=0; player.invPop=1;
      floatText(sx(player.x),worldToScreenY(player.y)-40,'SCHILD!','#7fe8ff',18);
      Audio.sfx.land(true);
    } else {
      player.air=false; player.y=gy; player.angle=sang; player.vy=0;
      player.wipe=0.75; player.invPop=1.6; player.combo=0; player.mult=1;
      runStats.lastWipeDist=player.dist; logWipe('schiefe Landung');
      floatText(sx(player.x),worldToScreenY(player.y)-40,'WIPEOUT','#ff6b6b',20);
      spray(sx(player.x)+cam.x, player.y, -1, 22, '#ffffff');
      Audio.sfx.crash(); cam.shake=14;
    }
  }
  player.rotAccum=0; player.airTime=0; player.airGrabs=0; player.grabT=0; player.bigAirFx=false; player.rotNet=0; player.flipsShown=0;
}

function updateEntities(dt,P){
  const magR = 150 * (save.surfer==='reef'?1.3:1);
  for(const e of ents){
    if(e.type===ENT.JELLY){ e.y=e.baseY+Math.sin(perfNow()/500+e.ph)*22; }
    if(e.type===ENT.FIN){ e.x -= e.chase*player.vx*dt*0.15; e.y=surfaceY(e.x);
      // Near-Miss: knapp über den Hai gesprungen -> Zeitlupe + Bonus
      if(player.air && !e.nearMiss && Math.abs(e.x-player.x)<48){ const cl=e.y-player.y;
        if(cl>10 && cl<120){ e.nearMiss=true; player.slowT=Math.max(player.slowT,0.5); player.pearls+=10;
          runStats.nearMiss++; checkMissions();
          floatText(sx(e.x),worldToScreenY(e.y)-64,'KNAPP! +10','#ff9e6b',18); Audio.sfx.power(); } } }
    if(e.type===ENT.BUOY){ e.y=surfaceY(e.x)+Math.sin(perfNow()/400+e.ph)*4; }
    if(e.type===ENT.CHEST){ e.y=surfaceY(e.x)+Math.sin(perfNow()/350+e.ph)*3; }
    // magnet pull for pearls/coins
    if((e.type===ENT.PEARL||e.type===ENT.COIN) && player.magnet>0 && !e.got){
      const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
      if(d>1 && d<magR){ e.x+=dx/d*380*dt; e.y+=dy/d*380*dt; }
    }
    // collision
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    const pr=26;
    if(d < (e.r+pr)){
      collide(e,P);
    }
  }
  // remove collected
  for(let i=ents.length-1;i>=0;i--){ if(ents[i].got) ents.splice(i,1); }
}
function collide(e,P){
  switch(e.type){
    case ENT.PEARL: {
      e.got=true; let g=1; if(save.surfer==='aya') g=Math.random()<0.1?2:1;
      if(rainbowActive()) g*=2;
      player.pearls+=g; player.comboTimer=Math.max(player.comboTimer,1.2);
      floatText(sx(e.x),worldToScreenY(e.y),'+'+g,P.foam,14);
      Audio.sfx.collect(player.pearls);
      spawnPart(sx(e.x)+cam.x,e.y,0,-80,0.4,3,P.foam,false,true);
      break;
    }
    case ENT.COIN: {
      e.got=true; const cv=5*(rainbowActive()?2:1); player.pearls+=cv; if(save.surfer==='aya')player.pearls+=1;
      floatText(sx(e.x),worldToScreenY(e.y),'+'+cv,'#ffd36b',16);
      Audio.sfx.collect(9);
      break;
    }
    case ENT.GEM: {
      e.got=true; player.crystals++;
      floatText(sx(e.x),worldToScreenY(e.y),'💎 +1','#c9a8ff',18); Audio.sfx.chime();
      for(let i=0;i<14;i++) spawnPart(e.x,e.y,rand(-180,180),rand(-260,40),rand(0.4,0.8),rand(1.5,3.5),i%2?'#c9a8ff':'#7fe8ff',true,true);
      break;
    }
    case ENT.CHEST: {
      e.got=true; const g=randi(40,70)*(rainbowActive()?2:1); player.pearls+=g; runStats.chest++;
      banner('💰 SCHATZ!','+'+g+' Perlen');
      for(let i=0;i<30;i++) spawnPart(e.x,e.y-10,rand(-260,260),rand(-520,-120),rand(0.5,1),rand(2,4.5),i%2?'#ffd36b':'#fff4c2',true);
      Audio.sfx.chest(); cam.shake=Math.max(cam.shake,6); checkMissions(); break;
    }
    case ENT.SHARD: {
      e.got=true; const g=15*(rainbowActive()?2:1); player.pearls+=g; runStats.shards++;
      floatText(sx(e.x),worldToScreenY(e.y),'🌠 +'+g,'#fff4c2',17); Audio.sfx.chime(); checkMissions(); break;
    }
    case ENT.MAGNET: { e.got=true; player.magnet=player.magnetMax=upVal('magnet'); runStats.powerups++; floatText(sx(e.x),worldToScreenY(e.y),'MAGNET','#7fe8ff',16); Audio.sfx.power(); break; }
    case ENT.SHIELD: { e.got=true; player.shield=true; runStats.powerups++; floatText(sx(e.x),worldToScreenY(e.y),'SCHILD','#8affc8',16); Audio.sfx.power(); break; }
    case ENT.TURBO:  { e.got=true; player.turbo=player.turboMax=upVal('turbo'); runStats.powerups++; floatText(sx(e.x),worldToScreenY(e.y),'TURBO','#ffb03a',16); Audio.sfx.boost(); cam.shake=6; break; }
    case ENT.STAR:   { e.got=true; player.star=player.starMax=upVal('star'); runStats.powerups++; floatText(sx(e.x),worldToScreenY(e.y),'★ UNBESIEGBAR','#ffe36b',16); Audio.sfx.power(); break; }
    case ENT.ROCK: case ENT.JELLY: case ENT.BUOY: {
      if(player.air) return; // in der Luft überspringst du Hindernisse
      hitHazard(e,P); break;
    }
    case ENT.FIN: {
      if(player.air) return; // drüberspringen = sicher
      sharkAttack(e,P); break;
    }
  }
}
// Browser blockieren vibrate() (mit Konsolen-Fehler), solange noch nicht getippt wurde
function buzz(ms){ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)){ try{ navigator.vibrate(ms); }catch(err){} } }
const HAZARD_LABEL={rock:'Fels', jelly:'Qualle', buoy:'Boje', fin:'Hai'};
function hitHazard(e,P){ doWipeout(HAZARD_LABEL[e.type]||'Hindernis'); }
function logWipe(cause){ runStats.wipeLog.push({t:sea.clock, c:cause}); }
function sharkAttack(e,P){
  // Hai = tödlich. Ausnahmen: Stern, Blink-Schonfrist, Schild (frisst den Hai statt dich)
  if(player.star>0 || player.invPop>0) return;
  if(player.shield){ player.shield=false; player.invPop=1.1; e.got=true;
    floatText(sx(player.x),worldToScreenY(player.y)-30,'SCHILD!','#7fe8ff',18); Audio.sfx.land(false); cam.shake=8; return; }
  player.deathBy='shark';
  Audio.sfx.crash(); cam.shake=26;
  for(let i=0;i<44;i++) spawnPart(player.x, player.y, rand(-280,280), rand(-460,40), rand(0.4,0.9), rand(2,5.5), i%3? '#ffffff':'#ff4a4a', true);
  gameOver();
}
function doWipeout(cause='Hindernis'){
  if(player.star>0 || player.invPop>0 || player.wipe>0) return;
  if(player.shield){ player.shield=false; player.invPop=1.1; floatText(sx(player.x),worldToScreenY(player.y)-30,'SCHILD!','#7fe8ff',18); Audio.sfx.land(false); cam.shake=8; return; }
  logWipe(cause);
  player.air=false; player.wipe=0.75; player.vx=Math.min(player.vx,300);
  player.invPop=1.6; // kurze Schonfrist nach dem Aufstehen — verhindert unfaire Wipeout-Ketten
  runStats.lastWipeDist=player.dist;
  player.combo=0; player.mult=1;
  floatText(sx(player.x),worldToScreenY(player.y)-40,'WIPEOUT','#ff6b6b',20);
  spray(sx(player.x)+cam.x, player.y, -1, 24, '#ffffff');
  Audio.sfx.crash(); cam.shake=16;
  buzz(45);
}

//////////////////// Boss update/draw ////////////////////
function updateBoss(dt){
  if(!bossState.active) return;
  for(const t of bossState.tents){
    if(!t.alive) continue;
    t.y0=surfaceY(t.x);
    const topY = t.y0 - t.h - Math.sin(perfNow()/300+t.ph)*10;
    // Jede Tentakel wird genau EINMAL aufgelöst, wenn der Spieler ihre x-Position überquert
    if(player.x > t.x - 4){
      t.alive=false;
      // großzügig: in der Luft & mindestens halb so hoch wie die Tentakel = drüber
      const cleared = player.air && player.y < t.y0 - t.h*0.5;
      if(cleared){
        player.pearls+=8; floatText(sx(t.x),worldToScreenY(topY)-16,'+8','#ffcaf0',16); Audio.sfx.collect(7);
      } else if(player.star<=0 && player.invPop<=0){
        if(player.shield){ player.shield=false; player.invPop=1.1; Audio.sfx.land(false); cam.shake=8; floatText(sx(t.x),worldToScreenY(player.y)-30,'SCHILD!','#7fe8ff',18); }
        else doWipeout('Kraken-Tentakel');
      }
    }
  }
}

//////////////////// Lebendiges Meer: Zufalls-Events ////////////////////
// Ein Event-Director streut regelmäßig eine Überraschung ein, damit sich kein Run gleich anfühlt.
// Zeit- statt distanzbasiert: bei vollem Tempo legt man ~145 m/s zurück, Distanz-Takt wäre Dauerfeuer.
const sea={};
function resetSea(){
  sea.clock=0; sea.nextT=4.5; sea.last=null;
  sea.dolphin=null; sea.whale=null;
  sea.meteors=[]; sea.meteorShower=0; sea.meteorSpawn=0; sea.ambientMeteorT=4;
  sea.showerT=0; sea.showerA=0; sea.rainbowOn=0; sea.rainbowA=0;
}
resetSea();
const SEA_EVENTS=[
  {key:'dolphin',  w:1.0, ok:()=>true},
  {key:'treasure', w:1.0, ok:()=>true},
  {key:'whale',    w:0.8, ok:()=>true},
  {key:'meteors',  w:1.6, ok:(P)=>save.fullVersion && P.starA>0.5}, // gehört zur Vollversion, nicht in den Vorgeschmack
  {key:'rainbow',  w:1.0, ok:()=>{ const b=biomeAt(player.dist); return (b.cur.key==='tropic'||b.cur.key==='sunset') && b.t<0.2; }},
];
function seaBusy(){ return !!(sea.dolphin || sea.whale || sea.meteorShower>0 || sea.showerT>0 || sea.rainbowOn>0); }
function rainbowActive(){ return sea.rainbowOn>0; }
function updateSea(dt,P){
  sea.clock+=dt;
  if(sea.clock>=sea.nextT){
    if(bossState.active || seaBusy()) sea.nextT=sea.clock+2;
    else {
      const pool=SEA_EVENTS.filter(e=>e.ok(P) && e.key!==sea.last);
      let r=Math.random()*pool.reduce((a,e)=>a+e.w,0), ev=pool[0];
      for(const e of pool){ r-=e.w; if(r<=0){ ev=e; break; } }
      if(ev){ startSeaEvent(ev.key,P); sea.last=ev.key; }
      sea.nextT=sea.clock+rand(10,15);
    }
  }
  updateDolphin(dt,P); updateWhale(dt,P); updateMeteors(dt,P); updateRainbow(dt,P);
}
function startSeaEvent(k,P){
  if(k==='dolphin'){
    sea.dolphin={x:player.x-260, y:surfaceY(player.x-260)+30, vy:0, air:false, t:0, dur:9, nextJump:0.8, ang:0, leaving:false};
    banner('🐬 DELFIN!','Er springt voraus und zeigt dir Perlen'); runStats.dolphin++; Audio.sfx.dolphin();
  } else if(k==='whale'){
    sea.whale={x:player.x+W*0.36, t:0, dur:3.6, out:false, splashed:false};
    player.pearls+=15; runStats.whale++; banner('🐋 WAL-SPRUNG!','+15 Perlen – Glücksbringer'); Audio.sfx.whale();
  } else if(k==='treasure'){
    spawnTreasure(); banner('💰 SCHATZSPUR!','Folge den Münzen zur Truhe');
  } else if(k==='meteors'){
    sea.meteorShower=6; spawnShards(); banner('🌠 STERNSCHNUPPEN!','Spring und fang die Sternsplitter');
  } else if(k==='rainbow'){
    sea.showerT=2.2; banner('🌦 SONNENREGEN','Gleich gibt es einen Regenbogen …');
  }
  checkMissions();
}

// --- 🐬 Delfin: schwimmt mit, springt voraus und legt eine Perlenspur auf deinen Weg ---
function updateDolphin(dt,P){
  const d=sea.dolphin; if(!d) return;
  d.t+=dt; if(!d.leaving && d.t>d.dur) d.leaving=true;
  const target = d.leaving ? player.x+W*1.3 : player.x+110;
  d.x += (player.vx + (target-d.x)*1.6)*dt;
  const s=surfaceY(d.x);
  if(d.air){
    d.vy += 1500*dt; d.y += d.vy*dt; d.ang=Math.atan2(d.vy, Math.max(300,player.vx));
    if(d.y>s+6 && d.vy>0){ d.air=false; spray(d.x,s,1,10,P.foam); d.nextJump=rand(1.1,1.7); }
  } else {
    d.y=lerp(d.y, s+24, 1-Math.exp(-dt*6)); d.ang=Math.atan(surfaceSlope(d.x))*0.6;
    d.nextJump-=dt;
    if(d.nextJump<=0 && !d.leaving){ d.air=true; d.vy=-640; spray(d.x,s,1,8,P.foam); dolphinPearls(); Audio.sfx.dolphin(); }
  }
  if(d.leaving && d.x>player.x+W) sea.dolphin=null;
}
function dolphinPearls(){
  const x0=player.x+player.vx*0.55+80; // knapp über dem Wasser -> beim Weiterreiten automatisch einsammelbar
  for(let i=0;i<6;i++){ const px=x0+i*34; ents.push({type:ENT.PEARL,x:px,y:surfaceY(px)-22,r:9,got:false}); }
}
function drawDolphin(P){
  const d=sea.dolphin; if(!d) return;
  const X=sx(d.x), Y=d.y-cam.y;
  if(X<-80||X>W+80) return;
  ctx.save(); ctx.translate(X,Y); ctx.rotate(d.ang); ctx.globalAlpha = d.y>surfaceY(d.x)+4 ? 0.45 : 1;
  const g=ctx.createLinearGradient(0,-12,0,12); g.addColorStop(0,'#5f8fb5'); g.addColorStop(0.55,'#7fa9c9'); g.addColorStop(0.6,'#e6f2f9'); g.addColorStop(1,'#d4e6f0');
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(30,2);
  ctx.quadraticCurveTo(24,-12,4,-12); ctx.quadraticCurveTo(-18,-11,-30,-2); ctx.lineTo(-30,3); ctx.quadraticCurveTo(-10,12,14,9); ctx.quadraticCurveTo(26,8,30,2); ctx.fill();
  ctx.fillStyle='#4f7ea5';
  ctx.beginPath(); ctx.moveTo(-2,-11); ctx.quadraticCurveTo(-6,-24,-14,-22); ctx.quadraticCurveTo(-10,-16,-10,-10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-40,-9); ctx.quadraticCurveTo(-35,0,-40,9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4,7,8,3,0.7,0,TAU); ctx.fill();
  ctx.fillStyle='#10202c'; ctx.beginPath(); ctx.arc(18,-2,1.8,0,TAU); ctx.fill();
  ctx.restore();
}

// --- 🐋 Wal: bricht vor dir durch die Oberfläche (hinter dem Wasser gezeichnet -> echtes Auftauchen) ---
function updateWhale(dt,P){
  const w=sea.whale; if(!w) return;
  w.t+=dt; w.x = player.x + W*0.36 - w.t*45; // schwimmt mit, du ziehst langsam vorbei
  const u=w.t/w.dur;
  if(!w.out && u>0.14){ w.out=true; spray(w.x+40,surfaceY(w.x+40),1,26,'#ffffff'); }
  if(!w.splashed && u>0.8){ w.splashed=true; const s=surfaceY(w.x);
    for(let i=0;i<46;i++) spawnPart(w.x+rand(-60,60), s, rand(-320,320), rand(-640,-180), rand(0.6,1.2), rand(2,6), i%3?'#ffffff':P.foam, true);
    cam.shake=Math.max(cam.shake,7); Audio.sfx.splash(); }
  if(w.t>w.dur) sea.whale=null;
}
function drawWhale(P){
  const w=sea.whale; if(!w) return;
  const u=clamp(w.t/w.dur,0,1), sc=clamp(W/900,0.6,1);
  const h=(Math.sin(u*Math.PI)*190-70)*sc;
  const X=sx(w.x), Y=surfaceY(w.x)-h-cam.y;
  const L=170;
  ctx.save(); ctx.translate(X,Y); ctx.rotate(lerp(-1.15,1.15,u)); ctx.scale(sc,sc);
  const Hh=46, g=ctx.createLinearGradient(0,-Hh,0,Hh);
  g.addColorStop(0,'#2c4a66'); g.addColorStop(0.55,'#3d5f7e'); g.addColorStop(0.56,'#c9dbe6'); g.addColorStop(1,'#a9c2d2');
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(L*0.55,0);
  ctx.bezierCurveTo(L*0.5,-Hh, -L*0.2,-Hh*0.9, -L*0.45,-Hh*0.25); ctx.lineTo(-L*0.55,-4); ctx.lineTo(-L*0.55,4);
  ctx.lineTo(-L*0.45,Hh*0.25); ctx.bezierCurveTo(-L*0.2,Hh*0.8, L*0.5,Hh, L*0.55,0); ctx.fill();
  ctx.fillStyle='#2c4a66'; ctx.beginPath(); ctx.moveTo(-L*0.55,0); ctx.lineTo(-L*0.75,-26); ctx.quadraticCurveTo(-L*0.66,0,-L*0.75,26); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#34546f'; ctx.beginPath(); ctx.ellipse(L*0.12,Hh*0.55,34,9,0.6,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(60,90,110,.45)'; ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(L*0.45-i*4,8+i*7); ctx.quadraticCurveTo(L*0.1,14+i*8,-L*0.05,10+i*7); ctx.stroke(); }
  ctx.fillStyle='#0d1a26'; ctx.beginPath(); ctx.arc(L*0.36,4,3.2,0,TAU); ctx.fill();
  ctx.restore();
}

// --- 💰 Schatztruhe: Münzspur ohne Hindernisse, am Ende eine Truhe ---
function spawnTreasure(){
  const x0=player.x+W+160, chx=x0+8*44+60;
  for(let i=ents.length-1;i>=0;i--){ const e=ents[i]; if(HAZARDS.has(e.type) && e.x>x0-120 && e.x<chx+160) ents.splice(i,1); }
  for(let i=0;i<8;i++){ const cx=x0+i*44; ents.push({type:ENT.COIN,x:cx,y:surfaceY(cx)-22,r:11,got:false,spin:i*0.4}); }
  ents.push({type:ENT.CHEST,x:chx,y:surfaceY(chx),r:24,ph:rand(TAU)});
  lastSpawnX=Math.max(lastSpawnX, chx+160);
}

// --- 🌠 Sternschnuppen (nur nachts): Sternsplitter in Sprunghöhe + Schnuppen am Himmel ---
function spawnShards(){
  let x=player.x+W+200;
  for(let i=0;i<4;i++){ ents.push({type:ENT.SHARD,x,y:surfaceY(x)-rand(75,115),r:14,ph:rand(TAU)}); x+=rand(650,900); }
}
function spawnMeteor(){ const sp=rand(700,1100), a=rand(2.45,2.75);
  sea.meteors.push({x:rand(W*0.3,W*1.1), y:rand(-20,H*0.25), vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.5,0.9)}); }
function updateMeteors(dt,P){
  if(sea.meteorShower>0){ sea.meteorShower-=dt; sea.meteorSpawn-=dt; if(sea.meteorSpawn<=0){ spawnMeteor(); sea.meteorSpawn=rand(0.15,0.4); } }
  else if(P.starA>0.5){ sea.ambientMeteorT-=dt; if(sea.ambientMeteorT<=0){ spawnMeteor(); sea.ambientMeteorT=rand(3,7); } }
  for(let i=sea.meteors.length-1;i>=0;i--){ const m=sea.meteors[i]; m.life-=dt; m.x+=m.vx*dt; m.y+=m.vy*dt; if(m.life<=0) sea.meteors.splice(i,1); }
}
function drawMeteors(){
  for(const m of sea.meteors){ const a=clamp(m.life/0.25,0,1), tx=m.x-m.vx*0.09, ty=m.y-m.vy*0.09;
    const g=ctx.createLinearGradient(m.x,m.y,tx,ty); g.addColorStop(0,`rgba(255,250,225,${0.95*a})`); g.addColorStop(1,'rgba(255,250,225,0)');
    ctx.save(); ctx.strokeStyle=g; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.fillStyle=`rgba(255,255,240,${a})`; ctx.beginPath(); ctx.arc(m.x,m.y,2.2,0,TAU); ctx.fill(); ctx.restore(); }
}

// --- 🌈 Sonnenregen -> Regenbogen: solange er steht, zählen Perlen doppelt ---
function updateRainbow(dt,P){
  if(sea.showerT>0){ sea.showerT-=dt;
    if(sea.showerT<=0){ sea.rainbowOn=7; banner('🌈 REGENBOGEN!','Perlen zählen jetzt doppelt'); Audio.sfx.chime(); } }
  if(sea.rainbowOn>0){ sea.rainbowOn-=dt; if(P.rainA>0.25||P.starA>0.3) sea.rainbowOn=Math.min(sea.rainbowOn,1.2); }
  sea.showerA=lerp(sea.showerA, sea.showerT>0?1:0, 1-Math.exp(-dt*2));
  const tgt = sea.rainbowOn>1.2 ? 1 : Math.max(0, sea.rainbowOn/1.2);
  sea.rainbowA=lerp(sea.rainbowA, tgt, 1-Math.exp(-dt*2));
}
function drawRainbow(a){
  const R=Math.min(W*0.7,H*0.6), cx=W*0.5, cy=H*0.78;
  const cols=['#ff4a4a','#ff9a3a','#ffe14a','#4ae06a','#4ab8ff','#6a5cff','#b45cff'];
  ctx.save(); ctx.globalAlpha=0.34*a; ctx.lineWidth=Math.max(5,R*0.03);
  cols.forEach((c,i)=>{ ctx.strokeStyle=c; ctx.beginPath(); ctx.arc(cx,cy,R-i*ctx.lineWidth,Math.PI,0); ctx.stroke(); });
  ctx.restore();
}
