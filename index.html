function gameOver(){
  if(state!=='play') return;
  state='over';
  Audio.setActive(false);
  player.dead=true;
  bankRun();
  prepareShareImage();
}

//////////////////// Rendering helpers ////////////////////
function sx(worldX){ return worldX - cam.x; } // screen x
let shakeX=0, shakeY=0;
function applyShake(){ if(cam.shake>0){ shakeX=rand(-cam.shake,cam.shake); shakeY=rand(-cam.shake,cam.shake);} else {shakeX=0;shakeY=0;} }

//////////////////// Background ////////////////////
let bgStars=[]; for(let i=0;i<120;i++) bgStars.push({x:Math.random(),y:Math.random()*0.6,r:rand(0.5,1.8),tw:rand(TAU)});
function drawBackground(P,dist){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,P.sky[0]); g.addColorStop(1,P.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // stars
  if(P.starA>0.02){
    ctx.save(); ctx.globalAlpha=P.starA;
    for(const s of bgStars){ const a=0.5+0.5*Math.sin(perfNow()/700+s.tw); ctx.globalAlpha=P.starA*a; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,TAU); ctx.fill(); }
    ctx.restore();
  }
  // aurora
  if(P.auroraA>0.02){
    ctx.save(); ctx.globalCompositeOperation='screen';
    for(let b=0;b<3;b++){
      const yy=H*0.14+b*36; ctx.beginPath();
      for(let xx=0;xx<=W;xx+=18){ const yo=Math.sin(xx/120+perfNow()/1600+b)*26; ctx.lineTo(xx,yy+yo); }
      ctx.lineTo(W,yy+90); for(let xx=W;xx>=0;xx-=18){ const yo=Math.sin(xx/120+perfNow()/1600+b)*26; ctx.lineTo(xx,yy+70+yo); }
      ctx.closePath();
      const ag=ctx.createLinearGradient(0,yy,0,yy+90);
      ag.addColorStop(0,rgba(b===1?'#a0f0c0':'#8affe0',0.0)); ag.addColorStop(0.5,rgba(b===1?'#7affc0':'#6ad0ff',0.22*P.auroraA)); ag.addColorStop(1,rgba('#7a5cff',0.0));
      ctx.fillStyle=ag; ctx.fill();
    }
    ctx.restore();
  }
  if(dist>0) drawMeteors();

  // sun / moon
  const sunX=W*0.72, sunY=H*0.26 - Math.sin(dist/1500)*20;
  ctx.save();
  const glow=ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,220);
  glow.addColorStop(0,rgba(P.sunGlow,0.55)); glow.addColorStop(1,rgba(P.sunGlow,0));
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=P.sun; ctx.beginPath(); ctx.arc(sunX,sunY,46,0,TAU); ctx.fill();
  // volumetric rays
  ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.10;
  for(let i=0;i<10;i++){ ctx.save(); ctx.translate(sunX,sunY); ctx.rotate(i/10*TAU + perfNow()/9000); ctx.fillStyle=P.sunGlow; ctx.fillRect(0,-6,700,12); ctx.restore(); }
  ctx.restore();
  if(dist>0 && sea.rainbowA>0.01) drawRainbow(sea.rainbowA);

  // distant islands / clouds parallax
  if(P.islands){
    ctx.save(); ctx.globalAlpha=0.85;
    const off=(cam.x*0.15)% (W+400);
    for(let i=-1;i<3;i++){
      const bx = -off + i*(W*0.6) - 100;
      ctx.fillStyle=mixHex(P.water[2],'#2b2b3a',0.3);
      // Insel sitzt auf dem Horizont-Meer (das darunter gezeichnet wird)
      ctx.beginPath(); ctx.moveTo(bx,H*0.565); ctx.quadraticCurveTo(bx+120,H*0.4,bx+240,H*0.565); ctx.closePath(); ctx.fill();
      // palm
      ctx.strokeStyle=mixHex(P.water[2],'#1a1a10',0.4); ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(bx+180,H*0.52); ctx.quadraticCurveTo(bx+192,H*0.44,bx+178,H*0.4); ctx.stroke();
      ctx.fillStyle='#2e6b3e';
      for(let l=0;l<4;l++){ ctx.save(); ctx.translate(bx+178,H*0.4); ctx.rotate(-1.2+l*0.6); ctx.beginPath(); ctx.ellipse(14,0,18,5,0,0,TAU); ctx.fill(); ctx.restore(); }
    }
    ctx.restore();
  } else {
    // clouds
    ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle='#ffffff';
    const off=(cam.x*0.08)%(W+300);
    for(let i=-1;i<4;i++){ const bx=-off+i*360; const by=H*(0.18+0.08*((i+2)%3)); ctx.beginPath(); ctx.ellipse(bx,by,80,26,0,0,TAU); ctx.ellipse(bx+60,by+8,60,20,0,0,TAU); ctx.fill(); }
    ctx.restore();
  }
  // Horizont-Meer: fernes Wasserband – sichtbar, wenn die Kamera bei hohen Sprüngen über die Welle steigt
  { const hy=H*0.56, hg=ctx.createLinearGradient(0,hy,0,H);
    hg.addColorStop(0,mixHex(P.water[0],P.sky[1],0.45)); hg.addColorStop(1,P.water[1]);
    ctx.save(); ctx.fillStyle=hg; ctx.fillRect(0,hy,W,H-hy+2);
    ctx.fillStyle=rgba(P.foam,0.35); ctx.fillRect(0,hy,W,1.5); ctx.restore(); }

  // gulls
  if(P.gulls){ ctx.save(); ctx.strokeStyle='rgba(40,40,50,.5)'; ctx.lineWidth=2;
    for(let i=0;i<4;i++){ const gx=((perfNow()/40+i*180)% (W+120))-60; const gy=H*0.2+i*22+Math.sin(perfNow()/500+i)*6;
      ctx.beginPath(); ctx.moveTo(gx-8,gy); ctx.quadraticCurveTo(gx,gy-6,gx+8,gy); ctx.stroke(); } ctx.restore(); }
}

//////////////////// Water ////////////////////
function drawWater(P){
  // main water body: sample surface across screen
  const step=8;
  const pts=[];
  for(let sxp=-20; sxp<=W+20; sxp+=step){ const wx=sxp+cam.x; pts.push([sxp, surfaceY(wx)-cam.y]); }
  // body fill
  ctx.beginPath(); ctx.moveTo(-20,H+20);
  for(const p of pts) ctx.lineTo(p[0],p[1]); ctx.lineTo(W+20,H+20); ctx.closePath();
  const wg=ctx.createLinearGradient(0,H*0.2,0,H);
  wg.addColorStop(0,P.water[0]); wg.addColorStop(0.5,P.water[1]); wg.addColorStop(1,P.water[2]);
  ctx.fillStyle=wg; ctx.fill();

  // subsurface shimmer / bioluminescence
  if(P.biolumA>0.02){
    ctx.save(); ctx.globalCompositeOperation='screen';
    for(let i=0;i<40;i++){ const sxp=((i*97+perfNow()/20)%(W+40))-20; const wx=sxp+cam.x; const yy=surfaceY(wx)-cam.y+rand(10,140);
      ctx.globalAlpha=P.biolumA*rand(0.1,0.4); ctx.fillStyle=P.foam; ctx.beginPath(); ctx.arc(sxp,yy,rand(1,2.6),0,TAU); ctx.fill(); }
    ctx.restore();
  }

  // crest foam line
  ctx.save(); ctx.strokeStyle=rgba(P.foam,0.85); ctx.lineWidth=3; ctx.beginPath();
  pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  // secondary highlight
  ctx.strokeStyle=rgba(P.foam,0.25); ctx.lineWidth=8; ctx.stroke();
  ctx.restore();

  // moving highlight bands under surface
  ctx.save(); ctx.globalAlpha=0.08; ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
  for(let b=1;b<=3;b++){ ctx.beginPath(); for(let sxp=-20;sxp<=W+20;sxp+=step){ const wx=sxp+cam.x; ctx.lineTo(sxp, surfaceY(wx)-cam.y + b*22 + Math.sin(wx/60+perfNow()/500)*4); } ctx.stroke(); }
  ctx.restore();

  // barrel/tube effect when player dives fast down a big face
  const slope=surfaceSlope(player.x);
  if(!player.air && player.holding && slope>0.6 && player.vx>700){
    const px=sx(player.x), py=surfaceY(player.x)-cam.y;
    ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle=rgba(P.water[2],0.9);
    ctx.beginPath(); ctx.moveTo(px-40,py-120); ctx.quadraticCurveTo(px+120,py-160,px+150,py-20);
    ctx.quadraticCurveTo(px+120,py-90,px+40,py-70); ctx.quadraticCurveTo(px-10,py-60,px-40,py-120); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=rgba(P.foam,0.7); ctx.lineWidth=4; ctx.stroke();
    ctx.restore();
  }
}

//////////////////// Rekord-Boje: deine Bestweite steht als Fahne im Wasser ////////////////////
function drawBestMarker(){
  if(save.best<80) return;
  const bxw=save.best*PXPM, X=sx(bxw); if(X<-50||X>W+50) return;
  const Y=surfaceY(bxw)-cam.y+Math.sin(perfNow()/420)*3;
  ctx.save();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X,Y-74); ctx.stroke();
  ctx.fillStyle='#ffe36b'; ctx.beginPath(); ctx.moveTo(X,Y-74); ctx.lineTo(X+44,Y-64); ctx.lineTo(X,Y-54); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1b3a55'; ctx.font='800 10px system-ui'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('BEST',X+4,Y-64);
  ctx.fillStyle='#ff5a4a'; ctx.beginPath(); ctx.ellipse(X,Y+2,13,6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.fillRect(X-13,Y,26,2.5);
  ctx.restore();
}

//////////////////// Gefahren-Vorwarnung ////////////////////
// Jedes Hindernis wird ~1,2 s vor Ankunft am rechten Rand angekündigt – unabhängig von Bildschirmbreite
// und Tempo. Vorher sah man es auf dem iPhone nur 0,2–0,4 s vorher (unter der menschlichen Reaktionszeit).
const WARN_SEC=1.2;
function drawHazardWarnings(){
  const v=Math.max(player.vx,300), edgeX=cam.x+W-8;
  const list=[];
  for(const e of ents){ if(HAZARDS.has(e.type)) list.push({x:e.x, y:e.y, shark:e.type===ENT.FIN, tent:false}); }
  if(bossState.active) for(const t of bossState.tents) if(t.alive) list.push({x:t.x, y:t.y0-t.h*0.5, shark:true, tent:true});
  for(const h of list){
    if(h.x <= edgeX) continue;                      // schon im Bild
    const tta=(h.x-player.x)/v; if(tta>WARN_SEC) continue;
    const k=1-tta/WARN_SEC;                         // 0 = gerade angekündigt, 1 = gleich da
    const X=W-24, Y=clamp(h.y-cam.y-14, 120, H-70), r=15, col=h.shark?'#ff3b4a':'#ffb03a';
    ctx.save(); ctx.globalAlpha=0.7+0.3*k;
    ctx.fillStyle=rgba(col,0.3+0.3*k*(0.6+0.4*Math.sin(perfNow()/(h.shark?70:110))));
    ctx.beginPath(); ctx.arc(X,Y,r+9,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(8,24,40,.55)'; ctx.beginPath(); ctx.arc(X,Y,r+4.5,0,TAU); ctx.fill(); // Kontrast auf hellem Himmel
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(X,Y,r+3,-Math.PI/2,-Math.PI/2+TAU*k); ctx.stroke(); // Countdown
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const shark=h.shark&&!h.tent; ctx.font=(shark?'16px':'900 17px')+' system-ui'; ctx.fillText(shark?'🦈':'!', X, Y+1);
    ctx.beginPath(); ctx.moveTo(X+r+6,Y); ctx.lineTo(X+r,Y-5); ctx.lineTo(X+r,Y+5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

//////////////////// Chaser monster wave ////////////////////
function drawChaser(P){
  const cxs = sx(player.chaserX);
  const gap=player.x-player.chaserX;
  if(cxs < -260){
    // noch außerhalb des Bildes (v.a. auf schmalen Handys): Gischt am linken Rand kündigt sie an
    if(gap<900){ const a=clamp((900-gap)/700,0,1);
      ctx.save(); const eg=ctx.createLinearGradient(0,0,60+40*a,0); eg.addColorStop(0,rgba(P.foam,0.55*a)); eg.addColorStop(1,rgba(P.foam,0));
      ctx.fillStyle=eg; ctx.fillRect(0,0,100,H);
      for(let i=0;i<Math.round(12*a);i++){ ctx.fillStyle=rgba(P.foam,rand(0.3,0.75)*a); ctx.beginPath(); ctx.arc(rand(0,20+40*a), rand(0,H), rand(2,5),0,TAU); ctx.fill(); }
      ctx.restore(); }
    drawChaserTint(gap); return;
  }
  ctx.save();
  const g=ctx.createLinearGradient(cxs-260,0,cxs+80,0);
  g.addColorStop(0, rgba(P.water[2],0)); g.addColorStop(0.55, rgba(P.water[1],0.9)); g.addColorStop(1, rgba(P.water[0],0.96));
  ctx.beginPath(); ctx.moveTo(cxs-280,H+40); ctx.lineTo(cxs-280,-40);
  for(let y=-40;y<=H+40;y+=20){ const xo=Math.sin(y/70+perfNow()/280)*20; ctx.lineTo(cxs+xo+50, y); }
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=rgba(P.foam,0.9); ctx.lineWidth=7; ctx.beginPath();
  for(let y=-40;y<=H+40;y+=16){ const xo=Math.sin(y/70+perfNow()/280)*20; const xx=cxs+xo+50; y===-40?ctx.moveTo(xx,y):ctx.lineTo(xx,y);} ctx.stroke();
  for(let i=0;i<7;i++){ ctx.fillStyle=rgba(P.foam,rand(0.2,0.6)); ctx.beginPath(); ctx.arc(cxs+50+rand(-8,28), rand(0,H), rand(2,5),0,TAU); ctx.fill(); }
  ctx.restore();
  drawChaserTint(gap);
}
function drawChaserTint(gap){
  if(gap<620){ const a=clamp((620-gap)/620,0,0.5)*(0.6+0.4*Math.sin(perfNow()/120));
    ctx.save(); const dg=ctx.createLinearGradient(0,0,W*0.5,0); dg.addColorStop(0,rgba('#ff2b4a',a)); dg.addColorStop(1,rgba('#ff2b4a',0)); ctx.fillStyle=dg; ctx.fillRect(0,0,W*0.5,H); ctx.restore(); }
}

//////////////////// Entities draw ////////////////////
function drawEntities(P){
  for(const e of ents){
    const X=sx(e.x), Y=e.y-cam.y;
    if(X<-60||X>W+60) continue;
    switch(e.type){
      case ENT.PEARL: {
        ctx.save(); const g=ctx.createRadialGradient(X-2,Y-2,1,X,Y,e.r); g.addColorStop(0,'#ffffff'); g.addColorStop(1,P.accent);
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,e.r,0,TAU); ctx.fill();
        ctx.globalAlpha=0.5; ctx.fillStyle=rgba(P.foam,0.6); ctx.beginPath(); ctx.arc(X,Y,e.r+3+Math.sin(perfNow()/200)*1.5,0,TAU); ctx.stroke(); ctx.restore();
        break; }
      case ENT.COIN: {
        e.spin=(e.spin||0)+0.1; const sw=Math.abs(Math.cos(e.spin));
        ctx.save(); ctx.fillStyle='#ffd36b'; ctx.strokeStyle='#c98a2b'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.ellipse(X,Y,e.r*sw+2,e.r,0,0,TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#fff4c2'; ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; if(sw>0.5)ctx.fillText('★',X,Y+1); ctx.restore();
        break; }
      case ENT.ROCK: {
        ctx.save(); ctx.fillStyle=mixHex(P.water[2],'#3a3540',0.5); ctx.strokeStyle='rgba(0,0,0,.3)';
        ctx.beginPath(); ctx.moveTo(X-e.r,Y+8); ctx.lineTo(X-e.r*0.5,Y-e.r); ctx.lineTo(X+e.r*0.3,Y-e.r*0.7); ctx.lineTo(X+e.r,Y+8); ctx.closePath(); ctx.fill();
        ctx.fillStyle=rgba(P.foam,0.5); ctx.beginPath(); ctx.ellipse(X,Y+8,e.r,5,0,0,Math.PI); ctx.fill(); ctx.restore();
        break; }
      case ENT.JELLY: {
        ctx.save(); ctx.globalAlpha=0.9; const jg=ctx.createRadialGradient(X,Y,2,X,Y,e.r);
        jg.addColorStop(0,'#ff9ee0'); jg.addColorStop(1,rgba('#c86bff',0.5));
        ctx.fillStyle=jg; ctx.beginPath(); ctx.arc(X,Y,e.r,Math.PI,0); ctx.fill();
        ctx.strokeStyle=rgba('#ffb3ec',0.7); ctx.lineWidth=2;
        for(let t=0;t<5;t++){ const tx=X-e.r+ t*(e.r*2/4); ctx.beginPath(); ctx.moveTo(tx,Y); ctx.quadraticCurveTo(tx+Math.sin(perfNow()/200+t)*4,Y+18,tx,Y+30); ctx.stroke(); }
        ctx.restore(); break; }
      case ENT.FIN: {
        ctx.save();
        const near = Math.abs(e.x-player.x) < 760; // tödlich = deutlich warnen
        if(near){ const pu=0.35+0.25*Math.sin(perfNow()/110);
          const wg2=ctx.createRadialGradient(X,Y-6,4,X,Y-6,46); wg2.addColorStop(0,rgba('#ff3b4a',pu)); wg2.addColorStop(1,rgba('#ff3b4a',0));
          ctx.fillStyle=wg2; ctx.beginPath(); ctx.arc(X,Y-6,46,0,TAU); ctx.fill();
          ctx.fillStyle='#ff5a5a'; ctx.font='800 15px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('⚠', X, Y-44+Math.sin(perfNow()/160)*3); }
        ctx.fillStyle='#26343f'; ctx.beginPath(); ctx.moveTo(X-22,Y+5); ctx.quadraticCurveTo(X-2,Y-38,X+18,Y+5); ctx.closePath(); ctx.fill();
        ctx.strokeStyle=rgba('#0d161d',0.6); ctx.lineWidth=2; ctx.stroke();
        // Kielwasser
        ctx.fillStyle=rgba(P.foam,0.55); ctx.beginPath(); ctx.ellipse(X,Y+5,26,5,0,0,Math.PI); ctx.fill();
        ctx.restore(); break; }
      case ENT.BUOY: {
        ctx.save(); ctx.fillStyle='#ff5a4a'; ctx.beginPath(); ctx.arc(X,Y-6,e.r*0.7,0,TAU); ctx.fill();
        ctx.fillStyle='#fff'; ctx.fillRect(X-e.r*0.7,Y-8,e.r*1.4,3); ctx.restore(); break; }
      case ENT.MAGNET: powerIcon(X,Y,e.r,'🧲','#7fe8ff'); break;
      case ENT.SHIELD: powerIcon(X,Y,e.r,'🛡','#8affc8'); break;
      case ENT.TURBO:  powerIcon(X,Y,e.r,'⚡','#ffb03a'); break;
      case ENT.STAR:   powerIcon(X,Y,e.r,'★','#ffe36b'); break;
      case ENT.GEM: {
        const by=Y+Math.sin(perfNow()/300+e.ph)*4, gl=ctx.createRadialGradient(X,by,2,X,by,30);
        ctx.save(); gl.addColorStop(0,'rgba(201,168,255,.7)'); gl.addColorStop(1,'rgba(201,168,255,0)'); ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(X,by,30,0,TAU); ctx.fill();
        const dg=ctx.createLinearGradient(X-10,by-14,X+10,by+14); dg.addColorStop(0,'#e8fbff'); dg.addColorStop(0.5,'#7fe8ff'); dg.addColorStop(1,'#9a5cff');
        ctx.fillStyle=dg; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(X,by-14); ctx.lineTo(X+11,by-4); ctx.lineTo(X,by+14); ctx.lineTo(X-11,by-4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X-11,by-4); ctx.lineTo(X+11,by-4); ctx.moveTo(X,by-14); ctx.lineTo(X-4,by-4); ctx.lineTo(X,by+14); ctx.stroke();
        if(((perfNow()/350+e.ph)%2)<0.3){ ctx.fillStyle='#fff'; ctx.beginPath(); for(let k=0;k<8;k++){ const rr=k%2?1:5, an=k*Math.PI/4; ctx.lineTo(X+6+Math.cos(an)*rr, by-9+Math.sin(an)*rr); } ctx.closePath(); ctx.fill(); }
        ctx.restore(); break; }
      case ENT.CHEST: {
        ctx.save(); ctx.translate(X,Y-12);
        const gl=ctx.createRadialGradient(0,0,4,0,0,46); gl.addColorStop(0,'rgba(255,211,107,.55)'); gl.addColorStop(1,'rgba(255,211,107,0)');
        ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,46,0,TAU); ctx.fill();
        ctx.fillStyle='#8a5a2b'; roundRect(-20,-6,40,22,4); ctx.fill();
        ctx.fillStyle='#a8703a'; ctx.beginPath(); ctx.moveTo(-20,-6); ctx.quadraticCurveTo(0,-24,20,-6); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#ffd36b'; ctx.fillRect(-20,-7,40,3); ctx.fillRect(-3,-12,6,26);
        ctx.fillStyle='#fff4c2'; ctx.fillRect(-2,2,4,5);
        const sp=(perfNow()/400+e.ph)%1; ctx.globalAlpha=1-sp; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10,-14-sp*10,2.2,0,TAU); ctx.fill();
        ctx.restore();
        ctx.save(); ctx.fillStyle=rgba(P.foam,0.5); ctx.beginPath(); ctx.ellipse(X,Y+2,24,4,0,0,Math.PI); ctx.fill(); ctx.restore();
        break; }
      case ENT.SHARD: {
        const tw=0.8+0.2*Math.sin(perfNow()/120+e.ph);
        ctx.save(); const gl=ctx.createRadialGradient(X,Y,1,X,Y,26); gl.addColorStop(0,'rgba(255,248,200,.9)'); gl.addColorStop(1,'rgba(255,248,200,0)');
        ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(X,Y,26,0,TAU); ctx.fill();
        ctx.translate(X,Y); ctx.rotate(perfNow()/700); ctx.scale(tw,tw); ctx.fillStyle='#fffbe0';
        ctx.beginPath(); for(let k=0;k<8;k++){ const rr=k%2?4:14, a=k*Math.PI/4; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } ctx.closePath(); ctx.fill();
        ctx.restore(); break; }
    }
  }
  // boss tentacles
  if(bossState.active){
    for(const t of bossState.tents){ if(!t.alive) continue;
      const X=sx(t.x), y0=t.y0-cam.y; const top=y0 - t.h - Math.sin(perfNow()/300+t.ph)*14;
      ctx.save(); ctx.fillStyle=mixHex(P.water[2],'#5a2b6b',0.6); ctx.strokeStyle=rgba('#ff6bd0',0.5); ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(X-t.r,y0);
      ctx.quadraticCurveTo(X-t.r+Math.sin(perfNow()/300)*10, (y0+top)/2, X-8, top);
      ctx.quadraticCurveTo(X, top-14, X+8, top);
      ctx.quadraticCurveTo(X+t.r+Math.sin(perfNow()/300)*10,(y0+top)/2, X+t.r, y0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // suckers
      ctx.fillStyle=rgba('#ffcaf0',0.6); for(let s=0;s<5;s++){ ctx.beginPath(); ctx.arc(X, top+ s*(t.h/5), 3,0,TAU); ctx.fill(); }
      ctx.restore();
    }
  }
}
function powerIcon(X,Y,r,glyph,color){
  ctx.save(); const g=ctx.createRadialGradient(X,Y,2,X,Y,r+6); g.addColorStop(0,rgba(color,0.9)); g.addColorStop(1,rgba(color,0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,r+8+Math.sin(perfNow()/200)*2,0,TAU); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font=`${r+4}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(glyph,X,Y+1); ctx.restore();
}

//////////////////// Player draw ////////////////////
// Spur hinter dem Board; pts in Bildschirm-Koordinaten (älteste zuerst) – auch für die Shop-Vorschau
function drawTrailDots(kind, pts, P){
  const t=perfNow(), A=ctx.globalAlpha; // A: Grund-Deckkraft (z. B. blass für gesperrte Trails im Shop)
  const special = kind && kind!=='foam';
  // Besondere Trails: Zwischenpunkte (bei Tempo liegen die Spurpunkte weit auseinander) und Kometenschweif –
  // dick und hell am Board, dünn und blass am Ende. Gischt bleibt aufquellende Spritzer.
  if(special){ const out=[]; for(let i=0;i<pts.length;i++){ if(i>0){ const p=pts[i-1], q=pts[i], k=Math.min(3,Math.floor(Math.hypot(q.x-p.x,q.y-p.y)/7));
      for(let s=1;s<=k;s++) out.push({x:p.x+(q.x-p.x)*s/(k+1), y:p.y+(q.y-p.y)*s/(k+1)}); } out.push(pts[i]); } pts=out; }
  const n=pts.length;
  ctx.save();
  for(let i=0;i<n;i++){ const X=pts[i].x, Y=pts[i].y, a=i/n, r=special ? 2.5+a*6 : (1-a)*8+2;
    ctx.beginPath();
    switch(kind){
      case 'stars': { ctx.globalAlpha=A*a*0.95; ctx.fillStyle=i%2?'#fff3a8':'#ffffff'; const s=r*0.75*(0.7+0.3*Math.sin(t/90+i));
        for(let k=0;k<8;k++){ const rr=k%2?s*0.35:s, an=k*Math.PI/4+t/400; ctx.lineTo(X+Math.cos(an)*rr, Y+Math.sin(an)*rr); } ctx.closePath(); ctx.fill(); break; }
      case 'fire':    { ctx.globalAlpha=A*a*0.85; ctx.fillStyle=a>0.66?'#ffe36b':a>0.33?'#ff8a2b':'#e0352b'; ctx.arc(X,Y-(1-a)*6,r*1.1,0,TAU); ctx.fill(); break; }
      case 'rainbow': { ctx.globalAlpha=A*a*0.85; ctx.fillStyle='hsl('+((i*28+t/8)%360)+',90%,62%)'; ctx.arc(X,Y,r,0,TAU); ctx.fill(); break; }
      case 'biolum':  { ctx.globalCompositeOperation='screen'; ctx.globalAlpha=A*a*0.95; ctx.fillStyle='#59f0d6'; ctx.arc(X,Y,r*1.2,0,TAU); ctx.fill(); ctx.globalCompositeOperation='source-over'; break; }
      case 'ink':     { ctx.globalAlpha=A*a*0.8; ctx.fillStyle=i%3?'#3a1d5a':'#7a3a9a'; ctx.arc(X,Y+(1-a)*4,r*1.15,0,TAU); ctx.fill(); break; }
      case 'pearls':  { ctx.globalAlpha=A*a*0.95; ctx.fillStyle='rgba(255,255,255,.4)'; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.arc(X,Y,r*0.75,0,TAU); ctx.fill(); ctx.stroke(); break; }
      case 'gold':    { ctx.globalAlpha=A*a*0.95; ctx.fillStyle=i%2?'#ffd36b':'#fff4c2'; ctx.arc(X,Y,r*0.85,0,TAU); ctx.fill(); break; }
      case 'storm':   { if(!i) break; const p=pts[i-1], j=(hash01(i*7+Math.floor(t/70))-0.5)*12*a; // zuckender Blitz zwischen den Spurpunkten
        ctx.moveTo(p.x,p.y); ctx.lineTo((p.x+X)/2+j*0.3,(p.y+Y)/2+j); ctx.lineTo(X,Y);
        ctx.globalAlpha=A*a*0.35; ctx.strokeStyle='#7fb8ff'; ctx.lineWidth=2+a*5; ctx.stroke();
        ctx.globalAlpha=A*a; ctx.strokeStyle=i%4?'#e8f4ff':'#ffffff'; ctx.lineWidth=0.8+a*1.6; ctx.stroke();
        if(i===n-1){ ctx.beginPath(); ctx.fillStyle='#e8f4ff'; ctx.arc(X,Y,2.5+Math.sin(t/60),0,TAU); ctx.fill(); } break; }
      default:        { ctx.globalAlpha=A*a*0.4; ctx.fillStyle=rgba(P.foam,0.6); ctx.arc(X,Y,r,0,TAU); ctx.fill(); }
    }
  }
  ctx.restore();
}
// ---------- Board + Surfer: gemeinsam für Spiel, Shop-Vorschau und Menü ----------
// Lokale Koordinaten: Ursprung = Board-Mitte (nach translate/rotate). ps = Posen-Gewichte {c,t,g,u}.
// Effekte respektieren die Grund-Deckkraft A (z. B. Blinken nach Wipeout).
function hash01(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function drawBoard(B,t){
  const A=ctx.globalAlpha;
  let c1=B.c1, c2=B.c2;
  if(B.fx==='prism'){ c1='hsl('+((t/12)%360)+',85%,62%)'; c2='hsl('+((t/12+140)%360)+',85%,58%)'; }
  if(B.fx==='galaxy'||B.fx==='phoenix'||B.fx==='bolt'){ // Leuchten unter dem Board
    const gc=B.fx==='galaxy'?'#b45cff':B.fx==='phoenix'?'#ff7a2b':'#7fd8ff';
    const gg=ctx.createRadialGradient(0,6,4,0,6,34); gg.addColorStop(0,rgba(gc,0.45)); gg.addColorStop(1,rgba(gc,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(0,6,36,14,0,0,TAU); ctx.fill();
  }
  const bg=ctx.createLinearGradient(-26,0,26,0); bg.addColorStop(0,c1); bg.addColorStop(1,c2);
  ctx.fillStyle=bg; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(0,6,26,7,0,0,TAU); ctx.fill(); ctx.stroke();
  if(B.fx){ // Muster innerhalb der Board-Form
    ctx.save(); ctx.beginPath(); ctx.ellipse(0,6,26,7,0,0,TAU); ctx.clip();
    if(B.fx==='galaxy'){
      for(let i=0;i<14;i++){ const x=((i*37+t/25)%60)-30, y=1+((i*13)%11); ctx.globalAlpha=A*(0.5+0.5*Math.sin(t/200+i)); ctx.fillStyle='#fff'; ctx.fillRect(x,y,1.5,1.5); }
      ctx.globalAlpha=A; const nx=6+Math.sin(t/900)*10, ng=ctx.createRadialGradient(nx,6,0,nx,6,16);
      ng.addColorStop(0,'rgba(255,107,214,.55)'); ng.addColorStop(1,'rgba(255,107,214,0)'); ctx.fillStyle=ng; ctx.fillRect(-26,-2,52,16);
    } else if(B.fx==='gold'){
      const s2=((t/5)%110)-55, sg=ctx.createLinearGradient(s2-9,0,s2+9,0);
      sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,255,255,.9)'); sg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=sg; ctx.fillRect(-26,-2,52,16);
    } else if(B.fx==='frost'){
      ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1; ctx.beginPath();
      for(const [x1,y1,x2,y2] of [[-20,4,-12,9],[-12,9,-5,3],[1,3,8,10],[8,10,15,4],[15,4,22,8]]){ ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); } ctx.stroke();
    } else if(B.fx==='bolt'){
      ctx.strokeStyle='#ffe14a'; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(-24,6); ctx.lineTo(-11,3); ctx.lineTo(-5,9); ctx.lineTo(5,3); ctx.lineTo(11,9); ctx.lineTo(24,6); ctx.stroke();
    } else if(B.fx==='fang'){ // Hai: heller Bauch, Kiemen, Zahnreihe an der Spitze
      ctx.fillStyle='#e6edf2'; ctx.fillRect(-26,7.5,52,7);
      ctx.strokeStyle='rgba(30,45,60,.55)'; ctx.lineWidth=1; ctx.beginPath(); for(let k=0;k<3;k++){ ctx.moveTo(9+k*3,2); ctx.quadraticCurveTo(10.5+k*3,6,9+k*3,10); } ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); for(let k=0;k<4;k++){ const x=16+k*2.4; ctx.moveTo(x,6.5); ctx.lineTo(x+2.4,6.5); ctx.lineTo(x+1.2,9.5); } ctx.fill();
    } else if(B.fx==='manta'){ // Manta: heller Bauch mit Punkten, Regenbogen-Schimmer
      const s2=((t/6)%120)-60, sg=ctx.createLinearGradient(s2-20,0,s2+20,0);
      sg.addColorStop(0,'rgba(255,255,255,0)'); RING_COLS.forEach((c,i)=>sg.addColorStop(0.15+i*0.14,rgba(c,0.55))); sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=sg; ctx.fillRect(-26,-2,52,9);
      ctx.fillStyle='#e8f4ff'; ctx.fillRect(-26,8,52,6); ctx.fillStyle='#2a5c8c'; for(const x of [-12,-4,6]){ ctx.beginPath(); ctx.arc(x,10.5,1.3,0,TAU); ctx.fill(); }
    } else if(B.fx==='scales'){ // schimmernde Meerjungfrauen-Schuppen
      ctx.lineWidth=1.1;
      for(let r=0;r<3;r++) for(let c=0;c<10;c++){ const x=-27+c*6+(r%2)*3, y=1+r*4;
        ctx.strokeStyle='hsla('+((t/10+c*24+r*40)%360)+',85%,82%,.65)'; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI); ctx.stroke(); }
    } else if(B.fx==='phoenix'){
      const fg=ctx.createLinearGradient(0,-1,0,13); fg.addColorStop(0,'rgba(255,227,107,.75)'); fg.addColorStop(1,'rgba(255,227,107,0)'); ctx.fillStyle=fg; ctx.fillRect(-26,-1,52,14);
    }
    ctx.restore();
  }
  ctx.fillStyle=rgba('#ffffff',0.4); ctx.beginPath(); ctx.ellipse(-6,4,12,2.4,0,0,TAU); ctx.fill();
  // Effekte außerhalb der Board-Form
  if(B.fx==='phoenix'){
    for(let i=0;i<6;i++){ const fx=-22+i*7, h=7+6*Math.abs(Math.sin(t/85+i*1.7)), sw=Math.sin(t/120+i)*2;
      const fg=ctx.createLinearGradient(0,2,0,2-h); fg.addColorStop(0,'#ff4a1f'); fg.addColorStop(0.6,'#ffa52b'); fg.addColorStop(1,'rgba(255,227,107,.2)');
      ctx.globalAlpha=A*0.9; ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(fx-4,3); ctx.quadraticCurveTo(fx-3,2-h*0.6,fx+sw,2-h); ctx.quadraticCurveTo(fx+3,2-h*0.6,fx+4,3); ctx.closePath(); ctx.fill(); }
    for(let i=0;i<5;i++){ const k=(t/14+i*19)%30; ctx.globalAlpha=A*(1-k/30); ctx.fillStyle=i%2?'#ffe36b':'#ff8a2b';
      ctx.beginPath(); ctx.arc(-20+i*9+Math.sin(t/200+i)*3, 0-k, 1.4, 0, TAU); ctx.fill(); }
  } else if(B.fx==='bolt'){
    const seed=Math.floor(t/90); ctx.strokeStyle='#bfe8ff'; ctx.lineWidth=1.5; ctx.shadowColor='#7fd8ff'; ctx.shadowBlur=6;
    for(let k=0;k<2;k++){ let x=-24+hash01(seed*3+k)*48, y=hash01(seed*7+k)>0.5?0:12, dir=y===0?-1:1;
      ctx.globalAlpha=A*0.9; ctx.beginPath(); ctx.moveTo(x,y); for(let s=0;s<3;s++){ x+=(hash01(seed*11+k*5+s)-0.5)*10; y+=dir*(3+hash01(seed*13+k+s)*4); ctx.lineTo(x,y); } ctx.stroke(); }
    ctx.shadowBlur=0;
  } else if(B.fx==='frost'){
    for(let i=0;i<4;i++){ const k=(t/30+i*13)%24, x=-18+i*12+Math.sin(t/300+i)*3; ctx.globalAlpha=A*(1-k/24); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x-2,-k); ctx.lineTo(x+2,-k); ctx.moveTo(x,-k-2); ctx.lineTo(x,-k+2); ctx.stroke(); }
  } else if(B.fx==='manta'){ // Kopflappen vorn, dünner Schwanz hinten
    ctx.strokeStyle=B.c2; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.beginPath();
    ctx.moveTo(24,3); ctx.quadraticCurveTo(31,1,30,-3); ctx.moveTo(24,9); ctx.quadraticCurveTo(31,11,30,15);
    ctx.moveTo(-26,6); ctx.quadraticCurveTo(-30,7+Math.sin(t/200)*2,-34,5); ctx.stroke();
  } else if(B.fx==='fang'){ // Rückenflosse am Heck
    ctx.fillStyle=B.c2; ctx.beginPath(); ctx.moveTo(-23,1); ctx.quadraticCurveTo(-19,-5,-21,-11); ctx.quadraticCurveTo(-15,-5,-13,1); ctx.closePath(); ctx.fill();
  } else if(B.fx==='gold' && ((t/400)%3)<0.4){
    ctx.globalAlpha=A; ctx.fillStyle='#fff'; ctx.beginPath(); const gx=18, gy=2;
    for(let k=0;k<8;k++){ const rr=k%2?1:4, an=k*Math.PI/4; ctx.lineTo(gx+Math.cos(an)*rr, gy+Math.sin(an)*rr); } ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=A;
}
function drawCharacter(B,S,ps,t){
  const A=ctx.globalAlpha;
  const dip = ps.c*7 + ps.t*4;                       // Hüfte senkt sich
  const lean = ps.c*0.16 + ps.t*0.24;                // leichte Vorlage
  const bend = Math.max(ps.c, ps.t*1.1, ps.g*0.6);   // Kniebeuge
  if(S.fx==='royal'){ const r=26+3*Math.sin(t/300), gg=ctx.createRadialGradient(0,-20,4,0,-20,r+10);
    gg.addColorStop(0,'rgba(255,211,107,.45)'); gg.addColorStop(1,'rgba(255,211,107,0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,-20,r+10,0,TAU); ctx.fill(); }
  drawBoard(B,t);
  // Beine mit Kniebeuge (Fuß -> Knie -> Hüfte)
  ctx.strokeStyle=S.suit; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-7,3); ctx.quadraticCurveTo(-13-5*bend, -3-4*bend, -7, -12+dip);
  ctx.moveTo(7,3);  ctx.quadraticCurveTo(13+5*bend, -3-4*bend, 7, -12+dip);
  ctx.stroke();
  // Oberkörper (gesenkt + geneigt)
  ctx.save(); ctx.translate(0,dip); ctx.rotate(lean);
  if(S.fx==='hero'){ // wehender Umhang hinter dem Körper
    const w1=Math.sin(t/110)*3, w2=Math.sin(t/110+1.3)*4, w3=Math.sin(t/110+2.4)*5;
    const cg=ctx.createLinearGradient(-30,0,0,0); cg.addColorStop(0,mixHex(S.cape,'#000000',0.35)); cg.addColorStop(1,S.cape);
    ctx.fillStyle=cg; ctx.beginPath(); ctx.moveTo(-6,-25); ctx.quadraticCurveTo(-18,-23+w1,-31,-15+w2); ctx.lineTo(-29,-3+w3); ctx.quadraticCurveTo(-16,-9+w1,-3,-11); ctx.closePath(); ctx.fill();
  }
  if(S.glow){ ctx.shadowColor=S.suit; ctx.shadowBlur=14; }
  ctx.fillStyle=S.suit; roundRect(-9,-26,18,16,7); ctx.fill(); ctx.shadowBlur=0;
  if(S.fx==='pirate'){ ctx.fillStyle='rgba(255,255,255,.9)'; for(let k=0;k<3;k++) ctx.fillRect(-8,-23+k*5,16,1.8); }
  else if(S.fx==='robot'){ ctx.strokeStyle='rgba(40,55,70,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,-25); ctx.lineTo(0,-11); ctx.stroke();
    ctx.fillStyle='#7fe8ff'; ctx.globalAlpha=A*(0.6+0.4*Math.sin(t/200)); ctx.beginPath(); ctx.arc(-4,-18,1.6,0,TAU); ctx.fill(); ctx.globalAlpha=A; }
  else if(S.fx==='hero'){ ctx.fillStyle='#ffe14a'; ctx.beginPath(); for(let k=0;k<10;k++){ const rr=k%2?2:5, an=-Math.PI/2+k*Math.PI/5; ctx.lineTo(Math.cos(an)*rr, -18+Math.sin(an)*rr); } ctx.closePath(); ctx.fill(); }
  else if(S.fx==='wizard'){ ctx.fillStyle='#ffe14a'; ctx.beginPath(); ctx.arc(0,-18,2,0,TAU); ctx.fill(); }
  // Arme je nach Pose
  ctx.strokeStyle=S.fx==='robot'?S.suit:S.skin; ctx.lineWidth=4;
  const armSwing=Math.sin(t/120)*2;
  ctx.beginPath();
  if(ps.g>0.5){        // GRAB: hintere Hand greift die Board-Kante
    ctx.moveTo(-8,-22); ctx.quadraticCurveTo(-15,-10,-18,4-dip);
    ctx.moveTo(8,-22);  ctx.lineTo(20,-28);
  } else if(ps.t>0.5){ // TUCK: Arme angelegt
    ctx.moveTo(-8,-22); ctx.lineTo(-12,-11);
    ctx.moveTo(8,-22);  ctx.lineTo(12,-11);
  } else if(ps.u>0.5){ // JUBEL: Arme hoch
    ctx.moveTo(-8,-24); ctx.lineTo(-16,-40);
    ctx.moveTo(8,-24);  ctx.lineTo(16,-40);
  } else {             // Balance (beim Hocken weiter ausgestreckt & tiefer)
    ctx.moveTo(-8,-22); ctx.lineTo(-20-6*ps.c,-24+armSwing+7*ps.c);
    ctx.moveTo(8,-22);  ctx.lineTo(20+6*ps.c,-20-armSwing+7*ps.c);
  }
  ctx.stroke();
  // Kopf
  if(S.fx==='robot'){
    ctx.fillStyle='#c9d3dc'; ctx.beginPath(); ctx.arc(0,-32,9,0,TAU); ctx.fill();
    ctx.shadowColor='#7fe8ff'; ctx.shadowBlur=8; ctx.fillStyle='rgba(127,232,255,'+(0.7+0.3*Math.sin(t/160))+')'; roundRect(-7,-35,14,5,2.5); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle='#8a97a4'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,-41); ctx.lineTo(0,-47); ctx.stroke();
    ctx.fillStyle=((t/400)%2)<1?'#ff4a5a':'#5a2a2a'; ctx.beginPath(); ctx.arc(0,-48,2,0,TAU); ctx.fill();
  } else if(S.fx==='ninja'){
    const w=Math.sin(t/90)*3; ctx.strokeStyle='#e8323c'; ctx.lineWidth=2.2; ctx.beginPath(); // flatternde Stirnband-Enden
    ctx.moveTo(-7,-36); ctx.quadraticCurveTo(-15,-38+w,-22,-34-w); ctx.moveTo(-7,-35); ctx.quadraticCurveTo(-14,-33-w,-21,-29+w); ctx.stroke();
    ctx.fillStyle=S.suit; ctx.beginPath(); ctx.arc(0,-32,8,0,TAU); ctx.fill();
    ctx.fillStyle=S.skin; roundRect(-5,-34,11,3.5,1.8); ctx.fill();
    ctx.fillStyle='#e8323c'; ctx.fillRect(-8,-38.5,16,2.2);
  } else {
    ctx.fillStyle=S.skin; ctx.beginPath(); ctx.arc(0,-32,8,0,TAU); ctx.fill();
    ctx.fillStyle=mixHex(S.skin,'#2b1a0a',0.7); ctx.beginPath(); ctx.arc(0,-34,8,Math.PI,0); ctx.fill();
    if(S.fx==='pirate'){
      ctx.fillStyle='#1d1d24'; ctx.beginPath(); ctx.moveTo(-13,-37); ctx.quadraticCurveTo(0,-52,13,-37); ctx.quadraticCurveTo(0,-42,-13,-37); ctx.fill();
      ctx.strokeStyle='#ffd36b'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(3.5,-32,2.4,0,TAU); ctx.fill(); ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-7,-35); ctx.lineTo(7,-29); ctx.stroke();
    } else if(S.fx==='wizard'){
      ctx.fillStyle='#4a2fa0'; ctx.beginPath(); ctx.ellipse(0,-38,12,3,0,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-7,-38); ctx.lineTo(4,-58); ctx.lineTo(8,-38); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffe14a'; ctx.beginPath(); ctx.arc(2,-46,1.8,0,TAU); ctx.fill();
    } else if(S.fx==='royal'){
      ctx.fillStyle='#ffd36b'; ctx.beginPath(); ctx.moveTo(-8,-38); ctx.lineTo(-8,-46); ctx.lineTo(-4,-42); ctx.lineTo(0,-48); ctx.lineTo(4,-42); ctx.lineTo(8,-46); ctx.lineTo(8,-38); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#e8323c'; ctx.beginPath(); ctx.arc(0,-41,1.6,0,TAU); ctx.fill(); ctx.fillStyle='#4ab8ff'; ctx.beginPath(); ctx.arc(-5,-40,1.2,0,TAU); ctx.arc(5,-40,1.2,0,TAU); ctx.fill();
    } else if(S.fx==='hero'){
      ctx.fillStyle=S.cape; roundRect(-7,-35,14,3.5,1.8); ctx.fill();
    }
  }
  ctx.restore();
  if(S.fx==='wizard'){ // kreisende Funken
    for(let k=0;k<3;k++){ const an=t/450+k*TAU/3, x=Math.cos(an)*22, y=-20+Math.sin(an)*12;
      ctx.globalAlpha=A*(0.6+0.4*Math.sin(t/150+k)); ctx.fillStyle=k%2?'#ffe14a':'#c9a8ff'; ctx.beginPath();
      for(let s=0;s<8;s++){ const rr=s%2?0.9:3, a2=s*Math.PI/4; ctx.lineTo(x+Math.cos(a2)*rr, y+Math.sin(a2)*rr); } ctx.closePath(); ctx.fill(); }
    ctx.globalAlpha=A;
  }
}
// Vorschau (Shop/Menü): Surfer auf Board an Bildschirmposition, ohne Spielzustand
function drawCharacterPreview(B,S,x,y,scale,boardOnly){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  if(boardOnly) drawBoard(B,perfNow()); else drawCharacter(B,S,{c:0,t:0,g:0,u:0},perfNow());
  ctx.restore();
}
function drawPlayer(P){
  const X=sx(player.x), Y=player.y-cam.y;
  drawTrailDots(save.trail, player.trail.map(t=>({x:sx(t.x), y:t.y-cam.y+6})), P);

  ctx.save();
  ctx.translate(X,Y);
  ctx.rotate(player.angle);
  // Schonfrist nach Wipeout: Surfer blinkt
  if(player.invPop>0 && player.wipe<=0){ ctx.globalAlpha = 0.45+0.4*Math.sin(perfNow()/60); }
  // aura states
  if(player.star>0){ ctx.save(); ctx.globalAlpha=0.4+0.2*Math.sin(perfNow()/80); const gg=ctx.createRadialGradient(0,-14,4,0,-14,44); gg.addColorStop(0,'#ffe36b'); gg.addColorStop(1,'rgba(255,227,107,0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,-14,44,0,TAU); ctx.fill(); ctx.restore(); }
  if(player.turbo>0){ // flame trail behind board
    ctx.save(); ctx.globalAlpha=0.8; ctx.fillStyle='#ff6a2b';
    for(let i=0;i<5;i++){ ctx.globalAlpha=0.6-i*0.1; ctx.beginPath(); ctx.ellipse(-26-i*10,4, 10-i, 5-i*0.6,0,0,TAU); ctx.fill(); ctx.fillStyle=i<2?'#ffd36b':'#ff6a2b'; } ctx.restore();
  }
  // ----- Posen weich blenden: c=hocken(pumpen) t=tuck(flip) g=grab u=jubel -----
  const tgt={ c:(!player.air&&player.holding&&player.wipe<=0)?1:0,
              t:(player.air&&player.holding)?1:0,
              g:(player.air&&player.grabT>0)?1:0,
              u:(player.celebrateT>0&&!player.air)?1:0 };
  const ps = player._pose || (player._pose={c:0,t:0,g:0,u:0});
  for(const k in tgt) ps[k]=lerp(ps[k],tgt[k],0.28);
  drawCharacter(player.B, player.S, ps, perfNow());
  // shield bubble
  if(player.shield){ ctx.strokeStyle=rgba('#7fe8ff',0.7+0.3*Math.sin(perfNow()/120)); ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,-16,30,0,TAU); ctx.stroke(); ctx.fillStyle=rgba('#7fe8ff',0.08); ctx.fill(); }
  ctx.restore();

  // magnet aura
  if(player.magnet>0){ ctx.save(); ctx.globalAlpha=0.3+0.15*Math.sin(perfNow()/100); ctx.strokeStyle='#7fe8ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(X,Y-14,150*(save.surfer==='reef'?1.3:1),0,TAU); ctx.stroke(); ctx.restore(); }
  // Lande-Ring: grün = Board ist landbar ausgerichtet -> jetzt loslassen
  if(player.air && (player.holding || player.rotAccum>0.6)){
    const la=surfaceAngle(player.x+player.vx*0.12);
    const ok=Math.abs(Math.atan2(Math.sin(la-player.angle),Math.cos(la-player.angle))) < 0.55;
    ctx.save(); ctx.globalAlpha=ok?0.9:0.55; ctx.lineWidth=ok?4:2.5; ctx.strokeStyle=ok?'#39e88a':'#ff8a5a';
    ctx.beginPath(); ctx.arc(X,Y-14,36,0,TAU); ctx.stroke(); ctx.restore();
  }
}

//////////////////// Surf-Schule (Tutorial) ////////////////////
// Jeder Schritt wartet, bis der Spieler ihn wirklich geschafft hat. Währenddessen: keine Haie/Bosse/Events,
// die Welle kann nicht fressen. Danach geht es nahtlos in den echten Lauf.
const TUT_STEPS=[
  {title:'Speed aufbauen', text:'Halte gedrückt – du pumpst die Welle runter und wirst schneller. Sieh, wie der ⚡-Balken steigt.', cue:'hold', hl:'speed'},
  {title:'Springen',       text:'Lass los, um abzuspringen.', cue:'release'},
  {title:'Hindernisse',    text:'', cue:'hold'},
  {title:'Flip',           text:'', cue:'release'},
  {title:'Die Monsterwelle', text:'Hinter dir rollt die Welle. Jeder Wipeout lässt sie aufholen – sauber surfen hält sie fern.', cue:null, hl:'wave'},
];
const tut={active:false, step:0, t:0, holdT:0, rock:null, msg:'', msgT:0, flips0:0, wipes0:0, rj0:0};
function tutSnapshot(){ tut.flips0=runStats.flips; tut.wipes0=runStats.wipeLog.length; tut.rj0=runStats.releaseJumps; }
function startTutorial(){
  Object.assign(tut,{active:true, step:0, t:0, holdT:0, rock:null, msg:'', msgT:0}); tutSnapshot();
  sea.nextT=1e9; bossState.next=1e9;
}
function endTutorial(skipped){
  tut.active=false; tut.rock=null; save.tutorialDone=true; persist(); uiButtons=[];
  player.waveGap=WAVE_CAP; player._warned=false;
  sea.nextT=sea.clock+5; bossState.next=Math.max(2200, player.dist+900);
  lastHzX=player.x+Math.max(player.vx,700)*1.2; // kurze Schonfrist, bevor zufällige Hindernisse kommen
  if(!skipped){ banner("🏄 LOS GEHT'S!",'Du bist bereit – viel Spaß!'); Audio.sfx.power(); }
}
function tutNext(){ tut.step++; tut.t=0; tut.holdT=0; tutSnapshot(); Audio.sfx.chime(); if(tut.step>=TUT_STEPS.length) endTutorial(false); }
function tutHint(m){ tut.msg=m; tut.msgT=2; }
function spawnTutRock(){
  const x=player.x+Math.max(player.vx,650)*2.4;
  tut.rock={type:ENT.ROCK, x, y:surfaceY(x), r:26}; ents.push(tut.rock); tut.wipes0=runStats.wipeLog.length;
}
function tutFlipPhase(){ if(!player.air) return 'jump'; if(!player.holding && player.rotAccum<0.4) return 'press'; return 'release'; }
function updateTutorial(dt){
  if(!tut.active) return;
  tut.t+=dt; if(tut.msgT>0) tut.msgT-=dt;
  if(tut.step<4) player.waveGap=WAVE_CAP;
  else player.waveGap=Math.max(420, lerp(player.waveGap, 460, 1-Math.exp(-dt*2))); // Welle kurz zeigen, aber nie fressen
  const s=tut.step;
  if(s===0){ if(player.holding && !player.air) tut.holdT+=dt; if(tut.holdT>1.3){ tutHint('✓ Spürst du den Speed?'); tutNext(); } }
  else if(s===1){ if(runStats.releaseJumps>tut.rj0){ tutHint('✓ Super!'); tutNext(); } }
  else if(s===2){
    if(!tut.rock) spawnTutRock();
    else if(tut.rock.x < player.x-40){
      if(runStats.wipeLog.length>tut.wipes0){ tutHint('Fast! Nochmal – spring, wenn „JETZT" erscheint.'); spawnTutRock(); }
      else { tutHint('✓ Sauber drüber!'); tut.rock=null; tutNext(); }
    }
  }
  else if(s===3){
    if(player.air) player.slowT=Math.max(player.slowT,0.12); // Zeitlupe zum Üben
    if(runStats.flips>tut.flips0){ tutHint('✓ Flip gestanden!'); tutNext(); }
    else if(runStats.wipeLog.length>tut.wipes0){ tut.wipes0=runStats.wipeLog.length; tutHint('Knapp! Loslassen, sobald der Ring GRÜN ist.'); }
  }
  else if(s===4){ if(tut.t>4.5) tutNext(); }
}
function splitLines(txt,maxW){ const out=[]; let line=''; for(const w of txt.split(' ')){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; } if(line) out.push(line); return out; }
function drawTutorial(){
  if(!tut.active) return;
  const s=TUT_STEPS[tut.step]; if(!s) return;
  let text=s.text, cue=s.cue;
  const held=player.holding; // Hinweise passen sich an: wer nicht drückt, kann nicht "loslassen"
  if(tut.step===1){ text = held ? 'Lass los, um abzuspringen.' : 'Erst gedrückt halten, dann loslassen = abspringen.'; cue = held?'release':'hold'; }
  if(tut.step===2){
    const tta = tut.rock ? (tut.rock.x-player.x)/Math.max(player.vx,300) : 9;
    if(player.air && tta<=0.6){ text='✈ Drüber!'; cue=null; }
    else if(tta<=0.5 && tta>0){ text = held ? 'JETZT loslassen – spring drüber!' : 'JETZT tippen – spring drüber!'; cue = held?'release':'tap'; }
    else if(tta<=WARN_SEC){ text='Da ist das ⚠ – gleich springen …'; cue='hold'; }
    else { text='Halte gedrückt und surf weiter. Achte auf das ⚠ am rechten Rand.'; cue='hold'; }
  }
  if(tut.step===3){ const ph=tutFlipPhase();
    text = ph==='jump' ? '① Halten, dann loslassen = abspringen.' : ph==='press' ? '② In der Luft: nochmal drücken und halten!' : '③ Loslassen, sobald der Ring GRÜN ist!';
    cue = ph==='press' ? 'hold' : ph==='jump' ? (held?'release':'hold') : 'release'; }
  const pad=14, cw=Math.min(W-32,420), x0=(W-cw)/2, y0=136;
  ctx.save(); ctx.font='600 14px system-ui';
  const lines=splitLines(text, cw-2*pad), ch=58+lines.length*19;
  roundRect(x0,y0,cw,ch,16); ctx.fillStyle='rgba(8,24,40,.8)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='800 11px system-ui'; ctx.fillStyle='#59f0d6'; ctx.fillText('SURF-SCHULE · '+(tut.step+1)+'/'+TUT_STEPS.length, x0+pad, y0+20);
  ctx.font='800 18px system-ui'; ctx.fillStyle='#fff'; ctx.fillText(s.title, x0+pad, y0+42);
  ctx.font='600 14px system-ui'; ctx.fillStyle='rgba(255,255,255,.92)'; lines.forEach((l,i)=>ctx.fillText(l, x0+pad, y0+64+i*19));
  if(tut.msgT>0){ const ok=tut.msg.startsWith('✓'); ctx.globalAlpha=clamp(tut.msgT/0.4,0,1);
    ctx.font='800 14px system-ui'; const mw=ctx.measureText(tut.msg).width+28;
    roundRect((W-mw)/2, y0+ch+10, mw, 30, 15); ctx.fillStyle=ok?'rgba(57,217,138,.92)':'rgba(255,176,58,.92)'; ctx.fill();
    ctx.fillStyle='#08182a'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(tut.msg, W/2, y0+ch+25); }
  ctx.restore();
  if(s.hl){ ctx.save(); ctx.strokeStyle='#ffe36b'; ctx.globalAlpha=0.55+0.45*Math.sin(perfNow()/160); ctx.lineWidth=2.5;
    roundRect(12, s.hl==='speed'?96:66, 126, 32, 10); ctx.stroke(); ctx.restore(); }
  if(cue) drawTutCue(cue);
  uiButtons=[]; btn('tut_skip', x0+cw-112, y0+8, 100, 26, 'Überspringen ›', {c1:'#2a3a52',c2:'#1d2a3d',fs:11}); drawButtons();
}
// Daumen-Hinweis: Halten = Ring zieht sich zusammen, Loslassen = Ring springt nach außen, Tippen = schneller Puls
function drawTutCue(cue){
  const hold=cue==='hold', tap=cue==='tap', per=tap?600:1200;
  const x=W/2, y=H-150, p=(perfNow()%per)/per, col=hold?'#59f0d6':'#ffe36b';

function bonusBestOf(kind){ const m=save.bonusBestBy||{}; return m[kind] || (kind==='lagoon' ? save.bonusBest||0 : 0); }
function startBonus(kind){
  kind = BONUS_KINDS[kind] ? kind : 'lagoon';
  if(!canPlayBonus()) return;
  if(bonusFreeToday()) save.bonusFreeDate=localDate(); else save.tickets--;
  persist();
  Object.assign(bonus,{ kind, t:0, pearls:0, gems:0, tokens:0, hurtT:0, holding:false, tap:false, ents:[], parts:[], floats:[],
    seed:rand(TAU), done:false, unlocked:false, newBest:false, shakeT:0, msg:null });
  ({lagoon:initLagoon, shark:initShark, levi:initLevi, manta:initManta})[kind]();
  state='bonus'; lastChordIdx=-1; Audio.resume(); Audio.setActive(true); Audio.setChord(CHORDS[BONUS_KINDS[kind].chord]);
}
function bonusFloat(x,y,txt,col){ bonus.floats.push({x,y,txt,col,life:1.1}); }
function bonusMsg(txt,life){ bonus.msg={txt, life:life||1.8}; }
function updateBonus(dt){
  const b=bonus; if(b.done) return;
  ({lagoon:updateLagoon, shark:updateShark, levi:updateLevi, manta:updateManta})[b.kind](dt);
  b.tap=false;
  if(b.shakeT>0) b.shakeT-=dt;
  if(b.msg){ b.msg.life-=dt; if(b.msg.life<=0) b.msg=null; }
  for(const fl of b.floats){ fl.y-=40*dt; fl.life-=dt; }
  b.floats=b.floats.filter(fl=>fl.life>0);
}
function endBonus(){
  const b=bonus, K=BONUS_KINDS[b.kind]; if(b.done) return;
  b.done=true; b.holding=false;
  save.pearls+=b.pearls; save.crystals+=b.gems; save[K.key]=(save[K.key]||0)+b.tokens;
  save.bonusRuns=(save.bonusRuns||0)+1;
  const best=bonusBestOf(b.kind); b.newBest = b.pearls>best && best>0;
  save.bonusBestBy=Object.assign({}, save.bonusBestBy, {[b.kind]:Math.max(best,b.pearls)});
  if(b.kind==='lagoon') save.bonusBest=Math.max(save.bonusBest||0,b.pearls);
  if(save[K.key]>=TOKENS_NEEDED && !bonusRewardOwned(b.kind)){
    if(K.reward.type==='board') save.ownedBoards.push(K.reward.key); else unlockTrail(K.reward.key);
    b.unlocked=true;
  }
  persist(); Audio.setActive(false); Audio.sfx.chime(); state='bonusEnd';
}
function drawBonus(){
  const b=bonus;
  ctx.save();
  if(b.shakeT>0 && !b.done){ const k=b.shakeT*10; ctx.translate(rand(-k,k), rand(-k,k)); } // nach dem Ende nie wackeln
  ({lagoon:drawLagoon, shark:drawShark, levi:drawLevi, manta:drawMantaScene})[b.kind]();
  ctx.restore();
  drawBonusHUD();
}
// Gemeinsame HUD-Teile: Perlen/Kristalle/Fundstück rechts, Intro-Text und Meldungen in der Mitte

// ---------- 🧜 Meerjungfrauen-Lagune ----------
// Unterwasser: HALTEN = abtauchen, LOSLASSEN = aufsteigen. Die Luft läuft ab, Quallen kosten nur Perlen.
function lagoonCeil(x){ const s=bonus.seed; return H*0.16 + Math.sin(x/260+s)*H*0.05 + Math.sin(x/97+s*2)*H*0.025; }
function lagoonFloor(x){ const s=bonus.seed; return H*0.86 + Math.sin(x/310+s*3)*H*0.05 + Math.sin(x/120+s)*H*0.025; }
function lagoonPath(x){ const c=lagoonCeil(x), f=lagoonFloor(x); return (c+f)/2 + Math.sin(x/230+bonus.seed)*(f-c)*0.28; }
// Weg der Meerjungfrau: folgt der Höhle und taucht vor der goldenen Muschel zu ihr hinab –
// am Handy sieht man die Muschel sonst erst ~0,9 s vorher, zu spät, um tief genug zu tauchen.
function lagoonGuide(x){
  const p=lagoonPath(x), d=x-bonus.shellX;
  if(d>-520 && d<140){ const u = d<0 ? smooth(clamp((d+520)/420,0,1)) : smooth(clamp(1-d/140,0,1)); return lerp(p, bonus.shellY, u); }
  return p;
}
function initLagoon(){
  const b=bonus;
  Object.assign(b,{ x:0, vy:0, air:BONUS_AIR, nextSpawn:260, bubbleT:0,
    gemX:rand(3600,5200), shellX:rand(6200,8000), gemPlaced:false, shellPlaced:false });
  b.shellY=lagoonFloor(b.shellX)-24;
  b.y=lagoonPath(0);
}
function spawnLagoon(x){
  const b=bonus, c=lagoonCeil(x), f=lagoonFloor(x), py=lagoonGuide(x);
  b.ents.push({type:'pearl', x, y:py, r:9});                                   // Perlenspur = Weg der Meerjungfrau
  if(x%690<46) b.ents.push({type:'air', x:x+20, y:rand(c+50,f-50), r:16});     // Luftblasen verlängern die Zeit
  if(x%830<46 && x>900 && Math.abs(x-b.shellX)>700){ const side=Math.random()<0.5?-1:1;
    b.ents.push({type:'jelly', x, y0:clamp(py+side*rand(70,110),c+30,f-30), r:20, ph:rand(TAU)}); }
  if(!b.gemPlaced && x>=b.gemX){ b.gemPlaced=true; const up=py-c>f-py;          // Kristall: abseits der Spur, Geschick nötig
    b.ents.push({type:'gem', x, y: up ? lerp(py,c+30,0.5) : lerp(py,f-30,0.5), r:13}); }
  if(!b.shellPlaced && x>=b.shellX){ b.shellPlaced=true; b.ents.push({type:'shell', x, y:b.shellY, r:15}); } // am Boden, die Spur führt hin
}
function updateLagoon(dt){
  const b=bonus;
  b.t+=dt; b.air-=dt; if(b.hurtT>0) b.hurtT-=dt;
  b.x+=(240+Math.min(b.t*3,90))*dt;
  b.vy+=(b.holding?950:-760)*dt; b.vy*=(1-1.6*dt); b.vy=clamp(b.vy,-330,330);
  b.y+=b.vy*dt;
  const c=lagoonCeil(b.x)+22, f=lagoonFloor(b.x)-22;   // Wände schubsen nur zurück
  if(b.y<c){ b.y=c; if(b.vy<0) b.vy=0; }
  if(b.y>f){ b.y=f; if(b.vy>0) b.vy=0; }
  while(b.nextSpawn < b.x+W*1.2){ spawnLagoon(b.nextSpawn); b.nextSpawn+=46; }
  for(const e of b.ents){
    if(e.got) continue;
    const ey = e.type==='jelly' ? e.y0+Math.sin(b.t*1.6+e.ph)*14 : e.y;
    const dx=e.x-b.x, dy=ey-b.y, rr=e.r+18; if(dx*dx+dy*dy>rr*rr) continue;
    if(e.type==='jelly'){
      if(b.hurtT<=0){ b.hurtT=1.2; const lost=Math.min(6,b.pearls); b.pearls-=lost; bonusFloat(e.x,ey,lost?'-'+lost+' ◐':'Autsch!','#ff9ec4'); Audio.sfx.land(false); }
      continue;
    }
    e.got=true;
    if(e.type==='pearl'){ b.pearls+=2; bonusFloat(e.x,e.y,'+2','#eafcff'); Audio.sfx.collect(b.pearls/2); }
    else if(e.type==='air'){ b.air=Math.min(BONUS_AIR_MAX,b.air+2.5); bonusFloat(e.x,e.y,'+2,5 s Luft','#bff0ff'); Audio.sfx.power(); }
    else if(e.type==='gem'){ b.gems++; bonusFloat(e.x,e.y,'💎 +1','#d6c4ff'); Audio.sfx.chime(); }
    else if(e.type==='shell'){ b.tokens++; bonusFloat(e.x,e.y,'🐚 Goldene Muschel!','#ffd36b'); Audio.sfx.chest(); }
  }
  b.ents=b.ents.filter(e=>!e.got && e.x>b.x-W*0.5);
  b.bubbleT-=dt; if(b.bubbleT<=0){ b.bubbleT=0.14; b.parts.push({x:b.x+18,y:b.y-10,vy:-50-rand(40),life:1.2,r:rand(1.5,3.5)}); }
  for(const p of b.parts){ p.y+=p.vy*dt; p.x+=Math.sin(b.t*4+p.r)*8*dt; p.life-=dt; }
  b.parts=b.parts.filter(p=>p.life>0);
  if(b.air<=0) endBonus();
}
function drawLagoonGem(X,Y){
  const t=perfNow(), gl=ctx.createRadialGradient(X,Y,2,X,Y,28);
  ctx.save(); gl.addColorStop(0,'rgba(201,168,255,.7)'); gl.addColorStop(1,'rgba(201,168,255,0)'); ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(X,Y,28,0,TAU); ctx.fill();
  const dg=ctx.createLinearGradient(X-10,Y-14,X+10,Y+14); dg.addColorStop(0,'#e8fbff'); dg.addColorStop(0.5,'#7fe8ff'); dg.addColorStop(1,'#9a5cff');
  ctx.fillStyle=dg; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X,Y-14); ctx.lineTo(X+11,Y-4); ctx.lineTo(X,Y+14); ctx.lineTo(X-11,Y-4); ctx.closePath(); ctx.fill(); ctx.stroke();
  if((t/350)%2<0.3){ ctx.fillStyle='#fff'; ctx.beginPath(); for(let k=0;k<8;k++){ const rr=k%2?1:5, an=k*Math.PI/4; ctx.lineTo(X+6+Math.cos(an)*rr, Y-9+Math.sin(an)*rr); } ctx.closePath(); ctx.fill(); }

function drawMermaid(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t/400)*6);
  for(let i=0;i<6;i++){ const k=(t/90+i*7)%40; ctx.globalAlpha=(1-k/40)*0.8; ctx.fillStyle=i%2?'#ffe36b':'#d6c4ff';
    ctx.beginPath(); ctx.arc(-50-k*1.5, Math.sin(t/200+i)*8, 1.8,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
  // Fischschwanz: wellenförmig von der Hüfte (0,0) nach hinten
  const pts=[]; for(let i=0;i<=8;i++){ const u=i/8; pts.push({x:-u*46, y:Math.sin(t/140-u*3)*u*9}); }
  const tg=ctx.createLinearGradient(0,0,-46,0); tg.addColorStop(0,'#2fd0c0'); tg.addColorStop(1,'#9a5cff');
  ctx.fillStyle=tg; ctx.beginPath();
  pts.forEach((p,i)=>{ const w=(1-i/8)*7+1.5; i?ctx.lineTo(p.x,p.y-w):ctx.moveTo(p.x,p.y-w); });
  for(let i=8;i>=0;i--){ const p=pts[i], w=(1-i/8)*7+1.5; ctx.lineTo(p.x,p.y+w); }
  ctx.closePath(); ctx.fill();
  const e=pts[8]; ctx.fillStyle='#b07aff'; ctx.beginPath(); ctx.moveTo(e.x,e.y);
  ctx.quadraticCurveTo(e.x-10,e.y-14,e.x-17,e.y-12); ctx.quadraticCurveTo(e.x-8,e.y,e.x-17,e.y+12); ctx.quadraticCurveTo(e.x-10,e.y+14,e.x,e.y); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; for(let i=1;i<7;i++){ const p=pts[i]; ctx.beginPath(); ctx.arc(p.x,p.y-1,3,0.3,Math.PI-0.3); ctx.stroke(); }
  // Oberkörper (schwimmt waagerecht nach rechts)
  ctx.fillStyle='#e8b48f'; ctx.beginPath(); ctx.ellipse(11,-1,12,6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#ff6ba6'; ctx.beginPath(); ctx.ellipse(13,1,5,4,0,0,TAU); ctx.fill();          // Muschel-Top
  ctx.strokeStyle='#e8b48f'; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(42,-3+Math.sin(t/250)*3); ctx.stroke();          // Arm zeigt den Weg
  // Haare wehen nach hinten, Kopf vorn
  ctx.fillStyle='#e8323c'; ctx.beginPath(); ctx.moveTo(32,-12);
  ctx.quadraticCurveTo(16,-20+Math.sin(t/200)*3, 2,-12+Math.sin(t/180)*4); ctx.quadraticCurveTo(14,-7,28,-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8b48f'; ctx.beginPath(); ctx.arc(30,-6,7,0,TAU); ctx.fill();
  ctx.fillStyle='#e8323c'; ctx.beginPath(); ctx.arc(30,-8,7,Math.PI*1.05,Math.PI*1.95); ctx.fill();
  ctx.fillStyle='#10202c'; ctx.beginPath(); ctx.arc(33,-6,1.2,0,TAU); ctx.fill();
  ctx.restore();
}

  ctx.fillStyle='#ffd36b'; ctx.beginPath(); ctx.ellipse(-29,-3+kick,6,3,0.3,0,TAU); ctx.ellipse(-29,4-kick,6,3,-0.3,0,TAU); ctx.fill(); // Flossen

  ctx.fillStyle='rgba(127,232,255,.85)'; roundRect(16,-12,8,5,2); ctx.fill(); ctx.strokeStyle='#1d2a3d'; ctx.lineWidth=1.2; ctx.stroke(); // Taucherbrille
  ctx.strokeStyle='#ffb03a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(12,-12); ctx.lineTo(12,-20); ctx.stroke();                // Schnorchel

function drawLagoonWater(camX,t){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2aa7c4'); g.addColorStop(0.4,'#0f5a82'); g.addColorStop(1,'#061a33');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='screen';
  for(let i=0;i<5;i++){ const bx=((i*W*0.27-camX*0.15+t/40)%(W*1.4)+W*1.4)%(W*1.4)-W*0.2;
    ctx.globalAlpha=0.07+0.04*Math.sin(t/900+i); ctx.fillStyle='#d8fbff';
    ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx+40,0); ctx.lineTo(bx+130,H); ctx.lineTo(bx+60,H); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.save(); for(let i=0;i<40;i++){ const px=((i*97-camX*0.4)%(W+20)+W+20)%(W+20)-10, py=((i*53+Math.sin(t/1500+i)*20)%H+H)%H;
    ctx.globalAlpha=0.25+0.25*Math.sin(t/600+i); ctx.fillStyle='#bff7ff'; ctx.fillRect(px,py,2,2); } ctx.restore();
}
function drawLagoon(){
  const b=bonus, t=perfNow(), camX=b.x-W*0.28, X=x=>x-camX, step=10;
  drawLagoonWater(camX,t);
  // Höhlenwände mit leuchtenden Kanten
  ctx.save(); ctx.fillStyle='#06223a';
  ctx.beginPath(); ctx.moveTo(-10,-10); for(let s=-10;s<=W+10;s+=step) ctx.lineTo(s,lagoonCeil(s+camX)); ctx.lineTo(W+10,-10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10,H+10); for(let s=-10;s<=W+10;s+=step) ctx.lineTo(s,lagoonFloor(s+camX)); ctx.lineTo(W+10,H+10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(89,240,214,.55)'; ctx.lineWidth=2.5; ctx.shadowColor='#59f0d6'; ctx.shadowBlur=8;
  for(const fn of [lagoonCeil,lagoonFloor]){ ctx.beginPath(); for(let s=-10;s<=W+10;s+=step){ const yy=fn(s+camX); s===-10?ctx.moveTo(s,yy):ctx.lineTo(s,yy); } ctx.stroke(); }
  ctx.shadowBlur=0;
  const k0=Math.floor(camX/70);
  for(let k=k0-1;k<k0+W/70+2;k++){ // Seegras + Leuchtpflanzen am Boden, Stalaktiten an der Decke
    const wx=k*70+hash01(k)*30, sx3=X(wx), fy=lagoonFloor(wx), h=30+hash01(k+9)*40, sway=Math.sin(t/700+k)*6;
    ctx.strokeStyle=hash01(k+3)>0.5?'#1f9a6a':'#2a7a9a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(sx3,fy+4); ctx.quadraticCurveTo(sx3+sway,fy-h*0.5,sx3+sway*1.6,fy-h); ctx.stroke();
    if(hash01(k+5)>0.55){ ctx.globalAlpha=0.6+0.4*Math.sin(t/300+k); ctx.fillStyle='#7dfbe8'; ctx.beginPath(); ctx.arc(sx3+sway*1.6,fy-h,3.5,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
    if(hash01(k+21)>=0.5){ const cx2=X(k*70+35), cy=lagoonCeil(k*70+35), hh=16+hash01(k+13)*26;
      ctx.fillStyle='#0a2f4a'; ctx.beginPath(); ctx.moveTo(cx2-9,cy-2); ctx.lineTo(cx2,cy+hh); ctx.lineTo(cx2+9,cy-2); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore();
  for(const e of b.ents){ const ex=X(e.x); if(ex<-40||ex>W+40) continue;
    if(e.type==='pearl'){ const gg=ctx.createRadialGradient(ex-2,e.y-2,1,ex,e.y,9); gg.addColorStop(0,'#ffffff'); gg.addColorStop(1,'#7dfbe8'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(ex,e.y,8,0,TAU); ctx.fill(); }
    else if(e.type==='air'){ ctx.save(); ctx.strokeStyle='rgba(220,250,255,.9)'; ctx.lineWidth=2;
      for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc(ex+(k-1)*9, e.y+Math.sin(t/300+k)*4-k*6, 6-k, 0, TAU); ctx.stroke(); } ctx.restore(); }
    else if(e.type==='jelly'){ const ey=e.y0+Math.sin(b.t*1.6+e.ph)*14, jg=ctx.createRadialGradient(ex,ey,2,ex,ey,e.r);
      ctx.save(); jg.addColorStop(0,'#ff9ee0'); jg.addColorStop(1,rgba('#c86bff',0.5)); ctx.fillStyle=jg; ctx.beginPath(); ctx.arc(ex,ey,e.r,Math.PI,0); ctx.fill();
      ctx.strokeStyle=rgba('#ffb3ec',0.7); ctx.lineWidth=2;
      for(let k=0;k<5;k++){ const tx=ex-e.r+k*(e.r*2/4); ctx.beginPath(); ctx.moveTo(tx,ey); ctx.quadraticCurveTo(tx+Math.sin(t/200+k)*4,ey+18,tx,ey+30); ctx.stroke(); } ctx.restore(); }
    else if(e.type==='gem') drawLagoonGem(ex, e.y+Math.sin(t/300)*4);
    else if(e.type==='shell') drawGoldShell(ex, e.y);
  }
  const mx=b.x+Math.min(270, W*0.5); drawMermaid(X(mx), lagoonGuide(mx), t); // auf schmalen Handys näher, sonst nur die Flosse im Bild
  ctx.save(); ctx.strokeStyle='rgba(220,250,255,.7)'; ctx.lineWidth=1.2;

  drawSwimmer(X(b.x), b.y, t, b);

// Kristall kündigt sich am rechten Rand an, solange er noch außerhalb des Bildes ist

function drawBonusFloats(X, Y){

function drawLagoonHUD(){

// ---------- 🦈 Hai-Jagd ----------
// Ein Riesenhai jagt dich durch eine Korallenschlucht im Sonnenuntergang. Jeder Angriff wird gleich fair angekündigt:
// Ein Ring um den Surfer füllt sich 1,25 s lang – wird er GRÜN, tippen = springen. Der Hai wechselt Takt und Richtung
// (schnappt von hinten, schnappt doppelt, taucht ab und kommt von vorn), damit man reagieren statt auswendig lernen muss.
// Kein Game Over: Ein Biss kostet Perlen, nach 3 Bissen endet die Flucht früher – die Beute bleibt.
const SHARK_TIME=35, SHARK_WARN=1.25, SHARK_JUMP=600, SHARK_G=1400, SHARK_SAFE=22, SHARK_BITE=0.07, SHARK_BITES=3, SHARK_JACKPOT=60;
// Sprungfenster vor dem Biss, aus der Sprungkurve berechnet: Wer in diesem Fenster abspringt, ist während des
// ganzen Bisses (±SHARK_BITE) höher als SHARK_SAFE. Ideal = Mitte des Fensters. Gemessen (Bot, 375 px):
// mit 0,3–0,4 s Reaktionszeit auf „Ring wird grün" muss es reichen – Kinder reagieren langsamer als Erwachsene.
const SHARK_WIN0=0.749, SHARK_WIN1=0.108, SHARK_IDEAL=0.4286;
function sharkSea(){ return H*0.6; }
function sharkPX(){ return Math.min(W*0.46, 320); }
function sharkScale(){ return clamp(W/340, 1, 1.35); }
function sharkSpeed(t){ return 270+Math.min(t,32)*2.5; }
function sharkDist(t0,t1){ // genaue Strecke zwischen zwei Zeitpunkten – damit Perlenbögen exakt auf der Sprungbahn liegen
  const f=t=>{ const c=Math.min(t,32); return 270*t + 1.25*c*c + (t>32 ? 80*(t-32) : 0); };
  return f(t1)-f(t0);
}
function sharkJumpH(tau){ return Math.max(0, SHARK_JUMP*tau - SHARK_G/2*tau*tau); }
const SHARK_AIR=2*SHARK_JUMP/SHARK_G;
function initShark(){
  Object.assign(bonus,{ x:0, h:0, jt:null, tapBuf:0, threats:[], nextT:4.2, lastT:-9, nextRowT:1.0,
    bites:0, dodged:0, perfect:0, gemDone:false, ending:0, survived:false, escapeT:0, trail:[] });
}
function sharkXAt(time){ return bonus.x + sharkDist(bonus.t, time); }
function sharkAddThreat(T, kind){
  const b=bonus; b.threats.push({T, kind, done:false, hit:false}); b.lastT=T;
  // Perlenbogen genau auf der idealen Sprungbahn – wer im richtigen Moment springt, sammelt alle
  for(const tau of [0.14,0.28,0.43,0.57,0.71]){ const tt=T-SHARK_IDEAL+tau; b.ents.push({type:'pearl', x:sharkXAt(tt), h:sharkJumpH(tau)+16, r:9}); }
}
function scheduleShark(){
  const b=bonus;
  while(b.nextT < b.t+SHARK_WARN+1.7 && b.nextT < SHARK_TIME-1){
    const r=Math.random(), tempo=1-Math.min(b.nextT/SHARK_TIME,1)*0.18; // wird mit der Zeit etwas dichter
    const kind = b.nextT<9 ? 'snap' : r<0.45 ? 'snap' : r<0.72 ? 'front' : 'double';
    let T=b.nextT;
    if(kind==='front') T=Math.max(T, b.lastT+2.4);                      // Abtauchen braucht Platz zum vorigen Angriff
    if(kind==='double'){ sharkAddThreat(T,'snap'); sharkAddThreat(T+1.1,'snap'); b.nextT=T+1.1+rand(1.8,2.5)*tempo; }
    else if(kind==='front'){ sharkAddThreat(T,'front'); b.nextT=T+rand(2.6,3.1)*tempo; }
    else { sharkAddThreat(T,'snap'); b.nextT=T+rand(1.5,2.7)*tempo; }
    // Ein Kristall pro Flucht – in einer ruhigen Lücke, genau auf Sprunghöhe
    if(!b.gemDone && T>11 && b.nextT-b.lastT>=2.4){ b.gemDone=true; const tc=b.lastT+1.2;
      b.ents.push({type:'gem', x:sharkXAt(tc), h:sharkJumpH(SHARK_IDEAL)+16, r:13, T:tc}); }
  }
  // Perlenreihen auf dem Wasser in den ruhigen Momenten
  while(b.nextRowT < b.t+1.4){
    const T=b.nextRowT; b.nextRowT+=1.25;
    if(T>SHARK_TIME+1 || b.threats.some(th=>Math.abs(th.T-T)<0.75) || b.ents.some(e=>e.type==='gem' && Math.abs(e.T-T)<0.8)) continue;
    for(let k=0;k<4;k++) b.ents.push({type:'pearl', x:sharkXAt(T+k*0.08), h:16, r:9});
  }
}
function sharkFloat(txt,col){ const b=bonus; b.floats.push({x:b.x, y:sharkSea()-b.h-70, txt, col, life:1.1}); }
function sharkBite(){
  const b=bonus; b.bites++; const lost=Math.min(15,b.pearls); b.pearls-=lost; b.hurtT=1.1; b.shakeT=0.3;
  sharkFloat(lost?'-'+lost+' ◐':'Autsch!','#ffb3b3'); Audio.sfx.snap();
}
function updateShark(dt){
  const b=bonus;
  b.t+=dt; if(b.hurtT>0) b.hurtT-=dt;
  b.x+=sharkSpeed(b.t)*dt;
  if(b.tap) b.tapBuf=0.15; else if(b.tapBuf>0) b.tapBuf-=dt;      // kurz vor der Landung getippt = Sprung direkt bei der Landung
  if(b.ending<=0 && b.jt===null && b.tapBuf>0){
    b.jt=b.t; b.tapBuf=0; Audio.sfx.jump();
    const th=b.threats.find(x=>!x.done && Math.abs((x.T-b.t)-SHARK_IDEAL)<0.07);
    if(th){ b.perfect++; b.pearls+=5; sharkFloat('PERFEKT! +5','#7dffb0'); }
  }
  if(b.jt!==null){ const tau=b.t-b.jt;                               // Sprungkurve exakt, unabhängig von der Bildrate
    if(tau>=SHARK_AIR){ b.jt=null; b.h=0; for(let i=0;i<6;i++) b.parts.push({x:b.x+rand(-14,14), h:0, vx:rand(-70,70), vh:rand(90,210), life:0.5}); }
    else b.h=sharkJumpH(tau); }
  if(b.ending<=0) scheduleShark();
  for(const th of b.threats){
    if(th.done) continue; const d=b.t-th.T;
    if(b.ending>0){ if(d>SHARK_BITE) th.done=true; continue; }
    if(d>=-SHARK_BITE && b.h<SHARK_SAFE){ th.done=true; th.hit=true; sharkBite(); }
    else if(d>SHARK_BITE){ th.done=true; b.dodged++; sharkFloat(pick(['Ausgewichen!','Knapp!','Puh!']),'#ffffff'); }
  }
  b.threats=b.threats.filter(th=>b.t-th.T<1.5);
  const py=b.h+16;                                                   // Körpermitte über dem Wasser
  for(const e of b.ents){ if(e.got) continue; const dx=e.x-b.x, dy=e.h-py, rr=e.r+20; if(dx*dx+dy*dy>rr*rr) continue; e.got=true;
    if(e.type==='pearl'){ b.pearls+=2; Audio.sfx.collect(b.pearls/2); }
    else { b.gems++; sharkFloat('💎 +1','#d6c4ff'); Audio.sfx.chime(); } }
  b.ents=b.ents.filter(e=>!e.got && e.x>b.x-W);
  for(const p of b.parts){ p.x+=p.vx*dt; p.vh-=900*dt; p.h+=p.vh*dt; p.life-=dt; }
  b.parts=b.parts.filter(p=>p.life>0);
  b.trail.push({x:b.x, h:b.h}); if(b.trail.length>20) b.trail.shift();
  if(b.ending>0){ b.ending-=dt; if(b.ending<=0) endBonus(); }
  else if(b.bites>=SHARK_BITES){ b.ending=1.8; b.survived=false; bonusMsg('🦈 Erwischt! Deine Beute ist sicher.'); }
  else if(b.t>=SHARK_TIME && b.threats.every(th=>th.done)){
    b.ending=2.4; b.survived=true; b.escapeT=b.t; b.tokens=1; b.pearls+=SHARK_JACKPOT;
    bonusMsg('🏝 Geschafft! Der Hai gibt auf!',2.4); sharkFloat('Jackpot +'+SHARK_JACKPOT+' ◐','#ffe36b'); Audio.sfx.chest(); }
}
// Haltung des Hais hinter dir: Abstand (px hinter dem Surfer), Maul, Abtauchen, Alarm
function sharkPose(){
  const b=bonus; let gap=96+Math.sin(b.t*1.4)*10, jaw=0.12+0.08*Math.sin(b.t*3), dive=0, alert=0;
  if(b.ending>0 && b.survived) gap+=(b.t-b.escapeT)*300;            // gibt auf und fällt zurück
  for(const th of b.threats){ const d=b.t-th.T;
    if(th.kind==='snap'){
      if(d>=-SHARK_WARN && d<-0.32){ const u=smooth((d+SHARK_WARN)/(SHARK_WARN-0.32)); gap=lerp(gap,64,u); jaw=lerp(jaw,0.3,u); alert=1; } // setzt zum Sprint an
      else if(d>=-0.32 && d<0){ const u=(d+0.32)/0.32; gap=lerp(64,-8,u*u); jaw=1; alert=1; }                                          // schnappt zu
      else if(d>=0 && d<0.7){ gap=lerp(-8,gap,smooth(d/0.7)); jaw=Math.max(0,1-d*5); }                                                // fällt zurück
    } else { // taucht ab, um von vorn anzugreifen
      const a=smooth(clamp((d+SHARK_WARN+0.4)/0.4,0,1)), z=smooth(clamp((0.7-d)/0.4,0,1)); dive=Math.max(dive, Math.min(a,z));
    }
  }
  return {gap,jaw,dive,alert};
}
// Riesenhai: Schnauze bei (x,y), dir 1 = schaut nach rechts. jaw 0..1 = Maul offen.
function drawBigShark(x,y,dir,sc,jaw,eyeRed,rot){
  ctx.save(); ctx.translate(x,y); ctx.scale(sc*dir,sc); if(rot) ctx.rotate(rot);
  const g=ctx.createLinearGradient(0,-34,0,30); g.addColorStop(0,'#46637a'); g.addColorStop(0.5,'#7895ab'); g.addColorStop(0.64,'#e3ebf0'); g.addColorStop(1,'#c9d5dd');
  ctx.fillStyle='#46637a';
  ctx.beginPath(); ctx.moveTo(-176,-4); ctx.quadraticCurveTo(-196,-28,-222,-58); ctx.quadraticCurveTo(-210,-18,-212,2); ctx.quadraticCurveTo(-208,18,-216,32); ctx.quadraticCurveTo(-194,16,-176,8); ctx.closePath(); ctx.fill(); // Schwanzflosse
  ctx.beginPath(); ctx.moveTo(-60,-30); ctx.quadraticCurveTo(-78,-50,-100,-80); ctx.quadraticCurveTo(-102,-50,-114,-27); ctx.closePath(); ctx.fill();                                            // Rückenflosse
  ctx.fillStyle='#56738a'; ctx.beginPath(); ctx.moveTo(-52,18); ctx.quadraticCurveTo(-70,40,-94,54); ctx.quadraticCurveTo(-84,30,-78,16); ctx.closePath(); ctx.fill();                              // Brustflosse
  // Maulinneres + Unterkiefer (dreht um das Kiefergelenk)
  const hx=-36, hy=11, a=jaw*0.55;
  const lj=(px,py)=>{ const dx=px-hx, dy=py-hy; return [hx+dx*Math.cos(a)-dy*Math.sin(a), hy+dx*Math.sin(a)+dy*Math.cos(a)]; };
  const tip=lj(-1,5);
  if(jaw>0.05){ ctx.fillStyle='#5a1020'; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(2,1); ctx.lineTo(tip[0],tip[1]); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; for(let i=0;i<5;i++){ const u=i/5+0.08, p=lj(lerp(hx+4,-4,u), lerp(hy+1,6,u)); // untere Zähne
      ctx.beginPath(); ctx.moveTo(p[0]-2.6,p[1]+1); ctx.lineTo(p[0]+2.6,p[1]+1); ctx.lineTo(p[0],p[1]-5); ctx.closePath(); ctx.fill(); } }
  ctx.fillStyle='#c9d5dd'; ctx.beginPath(); { const p1=lj(hx,hy), p2=lj(-1,5), p3=lj(-8,12), p4=lj(-30,22), p5=lj(-46,18);
    ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.lineTo(p4[0],p4[1]); ctx.lineTo(p5[0],p5[1]); } ctx.closePath(); ctx.fill();
  // Körper mit Oberkiefer
  ctx.fillStyle=g; ctx.beginPath();
  ctx.moveTo(2,1); ctx.quadraticCurveTo(-8,-26,-60,-32); ctx.quadraticCurveTo(-128,-35,-180,-6); ctx.lineTo(-180,7);
  ctx.quadraticCurveTo(-120,30,-56,24); ctx.lineTo(hx,hy+2); ctx.quadraticCurveTo(-14,8,2,1); ctx.closePath(); ctx.fill();
  if(jaw>0.05){ ctx.fillStyle='#fff'; for(let i=0;i<6;i++){ const u=i/6+0.06, px=lerp(hx+3,-2,u), py=lerp(hy+2,2,u); // obere Zähne
    ctx.beginPath(); ctx.moveTo(px-2.6,py-1); ctx.lineTo(px+2.6,py-1); ctx.lineTo(px,py+5.5); ctx.closePath(); ctx.fill(); } }
  ctx.strokeStyle='rgba(40,60,80,.45)'; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<3;i++){ ctx.moveTo(-46-i*6,-4); ctx.quadraticCurveTo(-49-i*6,4,-46-i*6,13); } ctx.stroke();                     // Kiemen
  if(eyeRed){ const eg=ctx.createRadialGradient(-22,-9,1,-22,-9,13); eg.addColorStop(0,'rgba(255,60,60,.9)'); eg.addColorStop(1,'rgba(255,60,60,0)');

  ctx.fillStyle='#0d1620'; ctx.beginPath(); ctx.arc(-22,-9,3.4,0,TAU); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-21,-10,1,0,TAU); ctx.fill();
  ctx.restore();
}
function vnoise(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return lerp(hash01(i), hash01(i+1), u); }
function sharkCliffs(off, sea, col, hk, seed, step){

}
function drawShark(){
  const b=bonus, t=perfNow(), sea=sharkSea(), PX=sharkPX(), sc=sharkScale(), camX=b.x-PX, X=x=>x-camX;

      ctx.fillStyle='rgba(255,240,225,.8)'; ctx.beginPath(); ctx.ellipse(fx-16*sc,sea+2,14,3,0,0,TAU); ctx.fill(); }

// ---------- 🐉 Leviathan-Ritt ----------
// Du surfst im Sturm auf dem Rücken eines Seeungeheuers – seine Buckel sind deine Wellen, dazwischen liegt Wasser.
// Steuerung wie im Hauptspiel: HALTEN = bergab Schwung holen, LOSLASSEN = springen (über das Wasser zum nächsten Buckel).
// Keine Stürze, Wasser bremst nur. Am Ende hebt es den Kopf und schleudert dich hoch – mit genug Schwung durch den Kristallring.
// Schwung = Vorwärtstempo: HALTEN auf dem Rücken baut ihn auf, Wasser kostet viel – wer nie springt, bleibt langsam (gemessen).
const LEVI_RIDE=36, LEVI_G=1150, LEVI_PUMP=170, LEVI_DECAY=40, LEVI_MIN=230, LEVI_MAX=640, LEVI_THICK=74;
const LEVI_RING_SPEED=480, LEVI_RING_DX=750; // ab diesem Schwung trifft der Wurf den Ring
function leviLaunchVX(sp){ return clamp(0.62*sp+150, 300, 700); }
function leviArcY(vx,dx){ const T=dx/vx; return -820*T + 820/2*T*T; } // Höhe der Wurfbahn nach dx (relativ zum Abwurf)
function leviJump(vx){ return 470+0.12*vx; }
function leviZoom(){ return clamp(W/480, 0.7, 1); }
function leviHump(x){
  for(const hp of bonus.humps){ if(x<hp.x0) return 0; if(x<hp.x0+hp.w){ const u=(x-hp.x0)/hp.w;
    if(hp.neck) return hp.h*Math.pow(u,1.6); const s=Math.sin(Math.PI*u); return hp.h*s*s; } }
  return 0;
}
function leviGround(x){ return -leviHump(x); }   // Meeresspiegel = 0, nach oben negativ
function leviSlope(x){ return (leviGround(x+2)-leviGround(x-2))/4; }
function leviAddHump(x0,w,h,neck){
  const b=bonus, hp={x0,w,h,neck:!!neck}; b.humps.push(hp); b.hx=x0+w;
  if(!neck) for(let k=0;k<3;k++){ const x=x0+(0.6+k*0.09)*w; b.ents.push({type:'pearl', x, y:-leviHump(x)-18, r:9}); } // auf dem Abhang
  return hp;
}
function leviNextHump(){
  const b=bonus;
  if(!b.neckAdded && b.t>LEVI_RIDE-4){ // Finale: der Hals mit dem Kopf
    b.neckAdded=true; const x0=b.hx+rand(70,120), w=780, h=280; b.neck=leviAddHump(x0,w,h,true);
    // Ring genau dort, wo die Wurfbahnen zwischen Ring-Schwung und Höchsttempo liegen – darunter fliegt man drunter durch
    const y1=leviArcY(leviLaunchVX(LEVI_RING_SPEED),LEVI_RING_DX), y2=leviArcY(leviLaunchVX(LEVI_MAX),LEVI_RING_DX);
    b.ring={x:x0+w+LEVI_RING_DX, y:-h+(y1+y2)/2-16, tol:Math.abs(y1-y2)/2+14, hit:false, burst:0}; b.hx=Infinity; return; }
  const k=clamp(b.t/28,0,1), w=rand(380,540), h=Math.min(w*0.4, rand(80,115)+k*rand(15,60));
  const gap = b.humps.length<2 ? 70 : rand(80,140)+k*rand(0,60);            // Wasser zwischen den Buckeln: drüberspringen!
  // Perlenbogen über dem Wasser – auf der Bahn eines Sprungs bei mittlerem Schwung
  const cx=b.hx+gap*0.5, apex=leviJump(450)**2/(2*LEVI_G);
  for(let i=0;i<5;i++){ const u=(i-2)/3.3; b.ents.push({type:'pearl', x:cx+u*450*leviJump(450)/LEVI_G, y:-apex*(1-u*u)-14, r:9}); }
  leviAddHump(b.hx+gap, w, h);
}
function initLevi(){
  const b=bonus, Z=leviZoom();
  Object.assign(b,{ humps:[], hx:-260, neckAdded:false, neck:null, ring:null, onNeck:false, neckSpeed:0, launched:false, launchT:0, landed:false,
    ending:0, onGround:true, airT:0, flow:340, wetT:0, wetHit:false, wasHold:false, jumpBuf:0, clean:0, jumps:0, splashes:0, maxH:0,
    flash:0, bolt:null, nextBolt:2.5, nextShake:6.5, trail:[], finaleHint:false });
  leviAddHump(-260, 520, 120);  // Start auf der ersten Kuppe (Scheitel bei x=0)
  b.x=0; b.y=leviGround(0); b.vx=340; b.vy=0; b.camY=-(H/Z)*0.72;
}
function leviFloat(txt,col){ const b=bonus; b.floats.push({x:b.x, y:b.y-70, txt, col, life:1.1}); }
function leviDoJump(){ const b=bonus; b.vy=Math.min(0,b.vy)*0.5-leviJump(b.vx); b.onGround=false; b.airT=0.001; b.jumpBuf=0; b.jumps++; Audio.sfx.jump(); }
function updateLevi(dt){
  const b=bonus, Z=leviZoom(), VW=W/Z, VH=H/Z;
  b.t+=dt;
  while(b.hx < b.x+VW*1.6) leviNextHump();
  b.humps=b.humps.filter(h=>h.x0+h.w > b.x-VW);
  // Loslassen = Sprung (auch ein kurzes Tippen); kurz vor der Landung losgelassen zählt bei der Landung
  if((b.wasHold && !b.holding) || (b.tap && !b.holding)) b.jumpBuf=0.12; else if(b.jumpBuf>0) b.jumpBuf-=dt;
  b.wasHold=b.holding;
  const n=b.neck;
  b.x+=b.vx*dt;
  if(n && !b.launched && b.x>=n.x0+n.w){ // Kopf erreicht: Katapult nach oben
    b.launched=true; b.launchT=b.t; b.onNeck=false; b.onGround=false; b.tokens=1;
    b.vx=leviLaunchVX(b.neckSpeed||b.flow); b.vy=-820; b.y=-n.h;
    b.shakeT=0.4; Audio.sfx.roar(); bonusMsg('🐉 KATAPULT!',1.4); }
  if(b.launched){ // Wurf: eigene, feste Flugbahn (Ring-Höhe ist darauf abgestimmt)
    b.vy+=820*dt; b.y+=b.vy*dt;
    if(b.y>=0){ b.y=0; b.vy=0; b.vx*=1-2*dt;
      if(!b.landed){ b.landed=true; b.ending=1.8; Audio.sfx.splash();
        for(let i=0;i<14;i++) b.parts.push({x:b.x+rand(-20,20), y:0, vx:rand(-120,120), vy:-rand(150,420), life:0.9});
        if(!(b.ring&&b.ring.hit)) bonusMsg('🌊 Gelandet! Mehr Schwung = Ring',2); } }
  } else if(b.onGround){
    const gy=leviGround(b.x), wet=leviHump(b.x)<1, onNeck=n && b.x>=n.x0;
    b.vy=(gy-b.y)/dt; b.y=gy;                           // folgt dem Rücken
    if(onNeck){ if(!b.onNeck){ b.onNeck=true; b.neckSpeed=clamp(b.flow,LEVI_MIN,LEVI_MAX); bonusMsg('Er hebt den Kopf!',1.4); }
      b.vx=b.neckSpeed; }                               // der Hals trägt dich mit deinem Schwung nach oben
    else if(wet){ b.wetT+=dt;                          // reingerollt: kurze Gnadenfrist am Rand – wer jetzt noch loslässt, springt ohne Strafe
      if(b.wetT>=0.15 && !b.wetHit){ b.wetHit=true; b.vx*=0.65; b.splashes++; leviFloat('Platsch!','#cfe0e6'); Audio.sfx.splash(); }
      if(b.wetHit) b.vx-=b.vx*1.0*dt; }                 // im Wasser geht es zäh voran
    else if(b.holding) b.vx+=LEVI_PUMP*dt;              // HALTEN = Schwung holen
    else b.vx-=LEVI_DECAY*dt;
    b.vx=clamp(b.vx,LEVI_MIN,LEVI_MAX);
    if(!wet){ b.wetT=0; b.wetHit=false; }
    if(b.jumpBuf>0 && !onNeck) leviDoJump();
  } else {
    b.airT+=dt; b.vy+=LEVI_G*dt; b.y+=b.vy*dt;
    const gy=leviGround(b.x);
    if(b.y>=gy){ b.y=gy; b.onGround=true;
      b.wetT=0; b.wetHit=leviHump(b.x)<1;
      if(b.wetHit){ b.vx*=0.65; b.splashes++; leviFloat('Platsch!','#cfe0e6'); Audio.sfx.splash();
        for(let i=0;i<8;i++) b.parts.push({x:b.x+rand(-14,14), y:0, vx:rand(-90,90), vy:-rand(120,300), life:0.6}); }
      else if(leviSlope(b.x)>0.12){ b.clean++; b.vx=Math.min(LEVI_MAX,b.vx+30); leviFloat('Sauber!','#9fffd8'); Audio.sfx.land(true); }
      else Audio.sfx.land(true);
      if(b.jumpBuf>0 && !(n && b.x>=n.x0)) leviDoJump(); }
  }
  b.maxH=Math.max(b.maxH,-b.y);
  if(!b.onNeck && !b.launched) b.flow+=(b.vx-b.flow)*Math.min(1,dt/3); // Schwung = Tempo der letzten Sekunden
  if(!b.finaleHint && b.t>LEVI_RIDE-9){ b.finaleHint=true; bonusMsg('Gleich hebt er den Kopf – sammle Schwung!',2.2); }
  // Ring
  const r=b.ring;
  if(r && !r.hit && b.launched && Math.abs(b.x-r.x)<28 && Math.abs((b.y-16)-r.y)<r.tol){
    r.hit=true; r.burst=1; b.gems++; b.pearls+=40; leviFloat('💎 +1  ◐ +40','#e2d4ff'); bonusMsg('💎 Volltreffer!',1.6); Audio.sfx.chest(); b.shakeT=0.25; }
  if(r && r.burst>0) r.burst-=dt*1.5;
  // Sammeln
  const cy=b.y-16;
  for(const e of b.ents){ if(e.got) continue; const dx=e.x-b.x, dy=e.y-cy, rr=e.r+22; if(dx*dx+dy*dy>rr*rr) continue; e.got=true;
    if(e.type==='pearl'){ b.pearls+=2; Audio.sfx.collect(b.pearls/2); }
    else if(e.type==='bag'){ b.pearls+=6; leviFloat('+6','#eafcff'); Audio.sfx.power(); }
    else { b.pearls+=15; leviFloat('Schatz! +15','#ffe36b'); Audio.sfx.chest(); } }
  for(const e of b.ents){ if(e.vy===undefined || e.got) continue; // abgeschüttelte Schätze schweben langsam herab
    e.vy=Math.min(e.vy+460*dt, 42); e.x+=e.vx*dt; e.vx*=1-0.7*dt; e.y+=e.vy*dt; }
  b.ents=b.ents.filter(e=>!e.got && e.x>b.x-VW*0.6 && e.y<30);
  // Er schüttelt sich: Schätze fliegen von einer Kuppe weiter vorn hoch
  if(!b.neckAdded && b.t>=b.nextShake){ b.nextShake+=rand(6,8); b.shakeT=0.6; Audio.sfx.roar(); bonusMsg('Er schüttelt sich – Schätze!',1.5);
    const hp=b.humps.find(h=>!h.neck && h.x0+h.w*0.5>b.x+VW*0.8);
    if(hp){ const cx=hp.x0+hp.w*0.5;
      for(let i=0;i<4;i++) b.ents.push({type:i===0?'chest':'bag', x:cx+rand(-30,30), y:-hp.h-10, vx:rand(40,240), vy:-rand(300,440), r:i===0?16:12}); } }
  // Gewitter
  b.nextBolt-=dt; if(b.nextBolt<=0){ b.nextBolt=rand(2.5,5); b.flash=1; b.bolt={x:rand(0.15,0.95), seed:randi(0,9999), life:0.3}; Audio.sfx.thunder(); }
  if(b.flash>0) b.flash-=dt*2.5;
  if(b.bolt){ b.bolt.life-=dt; if(b.bolt.life<=0) b.bolt=null; }
  for(const p of b.parts){ p.x+=p.vx*dt; p.vy+=900*dt; p.y+=p.vy*dt; p.life-=dt; }
  b.parts=b.parts.filter(p=>p.life>0);
  b.trail.push({x:b.x, y:b.y}); if(b.trail.length>20) b.trail.shift();
  // Kamera: Meer bei 2/3 der Höhe, steigt mit, wenn du hoch fliegst
  const ty=Math.min(-VH*0.72, b.y-VH*0.3); b.camY+=(ty-b.camY)*Math.min(1,dt*5);
  if(b.ending>0){ b.ending-=dt; if(b.ending<=0) endBonus(); }
}

function drawLevi(){
